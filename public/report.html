<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Breakdown — GVC Facility Asset Manager</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; background:#F0F2F6; color:#1A1A2E; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .card { background:#fff; border-radius:16px; max-width:440px; width:100%; padding:32px 28px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
  .logo-row { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .logo { width:44px; height:44px; border-radius:50%; overflow:hidden; flex-shrink:0; }
  .logo img { width:100%; height:100%; object-fit:contain; }
  h1 { font-size:17px; color:#1A3566; }
  .sub { font-size:12.5px; color:#6B7280; margin-top:2px; margin-bottom:8px; }
  label { font-size:12px; font-weight:600; color:#1A3566; display:block; margin-bottom:6px; margin-top:16px; }
  input, textarea, select { width:100%; padding:11px 14px; border:1px solid #E2E6ED; border-radius:8px; font-size:14px; font-family:inherit; }
  textarea { resize:vertical; min-height:80px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { width:100%; margin-top:22px; padding:14px; border:none; border-radius:10px; background:#1A3566; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .result { margin-top:18px; padding:14px; border-radius:10px; font-size:13.5px; line-height:1.6; display:none; }
  .result.show { display:block; }
  .result.success { background:#E8F8EF; color:#065F46; }
  .result.error { background:#FDE8E6; color:#991B1B; }
  .footer { text-align:center; font-size:11px; color:#9CA3AF; margin-top:22px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo"><img src="/logo.png" alt="GVC"></div>
      <div>
        <h1>Report a Breakdown</h1>
      </div>
    </div>
    <div class="sub">No login needed — the maintenance team is notified the moment you submit.</div>

    <form id="reportForm">
      <label for="reporterName">Your Name *</label>
      <input id="reporterName" type="text" required>

      <label for="reporterRole">Your Role / Department</label>
      <input id="reporterRole" type="text" placeholder="e.g. Ward Nurse, Procurement">

      <label for="reporterContact">Your Phone or Email</label>
      <div class="sub" style="margin:0 0 6px">Optional — so we can tell you once it's actually fixed</div>
      <input id="reporterContact" type="text" placeholder="e.g. +255 7XX XXX XXX or you@email.com">

      <div class="row2">
        <div>
          <label for="floorSelect">Floor *</label>
          <select id="floorSelect" required onchange="onFloorChange()">
            <option value="" disabled selected>Loading floors…</option>
          </select>
          <input id="floorOther" type="text" placeholder="Type the floor" style="display:none;margin-top:6px">
        </div>
        <div>
          <label for="roomSelect">Room / Zone</label>
          <select id="roomSelect" onchange="onRoomChange()" disabled>
            <option value="" selected>Choose a floor first…</option>
          </select>
          <input id="roomOther" type="text" placeholder="Type the room/zone" style="display:none;margin-top:6px">
        </div>
      </div>

      <label for="category">What kind of issue is it? *</label>
      <select id="category" required>
        <option value="" disabled selected>Choose one…</option>
        <option value="Electrical">Electrical — lights, power, sockets, breakers, generator/UPS, fire alarm & smoke detectors</option>
        <option value="Mechanical">Mechanical — AC/cooling, water/plumbing, leaks, lifts, fire sprinklers</option>
        <option value="NonTechnical">Non-technical — furniture, fixtures, general building upkeep</option>
        <option value="TenantRelated">Tenant-related — tenant complaints, retail unit issues</option>
      </select>

      <label for="description">What's wrong? *</label>
      <textarea id="description" placeholder="Describe what you're seeing — noise, leak, not working, etc." required></textarea>

      <label for="photo">Photo (optional)</label>
      <div class="sub" style="margin:0 0 6px">A quick picture helps the team understand the issue faster</div>
      <div style="display:flex;gap:10px">
        <button type="button" id="takePhotoBtn" style="flex:1;margin-top:0;padding:11px;background:#fff;border:1px solid #E2E6ED;color:#1A3566;font-size:13px">📷 Take Photo</button>
        <button type="button" id="choosePhotoBtn" style="flex:1;margin-top:0;padding:11px;background:#fff;border:1px solid #E2E6ED;color:#1A3566;font-size:13px">🖼️ Choose File</button>
      </div>
      <input id="photoCamera" type="file" accept="image/*" capture="environment" style="display:none">
      <input id="photoFile" type="file" accept="image/*" style="display:none">
      <div id="photoPreviewName" style="font-size:11.5px;color:#6B7280;margin-top:8px"></div>

      <button type="submit" id="submitBtn">Submit Report</button>
    </form>

    <div id="result" class="result"></div>

    <details style="margin-top:20px;text-align:center">
      <summary style="font-size:11.5px;color:#9CA3AF;cursor:pointer">Printing signage for this page?</summary>
      <div style="margin-top:10px">
        <img id="pageQrImg" src="" alt="QR code to this Report a Breakdown page" style="width:130px;height:130px;border-radius:6px;border:1px solid #E2E6ED">
        <div style="margin-top:6px">
          <button type="button" onclick="downloadPageQr()" style="padding:5px 12px;font-size:11px;font-weight:600;border:1px solid #E2E6ED;border-radius:6px;background:#fff;color:#1A3566;cursor:pointer">↓ Download QR Code</button>
        </div>
      </div>
    </details>

    <div class="footer">Gracing Ventures · BIM Information Management · Tanzania</div>
  </div>

<script>
  const pageQrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(window.location.origin + '/report.html')}`;
  document.getElementById('pageQrImg').src = pageQrUrl;

  async function downloadPageQr() {
    try {
      const resp = await fetch(pageQrUrl);
      if (!resp.ok) throw new Error('QR service returned ' + resp.status);
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = 'report-a-breakdown-qr.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    } catch (err) {
      alert('Could not download QR code: ' + err.message);
    }
  }
</script>

<script>
document.getElementById('takePhotoBtn').addEventListener('click', () => document.getElementById('photoCamera').click());
document.getElementById('choosePhotoBtn').addEventListener('click', () => document.getElementById('photoFile').click());

let selectedPhotoFile = null;
function handlePhotoSelected(e) {
  selectedPhotoFile = e.target.files[0] || null;
  document.getElementById('photoPreviewName').textContent = selectedPhotoFile ? `✓ ${selectedPhotoFile.name}` : '';
}
document.getElementById('photoCamera').addEventListener('change', handlePhotoSelected);
document.getElementById('photoFile').addEventListener('change', handlePhotoSelected);

// Real floors/rooms from the Asset Register — dropdowns instead of
// free text, so whatever a reporter picks EXACTLY matches an asset's
// stored location later, no fuzzy text matching needed. "Other" stays
// available on both, since not every physical space necessarily has a
// registered asset yet — this shouldn't block a genuine report.
let locationData = { floors: [] };

async function loadLocations() {
  const floorSelect = document.getElementById('floorSelect');
  try {
    const resp = await fetch('/api/report-issue?locations=true');
    const data = await resp.json();
    locationData = data.floors ? data : { floors: [] };
  } catch (err) {
    locationData = { floors: [] };
  }
  floorSelect.innerHTML = `<option value="" disabled selected>Choose one…</option>
    ${locationData.floors.map(f => `<option value="${f.floor}">${f.floor}</option>`).join('')}
    <option value="__other__">Other (not listed)</option>`;
}
loadLocations();

function onFloorChange() {
  const floorVal = document.getElementById('floorSelect').value;
  const floorOther = document.getElementById('floorOther');
  const roomSelect = document.getElementById('roomSelect');
  const roomOther = document.getElementById('roomOther');

  floorOther.style.display = floorVal === '__other__' ? 'block' : 'none';
  roomOther.style.display = 'none';
  roomOther.value = '';

  if (floorVal === '__other__') {
    roomSelect.innerHTML = `<option value="" selected>—</option><option value="__other__">Other (not listed)</option>`;
    roomSelect.disabled = false;
    return;
  }

  const floorEntry = locationData.floors.find(f => f.floor === floorVal);
  const rooms = floorEntry ? floorEntry.rooms : [];
  roomSelect.innerHTML = `<option value="" selected>Choose one… (optional)</option>
    ${rooms.map(r => `<option value="${r}">${r}</option>`).join('')}
    <option value="__other__">Other (not listed)</option>`;
  roomSelect.disabled = false;
}

function onRoomChange() {
  const roomVal = document.getElementById('roomSelect').value;
  document.getElementById('roomOther').style.display = roomVal === '__other__' ? 'block' : 'none';
}

function getFloorValue() {
  const sel = document.getElementById('floorSelect').value;
  return sel === '__other__' ? document.getElementById('floorOther').value.trim() : sel;
}
function getRoomValue() {
  const sel = document.getElementById('roomSelect').value;
  return sel === '__other__' ? document.getElementById('roomOther').value.trim() : sel;
}

document.getElementById('reportForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const result = document.getElementById('result');

  const reporterName = document.getElementById('reporterName').value.trim();
  const reporterRole = document.getElementById('reporterRole').value.trim();
  const reporterContact = document.getElementById('reporterContact').value.trim();
  const floor = getFloorValue();
  const roomZone = getRoomValue();
  const category = document.getElementById('category').value;
  const description = document.getElementById('description').value.trim();
  const photoFile = selectedPhotoFile;

  if (!floor) {
    result.className = 'result error show';
    result.textContent = 'Please choose a floor (or select "Other" and type it in).';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Submitting…';
  result.className = 'result';

  try {
    let photoBase64 = null, photoFilename = null, photoContentType = null;
    if (photoFile) {
      photoBase64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(photoFile);
      });
      photoFilename = photoFile.name;
      photoContentType = photoFile.type;
    }

    const resp = await fetch('/api/report-issue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reporterName, reporterRole, reporterContact, floor, roomZone, category, description, photoBase64, photoFilename, photoContentType }),
    });
    const data = await resp.json();

    if (resp.ok && data.success) {
      result.className = 'result success show';
      result.textContent = data.message || 'Report submitted. The maintenance team has been notified.';
      document.getElementById('reportForm').reset();
      selectedPhotoFile = null;
      document.getElementById('photoPreviewName').textContent = '';
      document.getElementById('floorOther').style.display = 'none';
      document.getElementById('roomOther').style.display = 'none';
      document.getElementById('roomSelect').innerHTML = '<option value="" selected>Choose a floor first…</option>';
      document.getElementById('roomSelect').disabled = true;
    } else {
      result.className = 'result error show';
      result.textContent = data.error || 'Something went wrong. Please try again.';
    }
  } catch (err) {
    result.className = 'result error show';
    result.textContent = 'Network error: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Submit Report';
  }
});
</script>
</body>
</html>
