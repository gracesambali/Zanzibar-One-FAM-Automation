<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharmacy — GVC Facility Asset Manager</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; }
  :root { --navy:#8B1A1A; --navy-light:#A83232; --navy-pale:#F5DFDF; --bg:#F0F2F6; --white:#FFFFFF; --text:#1A1A2E; --muted:#6B7280; --border:#E2E6ED; --green:#1B7A43; --green-bg:#E8F8EF; --red:#B3261E; --red-bg:#FDE8E6; }
  body { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .header { background:var(--navy); color:#fff; padding:20px 32px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .header-left { display:flex; align-items:center; gap:14px; min-width:0; }
  .logo { width:46px; height:46px; border-radius:50%; overflow:hidden; flex-shrink:0; background:#fff; display:flex; align-items:center; justify-content:center; }
  .logo img { width:100%; height:100%; object-fit:contain; }
  .header h1 { font-size:19px; font-weight:700; letter-spacing:0.2px; }
  .header .sub { font-size:12.5px; color:rgba(255,255,255,0.8); margin-top:2px; }
  #logoutBtn { background:rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:9px 18px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
  #logoutBtn:hover { background:rgba(255,255,255,0.22); }

  .page-wrap { width:100%; margin:0 auto; padding:28px clamp(24px, 4vw, 80px) 48px; display:flex; gap:32px; align-items:flex-start; }
  .main-col { flex:1 1 0%; min-width:500px; }
  .side-col { flex:0 0 28%; min-width:340px; max-width:460px; position:sticky; top:24px; display:flex; flex-direction:column; gap:20px; }
  @media (max-width:1200px) { .page-wrap { flex-direction:column; padding:20px 16px 40px; } .main-col { min-width:0; width:100%; } .side-col { flex-basis:auto; width:100%; min-width:0; max-width:none; position:static; } }

  .scan-buttons { display:flex; gap:16px; margin-bottom:24px; }
  .scan-btn { flex:1; padding:28px 20px; border-radius:16px; border:none; font-size:16px; font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:10px; transition:transform .1s; }
  .scan-btn:hover { transform:translateY(-2px); }
  .scan-btn .icon { font-size:34px; }
  .scan-in { background:var(--green-bg); color:var(--green); border:2px solid var(--green); }
  .scan-out { background:var(--red-bg); color:var(--red); border:2px solid var(--red); }

  .panel { background:#fff; border-radius:14px; padding:22px 24px; margin-bottom:20px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .panel-title { font-size:13px; font-weight:700; color:var(--navy); margin-bottom:16px; text-transform:uppercase; letter-spacing:0.04em; }
  .search-box { width:100%; padding:12px 16px; border:1px solid var(--border); border-radius:9px; font-size:14px; margin-bottom:16px; }

  /* Wide-screen table for the item list, matching the main system's
     density instead of a thin stacked list with wasted horizontal
     space - confirmed directly as the actual complaint. Collapses
     back to the simpler stacked row style on narrow/phone screens
     where a table would be genuinely worse. */
  .item-table { width:100%; border-collapse:collapse; font-size:13px; }
  .item-table th { text-align:left; padding:10px 12px; color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; border-bottom:2px solid var(--border); }
  .item-table td { padding:12px; border-bottom:1px solid #F0F2F6; }
  .item-table tr:hover td { background:var(--bg); cursor:pointer; }
  .item-table .item-name-cell { font-weight:600; color:var(--text); }
  .item-table .item-meta-cell { font-size:11px; color:var(--muted); margin-top:2px; }
  .item-qty-cell { text-align:right; font-weight:700; color:var(--navy); font-size:14.5px; }

  @media (max-width:700px) {
    .item-table thead { display:none; }
    .item-table, .item-table tbody, .item-table tr { display:block; width:100%; }
    .item-table tr { padding:12px 0; border-bottom:1px solid #F0F2F6; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .item-table td { padding:0; border:none; }
    .item-table td:nth-child(2), .item-table td:nth-child(3) { display:none; } /* Category and Location hidden on phone - name, quantity, and status are what actually matters when scanning on the go */
    .item-table td:first-child { flex:1; min-width:0; }
  }

  .badge { display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:10px; margin-top:4px; }
  .badge-low { background:var(--red-bg); color:var(--red); }
  .badge-ok { background:var(--green-bg); color:var(--green); }
  .empty-state { text-align:center; padding:36px 20px; color:#9CA3AF; font-size:13.5px; }

  .activity-stat { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid #F0F2F6; }
  .activity-stat:last-child { border-bottom:none; }
  .activity-stat .label { font-size:13px; color:var(--muted); font-weight:600; }
  .activity-stat .value { font-size:24px; font-weight:700; }
  .activity-in { color:var(--green); }
  .activity-out { color:var(--red); }

  .report-row { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .report-row-label { flex:1; font-size:13px; font-weight:600; color:var(--navy); }
  .report-btn-sm { padding:8px 16px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--navy); font-size:12px; font-weight:600; cursor:pointer; }
  .report-btn-sm:hover { background:var(--bg); border-color:var(--navy); }

  .recent-item { font-size:12.5px; padding:9px 0; border-bottom:1px solid #F0F2F6; color:var(--text); }
  .recent-item:last-child { border-bottom:none; }
  .recent-item .meta { color:#9CA3AF; }
  .hidden { display:none !important; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal { background:#fff; border-radius:14px; max-width:420px; width:100%; padding:20px; max-height:90vh; overflow-y:auto; }
  .modal label { font-size:11px; font-weight:600; color:#8B1A1A; display:block; margin-bottom:4px; }
  .modal input, .modal select { width:100%; padding:9px 12px; border:1px solid #E2E6ED; border-radius:8px; font-size:13px; margin-bottom:10px; }
  .modal button.primary { width:100%; padding:11px; border:none; border-radius:8px; background:#8B1A1A; color:#fff; font-weight:600; font-size:13.5px; cursor:pointer; }
  .modal button.secondary { width:100%; padding:11px; border:1px solid #E2E6ED; border-radius:8px; background:#fff; color:#8B1A1A; font-weight:600; font-size:13.5px; cursor:pointer; margin-top:8px; }
  .error-box { color:#B3261E; font-size:12px; margin-bottom:10px; display:none; }
  #accessBlocked { text-align:center; padding:60px 24px; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo"><img src="/selian-logo.png" alt="Logo" onerror="this.style.display='none'"></div>
      <div>
        <h1>Selian Lutheran Hospital Pharmacy</h1>
        <div class="sub">Facility Asset Management System</div>
      </div>
    </div>
    <button id="logoutBtn" onclick="logout()">Log Out</button>
  </div>

  <div id="accessBlocked" style="display:none">
    <div style="font-size:32px;margin-bottom:12px">🔒</div>
    <div style="font-size:15px;font-weight:700;color:#8B1A1A;margin-bottom:6px">Access Restricted</div>
    <div style="font-size:13px;color:#6B7280">This page is only available to the Pharmacy role.</div>
  </div>

  <div id="mainContent" class="page-wrap hidden">
    <div class="main-col">
      <div class="scan-buttons">
        <button class="scan-btn scan-in" onclick="openScanModal('IN')"><span class="icon">📷</span>Scan In</button>
        <button class="scan-btn scan-out" onclick="openScanModal('OUT')"><span class="icon">📷</span>Scan Out</button>
      </div>

      <div class="panel">
        <div class="panel-title">Inventory</div>
        <input id="itemSearch" class="search-box" type="text" placeholder="Search items…" oninput="renderItemList()">
        <div id="itemList"></div>
      </div>
    </div>

    <div class="side-col">
      <div class="panel">
        <div class="panel-title">Today's Activity</div>
        <div id="todayActivityContent">
          <div class="activity-stat"><span class="label">Loading…</span></div>
        </div>
        <div id="recentMovementsList" style="margin-top:4px"></div>
      </div>

      <div class="panel">
        <div class="panel-title">Reports</div>
        <div class="report-row">
          <span class="report-row-label">Daily</span>
          <button class="report-btn-sm" onclick="downloadMovementReport('today')">CSV</button>
          <button class="report-btn-sm" onclick="downloadMovementReportPdf('today')">PDF</button>
        </div>
        <div class="report-row">
          <span class="report-row-label">Weekly</span>
          <button class="report-btn-sm" onclick="downloadMovementReport('week')">CSV</button>
          <button class="report-btn-sm" onclick="downloadMovementReportPdf('week')">PDF</button>
        </div>
        <div class="report-row">
          <span class="report-row-label">Monthly</span>
          <button class="report-btn-sm" onclick="downloadMovementReport('month')">CSV</button>
          <button class="report-btn-sm" onclick="downloadMovementReportPdf('month')">PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let inventoryItemsCache = [];
    let scanModalMode = null;
    let scanModalStream = null;
    let scanModalReader = null;

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function init() {
      try {
        const resp = await fetch('/api/get-assets');
        if (resp.status === 401) { window.location.href = '/login'; return; }
        const data = await resp.json();
        // Confirmed directly: the same real role set already granted
        // genuine inventory permission on the backend - a Business
        // Owner or Procurement login already has real access to
        // every action this page uses, so the check here matches
        // that exactly rather than a separate, narrower rule that
        // could disagree with what the API itself actually allows.
        const allowedRoles = ['pharmacy', 'stock_keeper', 'procurement', 'system_admin', 'business_owner'];
        if (!allowedRoles.includes(data.role)) {
          document.getElementById('accessBlocked').style.display = 'block';
          return;
        }
        // Confirmed directly: the dedicated Pharmacy role genuinely
        // logs out here since this is their only page - but anyone
        // else visiting from the main dashboard just wants to close
        // this view and go back, not end their whole session
        // everywhere else it's open.
        const logoutBtn = document.getElementById('logoutBtn');
        if (data.role !== 'pharmacy') {
          logoutBtn.textContent = 'Back to Dashboard';
          logoutBtn.onclick = () => { window.location.href = '/dashboard'; };
        }
        logoutBtn.style.display = '';
        document.getElementById('mainContent').classList.remove('hidden');
        await loadItems();
        await loadTodayActivity();
      } catch (err) {
        document.getElementById('accessBlocked').innerHTML = `<div style="color:#B3261E">Could not load: ${err.message}</div>`;
        document.getElementById('accessBlocked').style.display = 'block';
      }
    }

    async function logout() {
      await fetch('/api/login', { method: 'DELETE' });
      window.location.href = '/login';
    }

    async function loadItems() {
      try {
        const resp = await fetch('/api/get-assets?inventoryItems=true');
        const data = await resp.json();
        inventoryItemsCache = data.items || [];
        renderItemList();
      } catch (err) {
        document.getElementById('itemList').innerHTML = `<div class="empty-state" style="color:#B3261E">Could not load inventory: ${err.message}</div>`;
      }
    }

    // Confirmed directly: a real, live count of what's actually
    // entered and left today, refreshed right after every scan so
    // it's genuinely current, not a number from whenever the page
    // happened to load.
    async function loadTodayActivity() {
      const content = document.getElementById('todayActivityContent');
      const recentList = document.getElementById('recentMovementsList');
      try {
        const resp = await fetch('/api/get-assets?inventoryMovementSummary=true&period=today');
        const data = await resp.json();
        content.innerHTML = `
          <div class="activity-stat"><span class="label">Items In</span><span class="value activity-in">+${data.totalIn}</span></div>
          <div class="activity-stat"><span class="label">Items Out</span><span class="value activity-out">-${data.totalOut}</span></div>
        `;
        const recent = (data.movements || []).slice(0, 8);
        recentList.innerHTML = recent.length === 0
          ? `<div class="recent-item" style="font-style:italic;color:#9CA3AF">Nothing recorded yet today.</div>`
          : recent.map(m => `
            <div class="recent-item">
              <span style="color:${m.movementType === 'IN' ? '#1B7A43' : '#B3261E'};font-weight:700">${m.movementType === 'IN' ? '↑' : '↓'} ${m.quantity}</span>
              ${escapeHtml(m.itemName)}
              <div class="meta">${escapeHtml(m.performedBy || '')} · ${new Date(m.performedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
            </div>`).join('');
      } catch (err) {
        content.innerHTML = `<div style="color:#B3261E;font-size:12px">Could not load: ${err.message}</div>`;
      }
    }

    // A real CSV, built from the exact same data the panel itself
    // shows — confirmed directly, so a report always matches what was
    // actually on screen, not a separately-computed approximation.
    function csvEscape(val) {
      const s = String(val ?? '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    async function downloadMovementReport(period) {
      try {
        const resp = await fetch(`/api/get-assets?inventoryMovementSummary=true&period=${period}`);
        const data = await resp.json();
        const rows = [['Date/Time', 'Item Code', 'Item Name', 'Type', 'Quantity', 'Unit', 'Reason', 'Department', 'Performed By']];
        (data.movements || []).forEach(m => {
          rows.push([
            new Date(m.performedAt).toLocaleString(), m.itemCode, m.itemName, m.movementType,
            m.quantity, m.unitOfMeasure || '', m.reason || '', m.department || '', m.performedBy || '',
          ]);
        });
        rows.push([]);
        rows.push(['Total In', data.totalIn]);
        rows.push(['Total Out', data.totalOut]);

        const csv = rows.map(row => row.map(csvEscape).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const label = period === 'today' ? 'daily' : period === 'week' ? 'weekly' : 'monthly';
        a.href = url;
        a.download = `pharmacy-${label}-report-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('Could not generate report: ' + err.message);
      }
    }

    // Matches the exact same "print window with a Download as PDF
    // button" pattern already established elsewhere in the app -
    // window.print() to the browser's own PDF output, not a real
    // binary generated server-side.
    async function downloadMovementReportPdf(period) {
      try {
        const resp = await fetch(`/api/get-assets?inventoryMovementSummary=true&period=${period}`);
        const data = await resp.json();
        const movements = data.movements || [];
        const label = period === 'today' ? 'Daily' : period === 'week' ? 'Weekly' : 'Monthly';

        const rowsHtml = movements.map(m => `
          <tr>
            <td>${new Date(m.performedAt).toLocaleString()}</td>
            <td>${escapeHtml(m.itemCode)}</td><td>${escapeHtml(m.itemName)}</td>
            <td style="color:${m.movementType === 'IN' ? '#1B7A43' : '#B3261E'};font-weight:700">${m.movementType}</td>
            <td style="text-align:right">${m.quantity} ${escapeHtml(m.unitOfMeasure || '')}</td>
            <td>${escapeHtml(m.reason || '—')}</td><td>${escapeHtml(m.department || '—')}</td><td>${escapeHtml(m.performedBy || '—')}</td>
          </tr>`).join('');

        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
          <html><head><title>Pharmacy ${label} Report</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 24px; color: #1A1A2E; }
            h1 { font-size: 18px; color: #8B1A1A; margin-bottom: 2px; }
            .meta { font-size: 11px; color: #6B7280; margin-bottom: 16px; }
            table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
            th, td { padding: 6px 8px; border-bottom: 1px solid #E2E6ED; text-align: left; }
            th { background: #F7F8FA; }
            .totals td { font-weight: 700; border-top: 2px solid #8B1A1A; }
            .download-btn { background:#8B1A1A; color:#fff; border:none; border-radius:8px; padding:10px 20px; font-size:13px; font-weight:600; cursor:pointer; margin-bottom:20px; }
            @media print { .download-btn { display:none; } }
          </style></head><body>
          <button class="download-btn" onclick="window.print()">↓ Download as PDF</button>
          <h1>Pharmacy ${label} Report</h1>
          <div class="meta">Generated ${new Date().toLocaleString()} · ${movements.length} movement${movements.length === 1 ? '' : 's'}</div>
          <table>
            <thead><tr><th>Date/Time</th><th>Item Code</th><th>Item Name</th><th>Type</th><th>Quantity</th><th>Reason</th><th>Department</th><th>Performed By</th></tr></thead>
            <tbody>${rowsHtml || '<tr><td colspan="8" style="text-align:center;color:#9CA3AF">No movements in this period.</td></tr>'}
              <tr class="totals"><td colspan="4">TOTALS</td><td style="text-align:right">In: ${data.totalIn} · Out: ${data.totalOut}</td><td colspan="3"></td></tr>
            </tbody>
          </table>
          </body></html>
        `);
        printWindow.document.close();
        printWindow.focus();
      } catch (err) {
        alert('Could not generate report: ' + err.message);
      }
    }

    function renderItemList() {
      const search = document.getElementById('itemSearch').value.trim().toLowerCase();
      const items = inventoryItemsCache.filter(i => !search || i.name.toLowerCase().includes(search) || i.itemCode.toLowerCase().includes(search));
      const listEl = document.getElementById('itemList');
      if (items.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No items found.</div>`;
        return;
      }
      listEl.innerHTML = `
        <table class="item-table">
          <thead><tr><th>Item</th><th>Category</th><th>Location</th><th style="text-align:right">Quantity</th><th>Status</th></tr></thead>
          <tbody>
            ${items.map(i => `
              <tr onclick="openItemDetail('${i.id}')">
                <td>
                  <div class="item-name-cell">${escapeHtml(i.name)}</div>
                  <div class="item-meta-cell">${escapeHtml(i.itemCode)}${i.isBatchTracked ? ' · Batch-tracked' : ''}</div>
                </td>
                <td>${escapeHtml(i.category || '—')}</td>
                <td>${escapeHtml(i.location || '—')}</td>
                <td class="item-qty-cell">${i.currentQuantity} ${escapeHtml(i.unitOfMeasure || '')}</td>
                <td>${i.lowStock ? '<span class="badge badge-low">Low Stock</span>' : '<span class="badge badge-ok">OK</span>'}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    async function openItemDetail(itemId) {
      const item = inventoryItemsCache.find(i => i.id === itemId);
      if (!item) return;
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.id = 'itemDetailOverlay';
      overlay.innerHTML = `
        <div class="modal">
          <div style="font-size:15px;font-weight:700;color:#8B1A1A;margin-bottom:4px">${escapeHtml(item.name)}</div>
          <div style="font-size:12px;color:#6B7280;margin-bottom:14px">${escapeHtml(item.itemCode)} — ${item.currentQuantity} ${escapeHtml(item.unitOfMeasure || '')} on hand</div>
          <div id="itemDetailContent" style="font-size:12.5px;color:#6B7280">Loading…</div>
          <button class="secondary" onclick="document.getElementById('itemDetailOverlay').remove()">Close</button>
        </div>`;
      document.body.appendChild(overlay);

      if (item.isBatchTracked) {
        try {
          const resp = await fetch(`/api/get-assets?inventoryBatches=true&itemId=${itemId}`);
          const data = await resp.json();
          const batches = data.batches || [];
          document.getElementById('itemDetailContent').innerHTML = batches.length === 0
            ? '<div style="font-style:italic">No active batches.</div>'
            : '<div style="font-weight:700;color:#8B1A1A;margin-bottom:8px">Batches (soonest expiry first)</div>' +
              batches.map(b => `<div style="padding:6px 0;border-bottom:1px solid #F0F2F6;display:flex;justify-content:space-between"><span>${escapeHtml(b.lotNumber || 'Unlabeled')}${b.expiryDate ? ' · exp ' + b.expiryDate : ''}</span><span style="font-weight:700">${b.quantity}</span></div>`).join('');
        } catch (err) {
          document.getElementById('itemDetailContent').innerHTML = `<span style="color:#B3261E">${err.message}</span>`;
        }
      } else {
        document.getElementById('itemDetailContent').innerHTML = '<div style="font-style:italic">Not batch-tracked — a single running total.</div>';
      }
    }

    // ===== Scanning — identical logic to the main dashboard's,
    // confirmed working after the real fix in Session 105. Kept as
    // its own copy here rather than shared, matching how every other
    // standalone portal in this app is already fully self-contained. =====
    let zxingLoadPromise = null;
    function ensureZXingLoaded() {
      if (window.ZXingBrowser) return Promise.resolve();
      if (zxingLoadPromise) return zxingLoadPromise;
      zxingLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/@zxing/browser@0.1.5';
        script.onload = () => { if (window.ZXingBrowser) resolve(); else reject(new Error('Scanning library loaded but was not recognized — try refreshing.')); };
        script.onerror = () => reject(new Error('Could not load the scanning library — check your connection.'));
        document.head.appendChild(script);
      });
      return zxingLoadPromise;
    }

    function parseGS1BarcodeClient(raw) {
      if (!raw) return null;
      let s = raw.replace(/^\]d2/i, '').replace(/^\]C1/i, '');
      const GS = '\x1D';
      const result = { gtin: null, expiryDate: null, lotNumber: null };
      let i = 0;
      while (i < s.length) {
        const ai = s.substring(i, i + 2);
        if (ai === '01' && s.length >= i + 16) { result.gtin = s.substring(i + 2, i + 16); i += 16; }
        else if (ai === '17' && s.length >= i + 8) {
          const yy = s.substring(i + 2, i + 4), mm = s.substring(i + 4, i + 6), dd = s.substring(i + 6, i + 8);
          const year = Number(yy) <= 50 ? 2000 + Number(yy) : 1900 + Number(yy);
          const day = dd === '00' ? new Date(year, Number(mm), 0).getDate() : Number(dd);
          result.expiryDate = `${year}-${mm}-${String(day).padStart(2, '0')}`;
          i += 8;
        } else if (ai === '10') {
          let end = s.indexOf(GS, i + 2);
          if (end === -1) end = s.length;
          result.lotNumber = s.substring(i + 2, end);
          i = end + 1;
        } else { i += 1; }
      }
      if (!result.gtin && !result.expiryDate && !result.lotNumber) return null;
      return result;
    }

    async function openScanModal(mode) {
      scanModalMode = mode;
      const overlay = document.createElement('div');
      overlay.id = 'scanModalOverlay';
      overlay.className = 'overlay';
      overlay.innerHTML = `
        <div class="modal">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <div style="font-size:15px;font-weight:700;color:#8B1A1A">${mode === 'IN' ? '📷 Scan In' : '📷 Scan Out'}</div>
            <button onclick="closeScanModal()" style="border:none;background:none;font-size:20px;color:#6B7280;cursor:pointer;line-height:1">×</button>
          </div>
          <div id="scanVideoWrap" style="position:relative;background:#000;border-radius:10px;overflow:hidden;margin-bottom:12px">
            <video id="scanVideo" style="width:100%;display:block" playsinline muted></video>
            <div style="position:absolute;inset:0;border:3px solid rgba(255,255,255,0.4);pointer-events:none;margin:14%"></div>
          </div>
          <div id="scanStatus" style="font-size:12px;color:#6B7280;text-align:center;margin-bottom:10px">Point the camera at the barcode…</div>
          <button class="secondary" onclick="openManualScanEntry('${mode}')">Can't scan? Enter manually</button>
        </div>`;
      document.body.appendChild(overlay);

      try {
        await ensureZXingLoaded();
        scanModalStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const video = document.getElementById('scanVideo');
        video.srcObject = scanModalStream;
        await video.play();
        scanModalReader = new ZXingBrowser.BrowserMultiFormatReader();
        scanModalReader.decodeFromVideoElement(video, (result) => { if (result) handleScanDecoded(result.getText()); });
      } catch (err) {
        const status = document.getElementById('scanStatus');
        if (status) status.innerHTML = `<span style="color:#B3261E">Could not access the camera (${err.message}). Use manual entry below.</span>`;
      }
    }

    function stopScanCamera() {
      if (scanModalReader) { try { scanModalReader.reset(); } catch (e) {} scanModalReader = null; }
      if (scanModalStream) { scanModalStream.getTracks().forEach(t => t.stop()); scanModalStream = null; }
    }
    function closeScanModal() { stopScanCamera(); document.getElementById('scanModalOverlay')?.remove(); }

    async function handleScanDecoded(rawText) {
      stopScanCamera();
      const parsed = parseGS1BarcodeClient(rawText);
      const gtin = parsed?.gtin || rawText;
      await proceedFromScannedCode(gtin, parsed?.lotNumber || null, parsed?.expiryDate || null);
    }

    async function proceedFromScannedCode(gtin, lotNumber, expiryDate) {
      const overlay = document.getElementById('scanModalOverlay');
      if (!overlay) return;
      overlay.querySelector('#scanVideoWrap')?.remove();
      const status = document.getElementById('scanStatus');
      if (status) status.textContent = 'Looking up this item…';
      try {
        const resp = await fetch(`/api/get-assets?resolveInventoryBarcode=true&gtin=${encodeURIComponent(gtin)}`);
        const data = await resp.json();
        if (data.needsLink) renderLinkBarcodeStep(gtin, lotNumber, expiryDate);
        else renderScanQuantityStep(data.itemId, data.itemCode, data.itemName, data.isBatchTracked, gtin, lotNumber, expiryDate);
      } catch (err) {
        if (status) status.innerHTML = `<span style="color:#B3261E">${err.message}</span>`;
      }
    }

    function renderLinkBarcodeStep(gtin, lotNumber, expiryDate) {
      const overlay = document.getElementById('scanModalOverlay');
      const container = overlay.querySelector('.modal');
      const itemOptions = inventoryItemsCache.map(i => `<option value="${i.id}">${escapeHtml(i.itemCode)} — ${escapeHtml(i.name)}</option>`).join('');
      container.innerHTML += `
        <div style="font-size:12.5px;color:#8B1A1A;margin-bottom:8px">This barcode hasn't been seen before. Which item is it?</div>
        <div style="font-size:11px;color:#6B7280;margin-bottom:10px">Scanned code: ${escapeHtml(gtin)}</div>
        <select id="scan_linkItem"><option value="">— Choose an item —</option>${itemOptions}</select>
        <div id="scan_linkError" class="error-box"></div>
        <button class="primary" id="scan_linkSubmit" onclick="submitLinkAndProceed('${gtin}', ${lotNumber ? `'${lotNumber}'` : 'null'}, ${expiryDate ? `'${expiryDate}'` : 'null'})">Link & Continue</button>
        <button class="secondary" onclick="renderCreateNewItemFromScan('${gtin}', ${lotNumber ? `'${lotNumber}'` : 'null'}, ${expiryDate ? `'${expiryDate}'` : 'null'})">+ This is a brand-new item — add it</button>`;
    }

    // Confirmed directly: scanning something genuinely new shouldn't
    // be a dead end here either - a real create-item form right in
    // the scan flow, including a category dropdown with its own
    // inline "add new category" capability, same as the main system.
    let categoriesCacheForScan = [];
    async function renderCreateNewItemFromScan(gtin, lotNumber, expiryDate) {
      try {
        const resp = await fetch('/api/get-assets?inventoryCategories=true');
        categoriesCacheForScan = resp.ok ? (await resp.json()).categories || [] : [];
      } catch (err) { console.error('Could not load categories:', err); }

      const overlay = document.getElementById('scanModalOverlay');
      const container = overlay.querySelector('.modal');
      container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="font-size:15px;font-weight:700;color:#8B1A1A">Add New Item</div>
          <button onclick="closeScanModal()" style="border:none;background:none;font-size:20px;color:#6B7280;cursor:pointer;line-height:1">×</button>
        </div>
        <div style="font-size:11px;color:#6B7280;margin-bottom:12px">Scanned code: ${escapeHtml(gtin)}${lotNumber ? ` · Batch ${escapeHtml(lotNumber)}` : ''}${expiryDate ? ` · Expires ${expiryDate}` : ''}</div>
        <label>Name *</label>
        <input id="scannew_name" type="text" autocomplete="off" oninput="renderItemTypeaheadSuggestions('scannew_name_suggestions', this.value, 'selectScanNewItemSuggestion', null, ['${gtin}', ${lotNumber ? `'${lotNumber}'` : 'null'}, ${expiryDate ? `'${expiryDate}'` : 'null'}])" style="margin-bottom:4px">
        <div id="scannew_name_suggestions" style="display:none;border:1px solid #E2E6ED;border-radius:8px;margin-bottom:10px;max-height:200px;overflow-y:auto"></div>
        <label>Category</label>
        <select id="scannew_category" onchange="toggleScanCategoryAddField()">
          <option value="">— Not set —</option>
          ${categoriesCacheForScan.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
          <option value="__add_new__">+ Add new category…</option>
        </select>
        <div id="scannew_category_new" style="display:none;gap:6px;margin-bottom:10px">
          <input id="scannew_category_newInput" type="text" placeholder="New category name" style="flex:1">
          <button onclick="addScanNewCategory()" style="padding:9px 14px;border:1px solid #8B1A1A;border-radius:8px;background:#fff;color:#8B1A1A;font-weight:600;font-size:12.5px;cursor:pointer">Add</button>
        </div>
        <label>Unit of Measure</label>
        <input id="scannew_unit" type="text" placeholder="e.g. boxes, pieces">
        <label>Reorder Level</label>
        <input id="scannew_reorder" type="number" min="0">
        <div id="scannew_error" class="error-box"></div>
        <button class="primary" id="scannew_submit" onclick="submitCreateNewItemFromScan('${gtin}', ${lotNumber ? `'${lotNumber}'` : 'null'}, ${expiryDate ? `'${expiryDate}'` : 'null'})">Create & Continue</button>`;
    }

    function toggleScanCategoryAddField() {
      const select = document.getElementById('scannew_category');
      const row = document.getElementById('scannew_category_new');
      if (select.value === '__add_new__') { row.style.display = 'flex'; document.getElementById('scannew_category_newInput').focus(); }
      else { row.style.display = 'none'; }
    }

    async function addScanNewCategory() {
      const input = document.getElementById('scannew_category_newInput');
      const label = input.value.trim();
      if (!label) { input.focus(); return; }
      try {
        const resp = await fetch('/api/manage-asset', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'addInventoryCategory', label }),
        });
        const data = await resp.json();
        if (!resp.ok || !data.success) throw new Error(data.error || 'Could not add');
        const select = document.getElementById('scannew_category');
        const newOption = document.createElement('option');
        newOption.value = data.label; newOption.textContent = data.label;
        select.insertBefore(newOption, select.lastElementChild);
        select.value = data.label;
        document.getElementById('scannew_category_new').style.display = 'none';
        input.value = '';
      } catch (err) {
        alert('Could not add: ' + err.message);
      }
    }

    async function submitCreateNewItemFromScan(gtin, lotNumber, expiryDate) {
      const name = document.getElementById('scannew_name').value.trim();
      const category = document.getElementById('scannew_category').value;
      const errorBox = document.getElementById('scannew_error');
      const btn = document.getElementById('scannew_submit');
      errorBox.style.display = 'none';
      if (!name) { errorBox.textContent = 'Enter a name.'; errorBox.style.display = 'block'; return; }
      if (category === '__add_new__') { errorBox.textContent = 'Finish adding the new category (or pick an existing one) before continuing.'; errorBox.style.display = 'block'; return; }

      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const createResp = await fetch('/api/manage-asset', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            entityType: 'inventoryItem', name, category,
            unitOfMeasure: document.getElementById('scannew_unit').value.trim(),
            reorderLevel: document.getElementById('scannew_reorder').value,
            initialQuantity: 0,
          }),
        });
        const createData = await createResp.json();
        if (!createResp.ok || !createData.success) throw new Error(createData.error || 'Could not create item');

        const linkResp = await fetch('/api/manage-asset', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'linkInventoryBarcode', gtin, itemId: createData.id }),
        });
        const linkData = await linkResp.json();
        if (!linkResp.ok || !linkData.success) throw new Error(linkData.error || 'Item created, but could not link the barcode to it');

        renderScanQuantityStep(createData.id, createData.itemCode, name, false, gtin, lotNumber, expiryDate);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Create & Continue';
      }
    }

    // Confirmed directly: the same real typeahead mechanism as the
    // main dashboard - live matches with real item code and current
    // stock shown alongside each name, so someone scanning something
    // genuinely new can actually recognize when it isn't.
    function renderItemTypeaheadSuggestions(containerId, query, onSelect, excludeItemId, extraArgs) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const q = query.trim().toLowerCase();
      if (!q) { container.style.display = 'none'; container.innerHTML = ''; return; }
      const matches = inventoryItemsCache
        .filter(i => i.id !== excludeItemId && (i.name.toLowerCase().includes(q) || i.itemCode.toLowerCase().includes(q)))
        .slice(0, 8);
      if (matches.length === 0) { container.style.display = 'none'; container.innerHTML = ''; return; }
      const extraArgsJs = (extraArgs || []).map(a => JSON.stringify(a)).join(', ');
      container.innerHTML = matches.map(i => `
        <div onclick='${onSelect}(${JSON.stringify(i.id)}${extraArgsJs ? ', ' + extraArgsJs : ''})' style="padding:9px 12px;cursor:pointer;border-bottom:1px solid #E2E6ED" onmouseenter="this.style.background='#F7F8FA'" onmouseleave="this.style.background='#fff'">
          <div style="font-size:12.5px;font-weight:600;color:#8B1A1A">${escapeHtml(i.name)}</div>
          <div style="font-size:11px;color:#6B7280">${escapeHtml(i.itemCode)} · ${i.currentQuantity} ${escapeHtml(i.unitOfMeasure || '')} in stock${i.lowStock ? ' · Low Stock' : ''}</div>
        </div>`).join('');
      container.style.display = 'block';
    }

    // Same real fix as the main dashboard - selecting an existing
    // match here links the actual scanned barcode straight to the
    // real existing item and proceeds, rather than a separate item
    // getting created for something that already exists.
    async function selectScanNewItemSuggestion(itemId, gtin, lotNumber, expiryDate) {
      const item = inventoryItemsCache.find(i => i.id === itemId);
      if (!item) return;
      document.getElementById('scannew_name_suggestions').style.display = 'none';
      try {
        const resp = await fetch('/api/manage-asset', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'linkInventoryBarcode', gtin, itemId }) });
        const data = await resp.json();
        if (!resp.ok || !data.success) throw new Error(data.error || 'Could not link');
        renderScanQuantityStep(itemId, item.itemCode, item.name, item.isBatchTracked, gtin, lotNumber, expiryDate);
      } catch (err) {
        alert(`Could not link to ${item.itemCode} — ${item.name}: ${err.message}`);
      }
    }

    async function submitLinkAndProceed(gtin, lotNumber, expiryDate) {
      const itemId = document.getElementById('scan_linkItem').value;
      const errorBox = document.getElementById('scan_linkError');
      if (!itemId) { errorBox.textContent = 'Choose which item this barcode represents.'; errorBox.style.display = 'block'; return; }
      const btn = document.getElementById('scan_linkSubmit');
      btn.disabled = true; btn.textContent = 'Linking…';
      try {
        const resp = await fetch('/api/manage-asset', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'linkInventoryBarcode', gtin, itemId }) });
        const data = await resp.json();
        if (!resp.ok || !data.success) throw new Error(data.error || 'Could not link');
        const item = inventoryItemsCache.find(i => i.id === itemId);
        renderScanQuantityStep(itemId, item?.itemCode, item?.name, item?.isBatchTracked, gtin, lotNumber, expiryDate);
      } catch (err) {
        errorBox.textContent = err.message; errorBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Link & Continue';
      }
    }

    function renderScanQuantityStep(itemId, itemCode, itemName, isBatchTracked, gtin, lotNumber, expiryDate) {
      const overlay = document.getElementById('scanModalOverlay');
      const container = overlay.querySelector('.modal');
      container.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <div style="font-size:15px;font-weight:700;color:#8B1A1A">${scanModalMode === 'IN' ? '📷 Scan In' : '📷 Scan Out'}</div>
          <button onclick="closeScanModal()" style="border:none;background:none;font-size:20px;color:#6B7280;cursor:pointer;line-height:1">×</button>
        </div>
        <div style="background:#F0F2F6;border-radius:10px;padding:12px 14px;margin-bottom:14px">
          <div style="font-size:13px;font-weight:700;color:#8B1A1A">${escapeHtml(itemCode || '')} — ${escapeHtml(itemName || '')}</div>
          ${isBatchTracked && lotNumber ? `<div style="font-size:11.5px;color:#6B7280;margin-top:4px">Batch ${escapeHtml(lotNumber)}${expiryDate ? ' · Expires ' + expiryDate : ''}</div>` : ''}
          ${isBatchTracked && scanModalMode === 'IN' && !lotNumber ? `<div style="font-size:11px;color:#B45309;margin-top:4px">⚠ Batch-tracked but no batch info in the scan — enter it below.</div>` : ''}
        </div>
        ${isBatchTracked && scanModalMode === 'IN' && !lotNumber ? `
        <label>Batch / Lot Number</label><input id="scan_lotNumber" type="text">
        <label>Expiry Date</label><input id="scan_expiryDate" type="date">` : ''}
        <label>Quantity</label><input id="scan_quantity" type="number" min="1" autofocus>
        <div id="scan_qtyError" class="error-box"></div>
        <button class="primary" id="scan_qtySubmit" onclick="submitScanQuantity('${itemId}', ${JSON.stringify(lotNumber)}, ${JSON.stringify(expiryDate)})" style="background:${scanModalMode === 'IN' ? '#27AE60' : '#E74C3C'}">${scanModalMode === 'IN' ? 'Confirm Stock In' : 'Confirm Stock Out'}</button>`;
    }

    async function submitScanQuantity(itemId, scannedLot, scannedExpiry) {
      const qty = document.getElementById('scan_quantity').value;
      const errorBox = document.getElementById('scan_qtyError');
      const btn = document.getElementById('scan_qtySubmit');
      errorBox.style.display = 'none';
      if (!qty || Number(qty) <= 0) { errorBox.textContent = 'Enter a quantity greater than zero.'; errorBox.style.display = 'block'; return; }
      const lotNumber = document.getElementById('scan_lotNumber')?.value.trim() || scannedLot;
      const expiryDate = document.getElementById('scan_expiryDate')?.value || scannedExpiry;
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const action = scanModalMode === 'IN' ? 'scanInventoryIn' : 'scanInventoryOut';
        const body = scanModalMode === 'IN' ? { action, itemId, lotNumber, expiryDate, quantity: qty } : { action, itemId, quantity: qty };
        const resp = await fetch('/api/manage-asset', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await resp.json();
        if (!resp.ok || !data.success) throw new Error(data.error || 'Could not save');
        closeScanModal();
        await loadItems();
        await loadTodayActivity();
      } catch (err) {
        errorBox.textContent = err.message; errorBox.style.display = 'block';
        btn.disabled = false; btn.textContent = scanModalMode === 'IN' ? 'Confirm Stock In' : 'Confirm Stock Out';
      }
    }

    function openManualScanEntry(mode) {
      closeScanModal();
      scanModalMode = mode;
      const overlay = document.createElement('div');
      overlay.className = 'overlay';
      overlay.id = 'scanModalOverlay';
      const itemOptions = inventoryItemsCache.map(i => `<option value="${i.id}" data-batch="${i.isBatchTracked}">${escapeHtml(i.itemCode)} — ${escapeHtml(i.name)}</option>`).join('');
      overlay.innerHTML = `
        <div class="modal">
          <div style="font-size:15px;font-weight:700;color:#8B1A1A;margin-bottom:14px">${mode === 'IN' ? 'Stock In' : 'Stock Out'} — Manual Entry</div>
          <label>Item</label>
          <select id="manual_item" onchange="renderManualScanQuantityFields()"><option value="">— Choose an item —</option>${itemOptions}</select>
          <div id="manual_extraFields"></div>
          <label>Quantity</label><input id="manual_quantity" type="number" min="1">
          <div id="manual_error" class="error-box"></div>
          <button class="primary" id="manual_submit" onclick="submitManualScanEntry()" style="background:${mode === 'IN' ? '#27AE60' : '#E74C3C'}">Confirm</button>
          <button class="secondary" onclick="document.getElementById('scanModalOverlay').remove()">Cancel</button>
        </div>`;
      document.body.appendChild(overlay);
    }

    function renderManualScanQuantityFields() {
      const select = document.getElementById('manual_item');
      const isBatchTracked = select.selectedOptions[0]?.dataset.batch === 'true';
      document.getElementById('manual_extraFields').innerHTML = (isBatchTracked && scanModalMode === 'IN') ? `
        <label>Batch / Lot Number</label><input id="manual_lotNumber" type="text">
        <label>Expiry Date</label><input id="manual_expiryDate" type="date">` : '';
    }

    async function submitManualScanEntry() {
      const itemId = document.getElementById('manual_item').value;
      const qty = document.getElementById('manual_quantity').value;
      const errorBox = document.getElementById('manual_error');
      const btn = document.getElementById('manual_submit');
      errorBox.style.display = 'none';
      if (!itemId) { errorBox.textContent = 'Choose an item.'; errorBox.style.display = 'block'; return; }
      if (!qty || Number(qty) <= 0) { errorBox.textContent = 'Enter a quantity greater than zero.'; errorBox.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const action = scanModalMode === 'IN' ? 'scanInventoryIn' : 'scanInventoryOut';
        const body = scanModalMode === 'IN'
          ? { action, itemId, lotNumber: document.getElementById('manual_lotNumber')?.value.trim() || null, expiryDate: document.getElementById('manual_expiryDate')?.value || null, quantity: qty }
          : { action, itemId, quantity: qty };
        const resp = await fetch('/api/manage-asset', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await resp.json();
        if (!resp.ok || !data.success) throw new Error(data.error || 'Could not save');
        document.getElementById('scanModalOverlay')?.remove();
        await loadItems();
        await loadTodayActivity();
      } catch (err) {
        errorBox.textContent = err.message; errorBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Confirm';
      }
    }

    init();
  </script>
</body>
</html>
