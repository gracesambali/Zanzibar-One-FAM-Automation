<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Info — GVC Facility Asset Manager</title>
<style>
  :root { --navy:#1A3566; --muted:#6b7280; --border:#e5e7eb; --green:#16a34a; --amber:#d97706; --red:#dc2626; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#f7f8fa; margin:0; padding:24px 16px; color:#111827; }
  .card { max-width: 480px; margin: 0 auto; background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .header { background: var(--navy); color:#fff; padding:20px 22px; }
  .header .id { font-family: monospace; font-size:12px; opacity:0.8; }
  .header .name { font-size:20px; font-weight:700; margin-top:4px; }
  .body { padding: 18px 22px; }
  .row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .row:last-child { border-bottom:none; }
  .label { color:var(--muted); }
  .value { font-weight:600; text-align:right; }
  .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:600; }
  .badge-good { background:#dcfce7; color:var(--green); }
  .badge-fair { background:#fef3c7; color:var(--amber); }
  .badge-poor, .badge-critical { background:#fee2e2; color:var(--red); }
  .footer { padding: 14px 22px; text-align:center; font-size:11px; color:var(--muted); border-top:1px solid var(--border); }
  .loading, .error { text-align:center; padding: 40px 20px; color:var(--muted); }
  .report-link { display:block; text-align:center; margin: 16px 22px 20px; padding:10px; background:var(--navy); color:#fff; text-decoration:none; border-radius:8px; font-size:13px; font-weight:600; }
  .section { padding: 16px 22px; border-top:1px solid var(--border); }
  .section-title { font-size:12px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px; }
  .section-sub { font-size:11px; color:var(--muted); margin-bottom:12px; }
  .checklist-item { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid #F3F4F6; font-size:13px; }
  .checklist-item:last-child { border-bottom:none; }
  .checklist-task { flex:1; }
  .checklist-freq { flex-shrink:0; font-size:10.5px; color:var(--muted); background:#F3F4F6; padding:2px 8px; border-radius:8px; white-space:nowrap; }
  .history-item { padding:8px 0; border-bottom:1px solid #F3F4F6; font-size:12.5px; }
  .history-item:last-child { border-bottom:none; }
  .history-top { display:flex; justify-content:space-between; align-items:center; }
  .history-id { font-weight:600; color:#111827; }
  .history-date { color:var(--muted); font-size:11px; }
  .history-type { color:var(--muted); font-size:11.5px; margin-top:2px; }
  .status-badge { display:inline-block; padding:2px 9px; border-radius:10px; font-size:10.5px; font-weight:600; }
  .status-completed { background:#dcfce7; color:var(--green); }
  .status-open, .status-inprogress { background:#fef3c7; color:var(--amber); }
  .empty-note { font-size:12.5px; color:var(--muted); font-style:italic; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="loading">Loading asset info…</div>
  </div>

  <script>
    function conditionBadgeClass(c) {
      const k = (c || "").toLowerCase();
      if (k === "good") return "badge-good";
      if (k === "fair") return "badge-fair";
      if (k === "poor") return "badge-poor";
      if (k === "critical") return "badge-critical";
      return "badge-fair";
    }

    function assetAge(installDate) {
      if (!installDate) return "—";
      const years = new Date().getFullYear() - parseInt(installDate.split("-")[0]);
      return years >= 0 ? years + " years" : "—";
    }

    function maintenanceInterval(lastService, nextService) {
      if (!lastService || !nextService) return "—";
      const days = Math.round((new Date(nextService) - new Date(lastService)) / 86400000);
      if (days <= 0) return "—";
      return days >= 60 ? `${days}d (~${Math.round(days/30)}mo)` : `${days} days`;
    }

    function renderChecklistSection(checklist) {
      if (!checklist || !checklist.items || checklist.items.length === 0) {
        return `<div class="section"><div class="section-title">Maintenance Checklist</div><div class="empty-note">No checklist available for this asset yet.</div></div>`;
      }
      const subLabel = checklist.generic
        ? `General ${checklist.class.replace(' (General)', '')} checklist — no asset-specific list on file`
        : `${checklist.class}${checklist.sourceStandard ? ' — sourced from ' + checklist.sourceStandard : ''}`;
      return `
        <div class="section">
          <div class="section-title">Maintenance Checklist</div>
          <div class="section-sub">${subLabel}</div>
          ${checklist.items.map(item => `
            <div class="checklist-item">
              <span class="checklist-task">${item.task}</span>
              <span class="checklist-freq">${item.frequency}</span>
            </div>`).join('')}
        </div>`;
    }

    function historyStatusClass(status) {
      const k = (status || "").toLowerCase().replace(/\s+/g, "");
      if (k === "completed") return "status-completed";
      return "status-open";
    }

    function renderHistorySection(history) {
      if (!history || history.length === 0) {
        return `<div class="section"><div class="section-title">Maintenance History</div><div class="empty-note">No maintenance recorded for this asset yet.</div></div>`;
      }
      return `
        <div class="section">
          <div class="section-title">Maintenance History</div>
          <div class="section-sub">${history.length} record${history.length !== 1 ? 's' : ''}, most recent first</div>
          ${history.map(h => `
            <div class="history-item">
              <div class="history-top">
                <span class="history-id">${h.woId}</span>
                <span class="status-badge ${historyStatusClass(h.status)}">${h.status || '—'}</span>
              </div>
              <div class="history-type">${h.maintenanceType || 'Maintenance'} — ${h.created ? new Date(h.created).toLocaleDateString() : '—'}</div>
            </div>`).join('')}
        </div>`;
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const card = document.getElementById("card");
      if (!id) {
        card.innerHTML = '<div class="error">No asset ID provided.</div>';
        return;
      }
      try {
        const resp = await fetch(`/api/get-assets?public=true&id=${encodeURIComponent(id)}`);
        const data = await resp.json();
        if (!resp.ok) {
          card.innerHTML = `<div class="error">${data.error || "Asset not found."}</div>`;
          return;
        }
        card.innerHTML = `
          <div class="header">
            <div class="id">${data.id}</div>
            <div class="name">${data.name}</div>
          </div>
          <div class="body">
            <div class="row"><span class="label">Status</span><span class="value">${data.status}</span></div>
            <div class="row"><span class="label">System</span><span class="value">${data.system || "—"}</span></div>
            <div class="row"><span class="label">Category</span><span class="value">${data.category || "—"}</span></div>
            <div class="row"><span class="label">Floor/Level</span><span class="value">${data.floor || "—"}</span></div>
            <div class="row"><span class="label">Room/Zone</span><span class="value">${data.room || "—"}</span></div>
            <div class="row"><span class="label">Manufacturer</span><span class="value">${data.manufacturer || "—"}</span></div>
            <div class="row"><span class="label">Model</span><span class="value">${data.model || "—"}</span></div>
            <div class="row"><span class="label">Install Date</span><span class="value">${data.installDate || "—"}</span></div>
            <div class="row"><span class="label">Expected Lifespan</span><span class="value">${data.lifespan ? data.lifespan + " years" : "—"}</span></div>
            <div class="row"><span class="label">Asset Age</span><span class="value">${assetAge(data.installDate)}</span></div>
            <div class="row"><span class="label">Last Service</span><span class="value">${data.lastService || "—"}</span></div>
            <div class="row"><span class="label">Next Service Due</span><span class="value">${data.nextService || "—"}</span></div>
            <div class="row"><span class="label">Maintenance Interval</span><span class="value">${maintenanceInterval(data.lastService, data.nextService)}</span></div>
          </div>
          ${renderChecklistSection(data.checklist)}
          ${renderHistorySection(data.history)}
          <a class="report-link" href="/report.html">🛠 Report an issue with this asset</a>
          <div class="footer">Gracing Ventures · Facility Asset Management</div>
        `;
      } catch (e) {
        card.innerHTML = '<div class="error">Could not load asset info. Check your connection and try again.</div>';
      }
    }
    load();
  </script>
</body>
</html>
