<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GVC Facility Asset Manager — Set Password</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; background:#F0F2F6; color:#1A1A2E; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .card { background:#fff; border-radius:16px; max-width:400px; width:100%; padding:36px 32px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
  .logo-row { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:24px; }
  .logo { width:56px; height:56px; border-radius:50%; overflow:hidden; }
  .logo img { width:100%; height:100%; object-fit:contain; }
  h1 { font-size:18px; color:#1A3566; text-align:center; }
  .sub { font-size:13px; color:#6B7280; margin-top:4px; text-align:center; margin-bottom:8px; }
  label { font-size:12px; font-weight:600; color:#1A3566; display:block; margin-bottom:6px; margin-top:16px; }
  input { width:100%; padding:11px 14px; border:1px solid #E2E6ED; border-radius:8px; font-size:14px; font-family:inherit; }
  .password-field { position:relative; }
  .password-field input { padding-right:42px; }
  .toggle-visibility { position:absolute; right:4px; top:0; bottom:0; margin:auto; width:34px; height:34px; padding:0; line-height:0; border:none; background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#6B7280; border-radius:6px; }
  .toggle-visibility:hover { background:#F0F2F6; }
  .toggle-visibility svg { display:block; width:19px; height:19px; }
  button { width:100%; margin-top:22px; padding:14px; border:none; border-radius:10px; background:#1A3566; color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:transform .15s; }
  button:hover { transform:scale(1.02); }
  button:disabled { opacity:.6; cursor:wait; }
  .error { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13px; background:#FDE8E6; color:#991B1B; display:none; }
  .error.show { display:block; }
  .success { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13px; background:#DCFCE7; color:#166534; display:none; }
  .success.show { display:block; }
  .back-link { text-align:center; margin-top:18px; }
  .back-link a { font-size:12.5px; color:#6B7280; text-decoration:none; }
  .footer { text-align:center; font-size:11px; color:#9CA3AF; margin-top:24px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo"><img src="/logo.png" alt="GVC"></div>
      <div>
        <h1 id="pageTitle">Set Your Password</h1>
        <div class="sub" id="pageSub">Enter your username (or email) and we'll send you a link.</div>
      </div>
    </div>

    <!-- Step 1: request a link, shown when there's no token in the URL -->
    <form id="requestForm">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" placeholder="e.g. pharmacy1">
      <div style="text-align:center;font-size:11.5px;color:#9CA3AF;margin:10px 0">— or —</div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="Only if you don't know your username">
      <div style="font-size:11px;color:#9CA3AF;margin-top:8px;line-height:1.5">If more than one account shares this email, using your username finds the exact right one — email alone can't tell them apart.</div>
      <button type="submit" id="requestBtn">Send Me a Link</button>
    </form>

    <!-- Step 2: set the new password, shown when a token is present in the URL -->
    <form id="confirmForm" style="display:none">
      <label for="newPassword">New password</label>
      <div class="password-field">
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button type="button" class="toggle-visibility" data-target="newPassword" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label for="confirmPassword">Confirm new password</label>
      <div class="password-field">
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button type="button" class="toggle-visibility" data-target="confirmPassword" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" id="confirmBtn">Set Password</button>
    </form>

    <div id="error" class="error"></div>
    <div id="success" class="success"></div>

    <div class="back-link"><a href="/login">← Back to sign in</a></div>
    <div class="footer">Gracing Ventures · BIM Information Management · Tanzania</div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

const requestForm = document.getElementById('requestForm');
const confirmForm = document.getElementById('confirmForm');
const errorBox = document.getElementById('error');
const successBox = document.getElementById('success');
const pageTitle = document.getElementById('pageTitle');
const pageSub = document.getElementById('pageSub');

// Peep-eye toggles on the new-password / confirm-password fields —
// lets someone actually verify what they typed before submitting,
// rather than trusting two masked fields matched by feel.
const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
const EYE_CLOSED = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

document.querySelectorAll('.toggle-visibility').forEach(function (btn) {
  btn.addEventListener('click', function () {
    const input = document.getElementById(btn.dataset.target);
    const nowShowing = input.type === 'text';
    input.type = nowShowing ? 'password' : 'text';
    btn.querySelector('svg').innerHTML = nowShowing ? EYE_OPEN : EYE_CLOSED;
    btn.setAttribute('aria-label', nowShowing ? 'Show password' : 'Hide password');
  });
});

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.className = 'error show';
  successBox.className = 'success';
}
function showSuccess(msg) {
  successBox.textContent = msg;
  successBox.className = 'success show';
  errorBox.className = 'error';
}

if (token) {
  // Step 2 — a link was clicked, show the new-password form.
  requestForm.style.display = 'none';
  confirmForm.style.display = 'block';
  pageTitle.textContent = 'Choose a New Password';
  pageSub.textContent = 'This link is single-use and expires shortly.';
} else {
  // Step 1 — plain visit to the page, show the request form.
  confirmForm.style.display = 'none';
}

requestForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('requestBtn');
  errorBox.className = 'error';
  successBox.className = 'success';

  if (!username && !email) {
    showError('Enter your username or your email.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending…';

  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'requestPasswordReset', username: username || undefined, email: email || undefined }),
    });
    const data = await resp.json();
    if (resp.ok && data.success) {
      showSuccess(data.message || 'If that account is registered, check the inbox for a link.');
      requestForm.reset();
    } else {
      showError(data.error || 'Something went wrong. Please try again.');
    }
  } catch (err) {
    showError('Network error: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send Me a Link';
  }
});

confirmForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('confirmBtn');

  errorBox.className = 'error';
  successBox.className = 'success';

  if (newPassword.length < 8) {
    showError('Password must be at least 8 characters.');
    return;
  }
  if (newPassword !== confirmPassword) {
    showError('Passwords don\u2019t match.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Setting…';

  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'confirmPasswordReset', token, newPassword }),
    });
    const data = await resp.json();
    if (resp.ok && data.success) {
      confirmForm.style.display = 'none';
      pageTitle.textContent = 'Password Set';
      pageSub.textContent = 'You can now sign in with your new password.';
      showSuccess('Done — head back to sign in.');
    } else {
      showError(data.error || 'Could not set password. Please request a new link.');
      btn.disabled = false;
      btn.textContent = 'Set Password';
    }
  } catch (err) {
    showError('Network error: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Set Password';
  }
});
</script>
</body>
</html>
