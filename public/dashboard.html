<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">GVC Facility Asset Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1A3566; --navy-light: #2A4A7F; --navy-pale: #E8EDF4;
  --red: #E74C3C; --red-bg: #FDE8E6;
  --green: #27AE60; --green-bg: #E8F8EF;
  --amber: #F39C12; --amber-bg: #FEF5E7;
  --blue: #3B82F6; --blue-bg: #EBF2FF;
  --purple: #8B5CF6; --purple-bg: #F3EEFF;
  --teal: #14B8A6; --teal-bg: #E6FBF8;
  --pink: #EC4899; --pink-bg: #FDEBF3;
  --gold: #D4A843; --gold-bg: #FBF3E3;
  --bg: #F0F2F6; --white: #FFFFFF; --text: #1A1A2E; --muted: #6B7280; --border: #E2E6ED;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
button { font-family: inherit; cursor: pointer; }

.header { background: var(--navy); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.header-logo { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 3px; box-sizing: border-box; }
.header-logo img { width: 100%; height: 100%; object-fit: contain; }
.header-left { display: flex; align-items: center; gap: 14px; }
.header-title { color: #fff; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
.header-sub { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 2px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
.live-label { color: rgba(255,255,255,0.7); font-size: 12px; display: flex; align-items: center; gap: 6px; }

.main-layout { display: flex; align-items: flex-start; width: 100%; }

.sidebar {
  width: 220px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--border);
  align-self: stretch; min-height: 100vh; transition: width 0.2s ease;
}
.sidebar.collapsed { width: 64px; }
.sidebar-inner {
  position: sticky; top: 0; max-height: 100vh;
  display: flex; flex-direction: column;
}
.sidebar-nav { flex: 1; padding: 8px 0; }
.sidebar-toggle-row { display: flex; justify-content: flex-end; padding: 10px; border-bottom: 1px solid var(--border); }
.sidebar-toggle { background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 6px; display: flex; }
.sidebar-toggle:hover { background: var(--bg); color: var(--navy); }

.tab-btn {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 18px;
  border: none; background: none; color: var(--muted); border-left: 3px solid transparent;
  font-weight: 400; font-size: 13.5px; white-space: nowrap; transition: all 0.15s; text-align: left; cursor: pointer;
  position: relative;
}
.tab-btn:hover { background: var(--bg); }
.tab-btn.active { color: var(--navy); border-left-color: var(--navy); background: var(--navy-pale); font-weight: 600; }
.tab-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar.collapsed .tab-btn span.tab-label { display: none; }
.sidebar.collapsed .tab-btn { justify-content: center; padding: 12px; position: relative; }

.wo-unread-badge {
  display: none; position: absolute; top: 7px; right: 14px;
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--red); color: #fff; font-size: 10px; font-weight: 700;
  align-items: center; justify-content: center; line-height: 1;
}
.sidebar.collapsed .wo-unread-badge { right: 6px; top: 4px; }

.wo-row-unread-dot {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--red); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 1;
}

.sidebar-tooltip-box {
  position: fixed;
  background: var(--text);
  color: #fff;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  z-index: 1000;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  display: none;
}
.sidebar-tooltip-box.visible { display: block; }

.content { flex: 1; min-width: 0; max-width: 100%; padding: 20px 24px; overflow-x: auto; }
.view { display: none; } .view.active { display: block; }

.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.summary-card { background: var(--white); border-radius: 10px; padding: 16px 18px; border: 1px solid var(--border); }
.summary-val { font-size: 28px; font-weight: 700; }
.summary-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--white); color: var(--text); font-size: 12.5px; font-weight: 400; transition: all 0.2s; }
.filter-btn.active { border-color: var(--navy); background: var(--navy); color: #fff; font-weight: 600; }
.filter-select { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--white); font-size: 12.5px; font-family: inherit; color: var(--text); }
.search-input { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; font-family: inherit; flex: 1; min-width: 180px; }
.filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }

.asset-list { display: flex; flex-direction: column; gap: 8px; }
.asset-row { display: flex; align-items: center; justify-content: space-between; background: var(--white); border-radius: 10px; padding: 14px 18px; border: 1px solid var(--border); cursor: pointer; text-align: left; width: 100%; transition: box-shadow 0.2s; gap: 10px; }
.asset-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

@media (max-width: 700px) {
  .asset-row { flex-direction: column; align-items: stretch; gap: 10px; }
  .asset-row > div:last-child { align-self: flex-start; }
}

/* Work order detail: main record on the left, chat pinned on the right
   so it stays visible while the record itself scrolls. Below 900px
   there's no room for two columns, so it drops to a normal stacked
   layout and the chat scrolls with everything else, ordered first so
   it's not buried at the bottom of a long record. */
.wo-layout { display: flex; align-items: flex-start; gap: 16px; }
.wo-main { flex: 1; min-width: 0; }
.wo-chat-col { width: 340px; flex-shrink: 0; position: sticky; top: 16px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
.wo-chat-col .detail-panel { display: flex; flex-direction: column; min-height: 0; }
#woDetailChatBody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#woDetailChatThread { flex: 1; min-height: 120px; }
@media (max-width: 900px) {
  .wo-layout { flex-direction: column; }
  .wo-chat-col { width: 100%; position: static; max-height: none; order: -1; }
  #woDetailChatThread { max-height: 280px; }
}
.asset-name { font-weight: 600; font-size: 14px; }
.asset-id { font-size: 11px; color: var(--muted); font-family: monospace; }
.asset-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.asset-class { font-size: 10.5px; color: var(--navy); background: var(--navy-pale); padding: 1px 8px; border-radius: 8px; display: inline-block; margin-top: 4px; }
.badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-good { color: var(--green); background: var(--green-bg); }
.badge-warning { color: var(--amber); background: var(--amber-bg); }
.badge-overdue { color: var(--red); background: var(--red-bg); }
.badge-crit { color: var(--red); background: rgba(0,0,0,0.04); font-weight: 500; }
.badge-high { color: var(--amber); background: rgba(0,0,0,0.04); font-weight: 500; }
.badge-medium { color: var(--muted); background: rgba(0,0,0,0.04); font-weight: 500; }
.result-count { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

.detail-panel { background: var(--white); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.detail-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
.detail-title { font-size: 20px; font-weight: 700; }
.detail-sub { font-size: 13px; color: var(--muted); margin-top: 4px; font-family: monospace; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.detail-field { padding: 14px 24px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }
.detail-field-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.detail-field-value { font-size: 14px; font-weight: 500; margin-top: 4px; }
.detail-alert { padding: 16px 24px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.lifecycle-bar-wrap { padding: 16px 24px; }
.lifecycle-bar-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.lifecycle-track { background: #E5E7EB; border-radius: 6px; height: 10px; overflow: hidden; }
.lifecycle-fill { height: 100%; border-radius: 6px; transition: width 0.6s; }
.lifecycle-range { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
.back-btn { border: none; background: none; color: var(--navy); font-weight: 600; font-size: 13px; padding: 0; margin-bottom: 16px; cursor: pointer; }

.scenario-intro { background: var(--white); border-radius: 12px; border: 1px solid var(--border); padding: 24px; margin-bottom: 20px; }
.start-btn { background: var(--navy); color: #fff; border: none; border-radius: 10px; padding: 14px 32px; font-size: 15px; font-weight: 600; transition: transform 0.15s; }
.start-btn:hover { transform: scale(1.03); }
.start-center { text-align: center; padding: 40px 0; }
.start-hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

.timeline { display: flex; flex-direction: column; position: relative; }
.timeline-line { position: absolute; left: 19px; top: 0; bottom: 0; width: 2px; background: var(--border); z-index: 0; }
.timeline-step { display: flex; gap: 16px; margin-bottom: 8px; position: relative; z-index: 1; opacity: 0.15; transition: opacity 0.5s, transform 0.5s; transform: translateY(8px); }
.timeline-step.visible { opacity: 1; transform: translateY(0); }
.timeline-dot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #F0F0F0; background: var(--border); transition: all 0.3s; }
.timeline-step.active .timeline-dot { width: 20px; height: 20px; }
.timeline-card { flex: 1; background: var(--white); border-radius: 10px; padding: 14px 18px; border: 1px solid var(--border); transition: all 0.3s; }

.resolved-box { background: var(--green-bg); border-radius: 12px; padding: 20px 24px; margin-top: 12px; margin-left: 56px; border: 1px solid rgba(39,174,96,0.13); }
.resolved-title { font-weight: 700; font-size: 15px; color: var(--green); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.resolved-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.resolved-label { font-size: 11px; color: var(--muted); }
.resolved-value { font-weight: 600; font-size: 14px; margin-top: 2px; }
.resolved-compare { margin-top: 14px; padding: 12px 16px; background: var(--white); border-radius: 8px; font-size: 13px; line-height: 1.6; }
.replay-btn { margin-top: 14px; background: var(--navy); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 600; }

/* Dashboard styles */
.dash-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 12px; margin-bottom: 20px; }
.dash-kpi { background: var(--white); border-radius: 10px; padding: 16px; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.dash-kpi-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.dash-kpi-val { font-size: 24px; font-weight: 700; line-height: 1.1; }
.dash-kpi-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.dash-panel { background: var(--white); border-radius: 10px; padding: 18px; border: 1px solid var(--border); }
.dash-panel-title { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
.dash-grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }

.donut-wrap { display: flex; align-items: center; gap: 16px; }
.donut-legend { font-size: 12px; line-height: 2; }
.donut-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

.bar-chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.bar-chart-label { font-size: 11px; min-width: 30px; text-align: right; color: var(--muted); }
.bar-group { display: flex; gap: 3px; flex:1; }
.bar-planned { height: 18px; border-radius: 3px; background: var(--navy); }
.bar-completed { height: 18px; border-radius: 3px; background: var(--green); }
.bar-overdue { height: 18px; border-radius: 3px; background: var(--red); }

.cat-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
.cat-bar-label { width:130px; font-size:11.5px; color:var(--muted); text-align:right; flex-shrink:0; }
.cat-bar-track { flex:1; height:18px; background:#EEF1F6; border-radius:4px; overflow:hidden; }
.cat-bar-fill { height:100%; border-radius:4px; display:flex; align-items:center; padding-left:8px; font-size:10.5px; font-weight:600; color:#fff; }

.wo-summary { display: flex; gap: 12px; text-align: center; }
.wo-box { flex: 1; padding: 12px 8px; border-radius: 10px; }
.wo-box-val { font-size: 22px; font-weight: 700; }
.wo-box-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

.alert-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.alert-item:last-child { border-bottom: none; }
.alert-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; }
.alert-time { font-size: 10px; color: var(--muted); white-space: nowrap; margin-left: auto; flex-shrink: 0; }

.maint-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.maint-item:last-child { border-bottom: none; }
.maint-icon { margin-right: 8px; }

.doc-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.doc-item:last-child { border-bottom: none; }
.doc-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--navy-pale); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

.view-link { font-size: 12px; color: var(--navy); font-weight: 600; margin-top: 10px; display: inline-block; }

.footer { text-align: center; padding: 40px 24px 24px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); background: var(--white); }

.staff-perf-header, .staff-perf-row {
  display: grid;
  grid-template-columns: 1.4fr 0.8fr 0.8fr 1fr 1fr;
  gap: 8px;
  align-items: center;
}
.staff-perf-header { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.staff-perf-header .staff-perf-cell { color: var(--muted); font-size: 10.5px; text-transform: uppercase; text-align: right; }
.staff-perf-header .staff-perf-name { text-align: left; }
.staff-perf-row { padding: 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.staff-perf-row .staff-perf-cell { text-align: right; }
.staff-perf-row .staff-perf-name { text-align: left; font-weight: 600; }
.staff-perf-label { display: none; }

@media (max-width: 640px) {
  .staff-perf-header { display: none; }
  .staff-perf-row {
    display: block;
    background: #F7F8FA;
    border-radius: 8px;
    margin-bottom: 8px;
    border-bottom: none;
    padding: 12px 14px;
  }
  .staff-perf-row .staff-perf-name { font-size: 14px; margin-bottom: 8px; }
  .staff-perf-row .staff-perf-cell { display: flex; justify-content: space-between; padding: 3px 0; }
  .staff-perf-label { display: inline; color: var(--muted); font-size: 11.5px; }
  .staff-perf-val { font-weight: 600; }
}

/* Systems tab */
.sys-card { background:var(--white); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:14px; }
.sys-card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
.sys-card-name { font-size:15px; font-weight:700; color:var(--navy); }
.sys-card-count { font-size:11px; font-weight:600; padding:4px 12px; border-radius:12px; background:var(--navy-pale); color:var(--navy); }
.sys-card-desc { font-size:13px; color:var(--muted); line-height:1.6; }

/* Maintenance tab */
.freq-row { display:flex; align-items:center; gap:10px; margin-bottom:9px; }
.freq-label { width:150px; font-size:12px; color:var(--muted); text-align:right; flex-shrink:0; }
.freq-track { flex:1; height:20px; background:#EEF1F6; border-radius:4px; overflow:hidden; }
.freq-fill { height:100%; border-radius:4px; display:flex; align-items:center; padding-left:8px; font-size:11px; font-weight:600; color:#fff; }

.wo-flow { display:flex; flex-direction:column; gap:0; }
.wo-flow-step { display:flex; gap:14px; position:relative; padding-bottom:22px; }
.wo-flow-step::before { content:''; position:absolute; left:15px; top:32px; bottom:0; width:2px; background:var(--border); }
.wo-flow-step:last-child::before { display:none; }
.wo-flow-num { width:32px; height:32px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
.wo-flow-body { flex:1; padding-top:2px; }
.wo-flow-title { font-weight:600; font-size:13.5px; }
.wo-flow-desc { font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.5; }
.wo-flow-channel { display:inline-block; font-size:10px; font-weight:600; padding:2px 8px; border-radius:8px; margin-top:6px; margin-right:6px; }
.chan-sms { background:var(--blue-bg); color:var(--blue); }
.chan-email { background:var(--purple-bg); color:var(--purple); }
.chan-system { background:var(--green-bg); color:var(--green); }

/* Level view */
.level-row { display:flex; justify-content:space-between; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--border); gap:10px; }
.level-row:last-child { border-bottom:none; }
.level-name { font-size:13.5px; font-weight:700; color:var(--navy); }
.level-detail { font-size:11.5px; color:var(--muted); margin-top:2px; }
.level-count { font-size:12px; color:var(--muted); white-space:nowrap; font-weight:600; }

@media (max-width: 700px) {
  .dash-grid { grid-template-columns: 1fr; }
  .dash-grid-4 { grid-template-columns: 1fr; }
  .dash-kpi-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
}
</style>
<script src="https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>
<body>

<div id="sidebarTooltip" class="sidebar-tooltip-box"></div>

<div class="header">
  <div class="header-left">
    <div class="header-logo"><img src="/logo.png" alt="GVC"></div>
    <div>
      <div class="header-title">Facility Asset Manager</div>
      <div class="header-sub" id="header-subtitle">Prepared for [Client Name] — [Building Name] · MEP Systems</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <select id="facilitySwitcher" onchange="onFacilityFilterChange(this.value)" style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">
      <option value="__all__" style="color:#1A1A2E;background:#fff">All Facilities</option>
    </select>
    <select id="buildingSwitcher" onchange="setBuildingFilter(this.value)" style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer">
      <option value="__all__" style="color:#1A1A2E;background:#fff">All Buildings</option>
    </select>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <div class="live-label"><div class="live-dot"></div> Live Monitoring</div>
    <div id="loggedInUserBadge" style="display:none;align-items:center;gap:8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:4px 12px 4px 4px">
      <div id="userAvatarCircle" style="width:26px;height:26px;border-radius:50%;background:#F0A93E;color:#1A3566;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden"></div>
      <div style="line-height:1.2">
        <div id="userNameLabel" style="font-size:12px;font-weight:600;color:#fff"></div>
        <div id="userRoleLabel" style="font-size:10px;color:rgba(255,255,255,0.7)"></div>

// deployment's CLIENT_NAME / CLIENT_BUILDING_LABEL / etc. env vars
// say — so a new client deployment is a Vercel env var change, not a
// hand-edit here. If that fetch ever fails, these defaults are what's

// ============================================================
const CLIENT_CONFIG = {
  clientName: "Zanzibar One Tower",
  buildingLabel: "Zanzibar One Tower",

// Applies whatever's currently in CLIENT_CONFIG to the page — called
// once immediately with the defaults above, then again if the fetch
// below brings back different values.
function applyClientConfigToPage() {
  document.title = CLIENT_CONFIG.pageTitle + " — " + CLIENT_CONFIG.clientName;
  const sub = document.getElementById('header-subtitle');
  if (sub) sub.textContent = `Prepared for ${CLIENT_CONFIG.clientName} · ${CLIENT_CONFIG.district}, ${CLIENT_CONFIG.region} · MEP Systems`;
}

applyClientConfigToPage();
document.addEventListener('DOMContentLoaded', applyClientConfigToPage);

// Best-effort override — mutates the same CLIENT_CONFIG object in
// place (never reassigned), so every other place in this file that
// reads CLIENT_CONFIG.xxx automatically sees the real values too,
// with zero other changes needed anywhere else in this file.
fetch('/api/get-assets?clientconfig=true')
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (!data) return;
    Object.assign(CLIENT_CONFIG, data);
    applyClientConfigToPage();
  })
  .catch(err => console.error('Client config fetch failed — using built-in defaults:', err));

// for now, while access control is worked out per-client. Flip this to

const TEMP_SHOW_COST_TO_ALL = true;

// Legacy imported assets use "L1", "L14" etc. In this building, L1 is the
// Ground Floor and L15 is the top floor (no separate rooftop level) — so
// L1 -> GF, and everything above shifts down by one: L2 -> F1, L15 -> F14.
// New assets (via Add Asset) already use the correct GF/B1-B3/M/F1-F20/RF
// convention directly, so this only affects display of legacy "L" data —
// the underlying Airtable value is untouched, safe to run every time.
// Calculated from the asset's own Last Service and Next Service Due dates —
// not a separately typed number, so it can never drift out of sync with
// what's actually on record. Returns null if either date is missing.
// Returns { label, color } for an asset's warranty status — a separate
// clock from depreciation. "Expiring Soon" is within 30 days.
function warrantyStatus(expiryDate) {
  if (!expiryDate) return { label: 'No warranty on record', color: 'var(--muted)' };
  const days = Math.round((new Date(expiryDate) - new Date()) / 86400000);
  if (days < 0) return { label: `Expired ${Math.abs(days)}d ago (${expiryDate})`, color: 'var(--red)' };
  if (days <= 30) return { label: `Expires in ${days}d (${expiryDate})`, color: 'var(--amber)' };
  return { label: `Active until ${expiryDate}`, color: 'var(--green)' };
}

function calcMaintenanceInterval(lastService, nextService) {
  if (!lastService || !nextService) return null;
  const days = Math.round((new Date(nextService) - new Date(lastService)) / 86400000);
  return days > 0 ? days : null;
}
function formatInterval(days) {
  if (days === null || days === undefined) return '—';
  if (days >= 60) return `${days}d (~${Math.round(days/30)}mo)`;
  return `${days} days`;
}

// Maps an asset's name/system to one of the sourced ISO/NFPA checklist
// keys in lib/checklists.js. Returns null if nothing matches — better to
// show "no checklist mapped yet" than guess wrong and imply a standard
// that doesn't actually apply to this equipment.
// Suggests System/Criticality/Lifespan from an asset's Name as it's
// typed — lets a non-technical person confirm a sensible guess instead
// of having to correctly classify equipment they may not understand.
// Never overrides something the person already changed themselves.
function guessAssetDefaults(name) {
  const text = (name || "").toLowerCase();
  if (text.includes("fire pump") || text.includes("fire protection")) return { system: "Fire Protection", criticality: "High", lifespan: 20 };
  if (text.includes("generator")) return { system: "Electrical", criticality: "High", lifespan: 20 };
  if (text.includes("transformer") || text.includes("switchgear")) return { system: "Electrical", criticality: "High", lifespan: 25 };
  if (text.includes("ups")) return { system: "Electrical", criticality: "High", lifespan: 8 };
  if (text.includes("chiller") || text.includes("ahu") || text.includes("cooling tower") || text.includes("fan coil")) return { system: "HVAC", criticality: "Medium", lifespan: 20 };
  if (text.includes("lift") || text.includes("elevator")) return { system: "Vertical Transport", criticality: "High", lifespan: 25 };
  if (text.includes("pump")) return { system: "Plumbing", criticality: "Medium", lifespan: 15 };
  if (text.includes("cctv") || text.includes("camera")) return { system: "CCTV & Access Control", criticality: "Medium", lifespan: 7 };
  if (text.includes("access control") || text.includes("door reader")) return { system: "CCTV & Access Control", criticality: "Medium", lifespan: 10 };
  if (text.includes("smoke detector") || text.includes("fire detection") || text.includes("fire panel")) return { system: "Fire Detection", criticality: "High", lifespan: 15 };
  if (text.includes("bms") || text.includes("controls")) return { system: "Controls", criticality: "Medium", lifespan: 15 };
  if (text.includes("barrier") || text.includes("parking")) return { system: "Parking System", criticality: "Low", lifespan: 10 };
  return null; // no confident guess — let the person choose, no wrong assumption offered
}

function guessChecklistClass(name, system) {
  const text = (name + " " + (system||"")).toLowerCase();
  if (text.includes("pump")) return "Pump";
  if (text.includes("generator")) return "Generator";
  if (text.includes("lift") || text.includes("elevator")) return "Lift / Elevator";
  if (text.includes("ups")) return "UPS";
  if (text.includes("fire panel") || text.includes("fire detection")) return "Fire Panel";
  if (text.includes("chiller") || text.includes("ahu") || text.includes("fan coil") || text.includes("cooling tower") || text.includes("air conditioning")) return "Air Conditioning Unit";
  if (text.includes("cctv")) return "CCTV Camera";
  if (text.includes("access control")) return "Access Control Panel";
  if (text.includes("computer") && !text.includes("bms")) return "Desktop Computer";
  if (text.includes("smoke detector")) return "Smoke Detector";
  if (text.includes("compressor")) return "Compressor";
  return null;
}

function displayFloor(floor) {
  if (!floor) return '';
  const m = floor.match(/^L(\d+)$/i);
  if (!m) return floor; // already GF/B1/F3/M/RF etc — pass through unchanged
  const n = parseInt(m[1], 10);
  return n === 1 ? 'GF' : `F${n - 1}`;
}

// Some Room/Zone values are free text that embed the old floor naming
// inside the description itself (e.g. "L14 Office Entry", "Level 8
// Mechanical Room", "Rooftop Level 15") rather than using the clean
// coded Floor field. This relabels those embedded references the same
// way displayFloor() does, so the whole system reads consistently —
// the underlying Airtable text is untouched, display only.
function displayRoom(room) {
  if (!room) return '';
  let out = room;
  // Spelled-out "Level N" -> "Ground Floor" or "Floor N-1"
  out = out.replace(/\bLevel\s+(\d+)\b/gi, (full, numStr) => {
    const n = parseInt(numStr, 10);
    return n === 1 ? 'Ground Floor' : `Floor ${n - 1}`;
  });
  // Compact "L14" style token -> "GF" or "F13"
  out = out.replace(/\bL(\d+)\b/gi, (full, numStr) => {
    const n = parseInt(numStr, 10);
    return n === 1 ? 'GF' : `F${n - 1}`;
  });
  return out;
}

// converts and labels correctly for whichever currency is currently
// selected. Amount is always in TZS (the real stored value); this
// never mutates the underlying data, only the presentation.
function formatCurrency(amountInTzs) {
  if (amountInTzs === null || amountInTzs === undefined || isNaN(amountInTzs)) return '—';
  if (currentCurrency === 'TZS' || !exchangeRates[currentCurrency]) {
    return 'TZS ' + Math.round(amountInTzs).toLocaleString();
  }
  const converted = amountInTzs * exchangeRates[currentCurrency];
  return currentCurrency + ' ' + converted.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function setCurrency(value) {
  currentCurrency = value;

    showDetail(currentAssetDetailIdx);

}

// so setting it in one place is reflected everywhere costs appear.
// instanceId keeps each rendered copy's dropdown/search elements

function currencySwitcherHtml(instanceId) {

// Renders the currency list inside one dropdown instance — TZS and USD
// pinned at the top (still searchable, not exempt from filtering),
// everything else alphabetical by code below a divider. Search matches
// against both the code itself and the country name, since a code
// alone ("KES") isn't something everyone can search for by heart.
function renderCurrencyList(instanceId, query) {
  const listEl = document.getElementById('curList-' + instanceId);
  if (!listEl) return;
  const q = (query || '').trim().toLowerCase();

  const pinned = ['TZS', 'USD'];
  const knownCodes = new Set(['TZS', ...Object.keys(exchangeRates || {})]);
  const otherCodes = [...knownCodes].filter(c => !pinned.includes(c)).sort();

  function matches(code) {
    if (!q) return true;
    const country = (CURRENCY_COUNTRIES[code] || '').toLowerCase();
    return code.toLowerCase().includes(q) || country.includes(q);
  }

  function itemHtml(code) {
    const country = CURRENCY_COUNTRIES[code] || '';
    const selected = code === currentCurrency;
    return `<div onclick="selectCurrencyFromDropdown('${instanceId}','${code}')"
      style="padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;${selected ? 'background:var(--navy);color:#fff' : 'color:var(--navy)'}"
      onmouseover="if(${selected ? 'false' : 'true'})this.style.background='#F1F4F9'"
      onmouseout="if(${selected ? 'false' : 'true'})this.style.background='transparent'">
      <span style="font-weight:600;flex:0 0 auto">${code}</span>
      <span style="opacity:0.7;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right">${country}</span>
    </div>`;
  }

  const pinnedMatches = pinned.filter(matches);
  const otherMatches = otherCodes.filter(matches);

  let html = '';
  if (pinnedMatches.length) html += pinnedMatches.map(itemHtml).join('');
  if (pinnedMatches.length && otherMatches.length) html += `<div style="border-top:1px solid var(--border);margin:6px 0"></div>`;
  if (otherMatches.length) {
    html += otherMatches.map(itemHtml).join('');
  } else if (!pinnedMatches.length) {
    html += `<div style="padding:12px 8px;color:#9CA3AF;font-size:12px;text-align:center">No matching currency or country</div>`;
  }
  listEl.innerHTML = html;
}

// Escapes text for safe use inside an HTML attribute or text node —
// used wherever a real filename or name (which could contain quotes
// or other characters) needs to land in markup without breaking it.
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Shared by every uploaded document across the dashboard (unit
// contracts, SLAs) — preview without leaving the page, and a real
// download that works regardless of the file's actual origin.
// Registered by ID rather than passed through inline onclick string
// interpolation, so a filename containing a quote or other special
// character can never break the button's own markup.
let _docRegistry = {};
function registerDoc(id, url, filename) {
  _docRegistry[id] = { url, filename };
}

function previewDownloadButtonsHtml(docId, url, filename) {
  registerDoc(docId, url, filename);
  return `<span style="display:inline-flex;gap:10px;align-items:center">
    <a href="#" onclick="previewDocument('${docId}'); return false;" style="font-size:13px;color:var(--navy);text-decoration:underline;cursor:pointer">👁 Preview</a>
    <a href="#" onclick="downloadDocument('${docId}'); return false;" style="font-size:13px;color:var(--navy);text-decoration:underline;cursor:pointer">⬇ Download</a>
  </span>`;
}

function previewDocument(docId) {
  const doc = _docRegistry[docId];
  if (!doc) return;
  const isImage = /\.(jpe?g|png|gif|webp)$/i.test(doc.filename || '');
  const overlay = document.createElement('div');
  overlay.id = 'docPreviewOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(17,24,39,0.75);display:flex;align-items:center;justify-content:center;z-index:2000;padding:24px';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;width:min(820px,100%);height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
        <div style="font-size:13px;font-weight:600;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(doc.filename || 'Document')}</div>
        <div style="display:flex;gap:14px;align-items:center;flex-shrink:0">
          <a href="#" onclick="downloadDocument('${docId}'); return false;" style="font-size:12.5px;color:var(--navy);text-decoration:underline;cursor:pointer">⬇ Download</a>
          <button onclick="document.getElementById('docPreviewOverlay').remove()" style="border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)">×</button>
        </div>
      </div>
      <div style="flex:1;overflow:auto;background:#F5F7FA">
        ${isImage
          ? `<img src="${doc.url}" style="width:100%;height:auto;display:block">`
          : `<iframe src="${doc.url}" style="width:100%;height:100%;border:none"></iframe>`}
      </div>
    </div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// Fetches the file and saves it via a blob URL rather than a plain
// <a download> — the plain attribute is silently ignored by most
// browsers for cross-origin URLs (which every stored document's
// signed URL is, since it points at Supabase's own domain), so a
// direct link would just open the file instead of actually saving it.
async function downloadDocument(docId) {
  const doc = _docRegistry[docId];
  if (!doc) return;
  try {
    const resp = await fetch(doc.url);
    if (!resp.ok) throw new Error('Could not fetch the file');
    const blob = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = doc.filename || 'document';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(blobUrl);
  } catch (err) {
    alert('Could not download the file: ' + err.message);
  }
}

function toggleCurrencyDropdown(instanceId) {
  // Only one dropdown open at a time — close any other instance first.
  document.querySelectorAll('[id^="curDropdown-"]').forEach(el => {
    if (el.id !== 'curDropdown-' + instanceId) el.style.display = 'none';
  });
  const dropdown = document.getElementById('curDropdown-' + instanceId);
  if (!dropdown) return;
  const willOpen = dropdown.style.display !== 'flex';
  dropdown.style.display = willOpen ? 'flex' : 'none';
  if (willOpen) {
    renderCurrencyList(instanceId, '');
    const input = dropdown.querySelector('input');
    if (input) { input.value = ''; setTimeout(function () { input.focus(); }, 0); }
  }
}

// Facility dropdown — static list of every facility, always the same
// regardless of anything else selected.
function populateFacilityDropdown() {
  const sel = document.getElementById('facilitySwitcher');

  facilitiesData.forEach(f => {

  sel.value = current;

// Building dropdown — scoped to whichever Facility is currently
// selected. "All Facilities" shows every building across all
// facilities, flat; a specific Facility shows only its own buildings.
function populateBuildingDropdown() {
  const sel = document.getElementById('buildingSwitcher');
  if (!sel) return;
  const allLabel = currentFacilityFilter === "__all__" ? "All Buildings" : `All of ${currentFacilityFilter}`;
  let html = `<option value="__all__" style="color:#1A1A2E;background:#fff">${allLabel}</option>`;
  const relevantFacilities = currentFacilityFilter === "__all__"
    ? facilitiesData
    : facilitiesData.filter(f => f.name === currentFacilityFilter);
  relevantFacilities.forEach(f => {
    f.buildings.forEach(b => {
      html += `<option value="${b}" style="color:#1A1A2E;background:#fff">${b}</option>`;
    });
  });
  sel.innerHTML = html;
  sel.value = currentBuildingFilter;
}

function refreshBuildingSwitcherOptions() {
  populateFacilityDropdown();
  populateBuildingDropdown();
}

// Filters an already-fetched assets/work-orders array by the current
// Facility + Building selection together. A specific Building always
// wins if set; otherwise a specific Facility matches any building
// belonging to it; "__all__" on both is a no-op.
function filterByBuilding(items) {
  if (currentBuildingFilter !== "__all__") {
    return (items || []).filter(i => i.building === currentBuildingFilter);
  }
  if (currentFacilityFilter !== "__all__") {
    const facility = facilitiesData.find(f => f.name === currentFacilityFilter);
    const buildingSet = new Set(facility ? facility.buildings : []);
    return (items || []).filter(i => buildingSet.has(i.building));
  }
  return items;
}

// Response and resolution are shown as two separate signals, not one
// combined badge — they mean genuinely different things (did staff
// act quickly vs was the job actually finished in time), and
// collapsing them loses real information, especially for an open
// work order where response might already be Met while resolution is
// still pending. Each only renders once it's actually measurable —
// no badge for "not yet responded to" or "not yet completed", since
// that's the normal state of most open work, not something worth
// flagging.
function renderSLABadges(sla) {
  if (!sla || !sla.hasTarget) return '';
  let html = '';
  if (sla.responseMet !== null) {
    html += sla.responseMet
      ? `<span title="Responded in ${sla.responseHours}h (target ${sla.targetResponseHours}h)" style="font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:14px;background:#DCFCE7;color:#166534">✓ Response</span>`
      : `<span title="Responded in ${sla.responseHours}h (target was ${sla.targetResponseHours}h)" style="font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:14px;background:#FEE2E2;color:#991B1B">⚠ Response Breached</span>`;
  }
  if (sla.resolutionMet !== null) {
    html += sla.resolutionMet
      ? `<span title="Resolved in ${sla.resolutionHours}h (target ${sla.targetResolutionHours}h)" style="font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:14px;background:#DCFCE7;color:#166534">✓ Resolution</span>`
      : `<span title="Resolved in ${sla.resolutionHours}h (target was ${sla.targetResolutionHours}h)" style="font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:14px;background:#FEE2E2;color:#991B1B">⚠ Resolution Breached</span>`;

  return html;
}

function drawDonut(canvas, segments, size) {
  const ctx = canvas.getContext('2d');
  const cx = size/2, cy = size/2, r = size*0.38, inner = size*0.26;
  let start = -Math.PI/2;
  const total = segments.reduce((s,seg)=>s+seg.value,0);
  segments.forEach(seg => {
    const angle = (seg.value/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.closePath(); ctx.fillStyle = seg.color; ctx.fill();
    start += angle;
  });
  ctx.beginPath(); ctx.arc(cx,cy,inner,0,Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
}

function renderDashboard() {
  const windowDays = parseInt(currentDashboardWindow || 30);
  // filterByBuilding works on assets too — both assets and work orders
  // carry the same .building field now, so one shared helper covers
  // both without needing a second, parallel function.
  const dashAssets = filterByBuilding(assets);
  const total = dashAssets.length;
  const operational = dashAssets.filter(a=>a.status==="Good").length;
  const schedMaint = dashAssets.filter(a=>a.status==="Poor").length;
  const needsAttn = dashAssets.filter(a=>a.status==="Critical").length;
  const opPct = Math.round((operational/total)*100);
  const attnPct = Math.round((needsAttn/total)*100);
  const criticalAlerts = dashAssets.filter(a=>a.criticality==="High" && a.status!=="Operational").length;
  const plannedNext30 = dashAssets.filter(a=>{ const d=daysUntil(a.nextService); return d>=0 && d<=windowDays; }).length;

  // Building-filtered for this render only — the global dashboardWorkOrders
  // and assets arrays stay unfiltered, since other code (record lookups,
  // unread badges, Asset Register) depends on them having everything.
  const dashWOs = filterByBuilding(dashboardWorkOrders);
  refreshBuildingSwitcherOptions();

  let html = '';

  // Shows exactly which slice of the campus this Dashboard is currently
  // scoped to — reflects the same Facility/Building switcher in the
  // header, so it's never ambiguous what "Total Assets" etc. actually
  // means without having to check the dropdowns themselves.
  let scopeLabel = 'All Campus';
  if (currentBuildingFilter !== '__all__') {
    scopeLabel = currentFacilityFilter !== '__all__' ? `${currentFacilityFilter} → ${currentBuildingFilter}` : currentBuildingFilter;
  } else if (currentFacilityFilter !== '__all__') {
    scopeLabel = `${currentFacilityFilter} — All Buildings`;
  }
  html += `<div style="font-size:13px;font-weight:600;color:var(--navy);margin-bottom:12px">📍 Viewing: ${scopeLabel}</div>`;

  // Dashboard timeframe selector — a simple dropdown instead of a row of buttons
  html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap">
    <span style="font-size:12px;color:var(--muted)">Dashboard window:</span>
    <select class="filter-select" onchange="currentDashboardWindow=parseInt(this.value);renderDashboard()">
      ${[3,7,14,21,30,90,180,365].map(d => `<option value="${d}"${windowDays===d?' selected':''}>${d <= 30 ? d+' Days' : d <= 180 ? Math.round(d/30)+' Months' : '1 Year'}</option>`).join('')}
    </select>
  </div>`;

// Maintenance-cost-to-acquisition-cost ratio, as a plain 0-100+ number
// (or null if there's no acquisition cost to compare against). Used
// for both the sort option and the warning badge on flagged rows.
function getMaintenanceCostRatio(a) {
  const summary = assetCostSummaryCache && assetCostSummaryCache[a.id];
  if (!summary || !a.acquisitionCost) return null;
  return (summary.total / a.acquisitionCost) * 100;
}

function getFilteredAssets() {
  // Global building selection applies here too — same single filter as
  // Dashboard and Work Orders, not a separate one local to this tab.
  let result = filterByBuilding(assets).filter(a => {
    if(currentSystemFilter!=="All" && a.system!==currentSystemFilter) return false;
    if(currentStatusFilter!=="All" && a.status!==currentStatusFilter) return false;
    if(currentCriticalityFilter!=="All" && a.criticality!==currentCriticalityFilter) return false;
    if(currentNatureFilter!=="All" && a.nature!==currentNatureFilter) return false;
    if(currentMobilityFilter!=="All" && a.mobility!==currentMobilityFilter) return false;
    if(currentCategoryFilter!=="All" && a.category!==currentCategoryFilter) return false;
    if(currentFloorFilter!=="All" && a.floor!==currentFloorFilter) return false;
    if(currentRoomFilter!=="All" && a.room!==currentRoomFilter) return false;
    if(currentSearch) {
      const q = currentSearch.toLowerCase();
      const hay = (a.id+" "+a.name+" "+a.room+" "+a.manufacturer+" "+a.model+" "+a.category+" "+(a.nature||"")+" "+(a.category||"")+" "+(a.building||"")+" "+(a.room||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if (currentSortBy === 'costRatioDesc') {
    result = result.slice().sort((a, b) => (getMaintenanceCostRatio(b) ?? -1) - (getMaintenanceCostRatio(a) ?? -1));
  } else if (currentSortBy === 'costRatioAsc') {
    // Assets with no ratio at all (no acquisition cost, or no maintenance
    // recorded yet) sort to the end here too, rather than falsely
    // appearing as "lowest cost" ahead of assets that actually have a
    // real, low ratio.
    result = result.slice().sort((a, b) => {
      const ra = getMaintenanceCostRatio(a), rb = getMaintenanceCostRatio(b);
      if (ra === null && rb === null) return 0;
      if (ra === null) return 1;
      if (rb === null) return -1;
      return ra - rb;
    });
  }
  return result;
}

// Maintenance Cost Summary for one asset — direct TZS totals by type
// first (the actual numbers), with the acquisition-cost comparison as
// a small line underneath, not the headline. Confirmed with Grace:
// "numbers are direct, ratios are complex" — so the ratio is context,
// not the star of the display.
async function renderMaintCostSection(a) {
  const el = document.getElementById('maintCostContent');
  if (!el) return;
  const summaries = await loadAssetCostSummaries();
  const s = summaries[a.id];

  if (!s || !s.total) {
    el.innerHTML = `<div style="font-size:12px;color:var(--muted)">No maintenance costs recorded yet for this asset.</div>`;
    return;
  }

  const types = [
    ['Preventive', s.Preventive], ['Corrective', s.Corrective],
    ['Inspection', s.Inspection], ['Procurement', s.Procurement], ['Other', s.Other],
  ].filter(([, v]) => v > 0);

  let html = `<div style="font-size:26px;font-weight:700;color:var(--navy);margin-bottom:2px">${formatCurrency(s.total)}</div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:12px">Total maintenance spend recorded for this asset</div>`;

  if (types.length > 0) {
    html += `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      ${types.map(([label, v]) => `<div style="background:#F7F8FA;border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:110px">
        <div style="font-size:10.5px;color:var(--muted)">${label}</div>
        <div style="font-size:14px;font-weight:600;color:var(--text)">${formatCurrency(v)}</div>
      </div>`).join('')}
    </div>`;
  }

  if (a.acquisitionCost) {
    const ratio = (s.total / a.acquisitionCost) * 100;
    const color = ratio >= 75 ? 'var(--red)' : ratio >= 50 ? 'var(--amber)' : 'var(--muted)';
    const note = ratio >= 75 ? ' — consider replacement' : ratio >= 50 ? ' — high maintenance cost' : '';
    html += `<div style="font-size:11.5px;color:${color}">Maintenance cost is ${ratio.toFixed(0)}% of acquisition cost (${formatCurrency(a.acquisitionCost)})${note}, automatically calculated.</div>`;
  }

  el.innerHTML = html;
}

    <div class="summary-card"><div class="summary-val" style="color:var(--red)">${attn}</div><div class="summary-label">Critical</div></div>
  </div>`;

  // Search input uses renderAssetResults() ONLY — never renderAssets() —
  // so typing never rebuilds this input itself. Rebuilding it mid-type
  // is what caused the "type one letter, lose focus" bug: the browser
  // can't keep a cursor position in a DOM node that just got destroyed
  // and recreated.
  html += `<div class="filter-row">
    <input type="text" id="assetSearchInput" class="search-input" placeholder="Search by asset ID, name, location, manufacturer…" value="${currentSearch}" oninput="currentSearch=this.value;renderAssetResults()">
    <select class="filter-select" onchange="currentSortBy=this.value;renderAssetResults()">
      <option value="default"${currentSortBy==='default'?' selected':''}>Maintenance Cost Ratio</option>
      <option value="costRatioDesc"${currentSortBy==='costRatioDesc'?' selected':''}>Highest first</option>
      <option value="costRatioAsc"${currentSortBy==='costRatioAsc'?' selected':''}>Lowest first</option>
    </select>
    <select class="filter-select" onchange="currentStatusFilter=this.value;renderAssets()">
      <option value="All">All Status</option>
      <option value="Good"${currentStatusFilter==='Good'?' selected':''}>Good</option>
      <option value="Poor"${currentStatusFilter==='Poor'?' selected':''}>Poor</option>
      <option value="Critical"${currentStatusFilter==='Critical'?' selected':''}>Critical</option>
    </select>
    <select class="filter-select" onchange="currentCriticalityFilter=this.value;renderAssets()">
      <option value="All">All Criticality</option>
      <option value="High"${currentCriticalityFilter==='High'?' selected':''}>High</option>
      <option value="Medium"${currentCriticalityFilter==='Medium'?' selected':''}>Medium</option>
      <option value="Low"${currentCriticalityFilter==='Low'?' selected':''}>Low</option>
    </select>
  </div>`;

  // Full hierarchy + location filter row, in order: Nature -> Mobility -> Category
  // -> System -> Floor -> Room/Zone. Each narrows the options in the next one.
  // Hidden entirely if no assets have classification data yet (e.g. before backfill import).
  const uniqueNatures = [...new Set(assets.map(a=>a.nature).filter(Boolean))];
  if (uniqueNatures.length > 0) {
    const filteredByNature = currentNatureFilter==="All" ? assets : assets.filter(a=>a.nature===currentNatureFilter);
    const uniqueMobilities = [...new Set(filteredByNature.map(a=>a.mobility).filter(Boolean))];
    const filteredByMobility = currentMobilityFilter==="All" ? filteredByNature : filteredByNature.filter(a=>a.mobility===currentMobilityFilter);
    const uniqueCategories = [...new Set(filteredByMobility.map(a=>a.category).filter(Boolean))];
    const filteredByCat = currentCategoryFilter==="All" ? filteredByMobility : filteredByMobility.filter(a=>a.category===currentCategoryFilter);
    const uniqueSystemsInBranch = [...new Set(filteredByCat.map(a=>a.system).filter(Boolean))].sort();
    const filteredBySystem = currentSystemFilter==="All" ? filteredByCat : filteredByCat.filter(a=>a.system===currentSystemFilter);
    const uniqueFloors = [...new Set(filteredBySystem.map(a=>a.floor).filter(Boolean))]
      .sort((a,b) => displayFloor(a).localeCompare(displayFloor(b), undefined, {numeric:true}));
    const filteredByFloor = currentFloorFilter==="All" ? filteredBySystem : filteredBySystem.filter(a=>a.floor===currentFloorFilter);
    const uniqueRooms = [...new Set(filteredByFloor.map(a=>a.room).filter(Boolean))].sort();

    html += `<div class="filter-row" style="gap:6px;flex-wrap:wrap">
      <select class="filter-select" onchange="currentNatureFilter=this.value;currentMobilityFilter='All';currentCategoryFilter='All';currentSystemFilter='All';currentFloorFilter='All';currentRoomFilter='All';renderAssets()">
        <option value="All">All Types</option>
        ${uniqueNatures.map(n=>`<option value="${n}"${currentNatureFilter===n?' selected':''}>${n}</option>`).join('')}
      </select>
      ${currentNatureFilter==='Tangible' ? `<select class="filter-select" onchange="currentMobilityFilter=this.value;currentCategoryFilter='All';currentSystemFilter='All';currentFloorFilter='All';currentRoomFilter='All';renderAssets()">
        <option value="All">All Mobility</option>
        ${uniqueMobilities.map(m=>`<option value="${m}"${currentMobilityFilter===m?' selected':''}>${m}</option>`).join('')}
      </select>` : ''}
      <select class="filter-select" onchange="currentCategoryFilter=this.value;currentSystemFilter='All';currentFloorFilter='All';currentRoomFilter='All';renderAssets()">
        <option value="All">All Categories</option>
        ${uniqueCategories.map(c=>`<option value="${c}"${currentCategoryFilter===c?' selected':''}>${c}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="currentSystemFilter=this.value;currentFloorFilter='All';currentRoomFilter='All';renderAssets()">
        <option value="All">All Systems</option>
        ${uniqueSystemsInBranch.map(s=>`<option value="${s}"${currentSystemFilter===s?' selected':''}>${s}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="currentFloorFilter=this.value;currentRoomFilter='All';renderAssets()">
        <option value="All">All Floors</option>
        ${uniqueFloors.map(f=>`<option value="${f}"${currentFloorFilter===f?' selected':''}>${displayFloor(f)}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="currentRoomFilter=this.value;renderAssets()">
        <option value="All">All Rooms/Zones</option>
        ${uniqueRooms.map(r=>`<option value="${r}"${currentRoomFilter===r?' selected':''}>${displayRoom(r)}</option>`).join('')}
      </select>
      ${(currentNatureFilter!=='All'||currentMobilityFilter!=='All'||currentCategoryFilter!=='All'||currentSystemFilter!=='All'||currentFloorFilter!=='All'||currentRoomFilter!=='All') ? `<button class="filter-btn" onclick="currentNatureFilter='All';currentMobilityFilter='All';currentCategoryFilter='All';currentSystemFilter='All';currentFloorFilter='All';currentRoomFilter='All';renderAssets()" style="font-size:11px">✕ Clear</button>` : ''}
    </div>`;
  } else {
    // No classification data yet (pre-backfill) — still offer a plain System filter
    // as buttons so System filtering works even before Nature/Category are populated.
    html += `<div class="filters">`;
    systems.forEach(c => { html += `<button class="filter-btn${currentSystemFilter===c?' active':''}" onclick="currentSystemFilter='${c}';renderAssets()">${c}</button>`; });
    html += `</div>`;
  }

  html += `<div id="assetResultsContainer"></div>`;

  document.getElementById('view-assets').innerHTML = html;
  renderAssetResults(); // populate the results container on initial/full render

  // Cost summaries load in the background every time this tab renders
  // — the list shows immediately without waiting, then quietly
  // re-renders once fresh data is in, so newly entered costs (from a
  // work order, procurement fulfillment, etc.) never show stale.
  loadAssetCostSummaries().then(() => renderAssetResults());
}

// Renders ONLY the result count + asset list — called on every
// keystroke in search, and by renderAssets() itself after a full
// rebuild. Never touches the search input, dropdowns, or filter chips,
// so it can run continuously while someone is typing without breaking
// focus.
function renderAssetResults() {
  const filtered = getFilteredAssets();
  const container = document.getElementById('assetResultsContainer');
  if (!container) return;
  const canSeeCost = TEMP_SHOW_COST_TO_ALL || (currentUserPermissions && currentUserPermissions.viewCostAndDepreciation);

  let html = `<div class="result-count">Showing ${filtered.length} of ${assets.length} assets</div>`;
  html += `<div class="asset-list">`;
  filtered.forEach((a) => {
    const idx = assets.indexOf(a);
    const interval = calcMaintenanceInterval(a.lastService, a.nextService);
    const intervalBlock = `
      <div style="text-align:right;flex-shrink:0;min-width:90px">
        <div style="font-size:11px;color:var(--muted)">Interval</div>
        <div style="font-size:13px;font-weight:600;color:var(--text)">${formatInterval(interval)}</div>
      </div>`;
    const valueBlock = canSeeCost ? `
      <div style="text-align:right;flex-shrink:0;min-width:110px">
        <div style="font-size:11px;color:var(--muted)">Current Value</div>
        <div style="font-size:13px;font-weight:600;color:var(--navy)">${a.currentValue !== null && a.currentValue !== undefined ? formatCurrency(a.currentValue) : '—'}</div>
        ${a.fullyDepreciated ? '<div style="font-size:10px;color:var(--muted)">fully depreciated</div>' : ''}
      </div>` : '';
    const costRatio = getMaintenanceCostRatio(a);
    const costRatioBadge = (canSeeCost && costRatio !== null && costRatio >= 50)
      ? `<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:${costRatio >= 75 ? '#FEE2E2' : '#FEF3C7'};color:${costRatio >= 75 ? '#991B1B' : '#92400E'}">⚠ ${Math.round(costRatio)}% of acquisition cost in maintenance</span>`
      : '';
    html += `<button class="asset-row" onclick="showDetail(${idx})">
      <div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="asset-name">${a.name}</span><span class="asset-id">${a.id}</span>${a.needsTechnicalReview ? '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:#FEF3C7;color:#92400E">⚠ Needs Review</span>' : ''}${costRatioBadge}</div>
      <div class="asset-meta">${displayRoom(a.room)} · ${a.manufacturer} ${a.model}</div>
      <span class="asset-class">${a.category}</span></div>
      ${valueBlock}
      ${intervalBlock}
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0"><span class="badge ${statusBadge(a.status)}">${a.status}</span><span class="badge ${critBadge(a.criticality)}">${a.criticality}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div></button>`;
  });
  html += `</div>`;
  container.innerHTML = html;
}

let currentAssetDetailIdx = null;

function showDetail(idx) {
  currentAssetDetailIdx = idx;
  const a = assets[idx];
  const age = a.installDate ? (new Date().getFullYear()) - parseInt(a.installDate.split("-")[0]) : 0;
  const pct = Math.min((age/a.lifespan)*100, 100);
  const eol = a.installDate ? parseInt(a.installDate.split("-")[0]) + a.lifespan : "—";
  const canManage = currentUserPermissions && currentUserPermissions.addOrDecommissionAssets;
  const canRequestProcurement = currentUserPermissions && currentUserPermissions.requestProcurement;
  const canSeeCost = TEMP_SHOW_COST_TO_ALL || (currentUserPermissions && currentUserPermissions.viewCostAndDepreciation);
  const statusClass = (a.status||"").toLowerCase() === "good" ? "badge-good" : (a.status||"").toLowerCase() === "poor" ? "badge-warning" : "badge-overdue";
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.origin + '/asset?id=' + a.id)}`;

  let html = `<button class="back-btn" onclick="renderAssets()">← Back to Asset Register</button>
  <div class="detail-panel"><div class="detail-header"><div><div class="detail-title">${a.name}</div><div class="detail-sub">${a.id} · ${a.system}</div></div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    ${canManage ? `<button onclick="openEditForm(${idx})" style="padding:6px 14px;font-size:12px;font-weight:600;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer">✎ Edit</button>` : ""}
    ${canManage ? `<button onclick="scheduleInspection('${a.id}', '${a.name.replace(/'/g,"\\'")}')" style="padding:6px 14px;font-size:12px;font-weight:600;border:1px solid #7C3AED;border-radius:8px;background:#fff;color:#7C3AED;cursor:pointer">🔍 Schedule Inspection</button>` : ""}
    ${canRequestProcurement ? `<button onclick="orderSparePart('${a.id}', '${a.name.replace(/'/g,"\\'")}')" style="padding:6px 14px;font-size:12px;font-weight:600;border:1px solid #B45309;border-radius:8px;background:#fff;color:#B45309;cursor:pointer">🛒 Order a Spare Part</button>` : ""}
    ${canManage && a.needsTechnicalReview ? `<button onclick="markTechnicalReviewDone('${a.recordId}', ${idx})" style="padding:6px 14px;font-size:12px;font-weight:600;border:1px solid #92400E;border-radius:8px;background:#FEF3C7;color:#92400E;cursor:pointer">⚠ Mark Reviewed</button>` : ""}
    ${canManage ? `<button onclick="openRelocateForm('${a.recordId}', '${a.name.replace(/'/g,"\\'")}')" style="padding:6px 14px;font-size:12px;font-weight:600;border:1px solid var(--amber);border-radius:8px;background:#fff;color:var(--amber);cursor:pointer">Relocate</button>` : ""}
    ${canManage ? `<button onclick="decommissionAsset('${a.recordId}', '${a.name.replace(/'/g,"\\'")}')" style="padding:6px 14px;font-size:12px;font-weight:600;border:1px solid var(--red);border-radius:8px;background:#fff;color:var(--red);cursor:pointer">Decommission</button>` : ""}
    <span class="badge ${statusClass}" style="padding:4px 12px;border-radius:14px;font-size:12px">${a.status}</span>
    <span class="badge ${critBadge(a.criticality)}" style="padding:4px 12px;border-radius:14px;font-size:12px">${a.criticality}</span>
  </div></div>
  <div style="display:flex;gap:20px;padding:16px 24px;border-bottom:1px solid var(--border);align-items:flex-start;flex-wrap:wrap">
    <img src="${qrUrl}" alt="QR Code for ${a.id}" style="width:120px;height:120px;border-radius:6px;border:1px solid var(--border)" title="Scan to view this asset's public info page">
    ${a.nameplatePhoto ? `<a href="${a.nameplatePhoto.url}" target="_blank"><img src="${a.nameplatePhoto.url}" alt="Nameplate photo" style="width:120px;height:120px;object-fit:cover;border-radius:6px;border:1px solid var(--border)" title="Nameplate photo — click to view full size"></a>` : ''}
    <div style="flex:1;min-width:200px">
      ${a.needsTechnicalReview ? `<div style="background:#FEF3C7;color:#92400E;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:6px;margin-bottom:10px">⚠ Added by a non-technical role — classification not yet confirmed by an Engineer</div>` : ''}
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Classification</div>
      <div style="font-size:13px;line-height:1.8">${a.nature || "—"} → ${a.mobility ? a.mobility + " → " : ""}${a.category || "—"}</div>
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:10px 0 6px">Status</div>
      <span class="badge ${statusClass}" style="padding:4px 12px;border-radius:14px;font-size:12px">${a.status || "Good"}</span>
    </div>
  </div>
  <div class="detail-grid">`;

  const fields = [
    ["Floor/Level", displayFloor(a.floor) || "—"],
    ["Room/Zone", displayRoom(a.room) || "—"],
    ["System", a.system || "—"],
    ["Manufacturer", a.manufacturer],
    ["Model", a.model],
    ["Install Date", a.installDate],
    ["Expected Lifespan", a.lifespan+" years"],
    ["Asset Age", age+" years"],
    ["Last Service", a.lastService || "—"],
    ["Next Service Due", a.nextService || "—"],
    ["Maintenance Interval (Calculated)", formatInterval(calcMaintenanceInterval(a.lastService, a.nextService))],
    ["Warranty Status", `<span style="color:${warrantyStatus(a.warrantyExpiryDate).color};font-weight:600">${warrantyStatus(a.warrantyExpiryDate).label}</span>`],
    ["Added By", a.addedBy || "— (existing at pilot start)"],
  ];
  if (canSeeCost) {
    fields.push(["Acquisition Cost (TZS)", a.acquisitionCost ? Number(a.acquisitionCost).toLocaleString() : "Not set"]);
    fields.push(["Current Value (Calculated)", a.currentValue !== null && a.currentValue !== undefined ? Number(a.currentValue).toLocaleString() + (a.fullyDepreciated ? " (fully depreciated)" : "") : "—"]);
    if (a.annualDepreciation) fields.push(["Annual Depreciation", Number(a.annualDepreciation).toLocaleString() + " /yr"]);
  }
  fields.forEach(([l,v])=>{
    html += `<div class="detail-field"><div class="detail-field-label">${l}</div><div class="detail-field-value">${v}</div></div>`;
  });
  html += `</div>`;
  if(a.note) {
    html += `<div class="detail-alert" style="background:${statusBg(a.status)}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span><strong>Note:</strong> ${a.note}</span></div>`;
  }
  html += `<div class="lifecycle-bar-wrap"><div class="lifecycle-bar-label">Lifecycle Position</div><div class="lifecycle-track"><div class="lifecycle-fill" style="width:${pct}%;background:${barColor(pct)}"></div></div><div class="lifecycle-range"><span>Installed ${a.installDate}</span><span>Expected end-of-life ${eol}</span></div></div>`;

  // Tenant Unit — same access rule as the Units tab itself (everyone
  // except Technician). Independent of Room/Zone; shows here so
  // tagging an asset to its unit doesn't require leaving the asset's
  // own page.
  if (currentUserRole !== 'technician') {
    html += `<div style="padding:16px 24px;border-top:1px solid var(--border)">
      <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px">Tenant Unit</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:13px;color:${a.unit ? 'var(--text)' : 'var(--muted)'}">${a.unit || 'Not assigned to a unit'}</span>
        <button onclick="openAssignUnitModal('${a.recordId}', '${a.building || ''}')" style="padding:5px 12px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer">${a.unit ? 'Change' : 'Assign'}</button>
      </div>
    </div>`;
  }

  // Maintenance Cost Summary — direct totals first (the actual TZS
  // spent, by type), with the acquisition-cost comparison as a small
  // supporting line underneath, not the headline. Confirmed: numbers
  // are the primary thing, the ratio is just context.
  if (canSeeCost) {
    html += `<div id="maintCostSection" style="padding:16px 24px;border-top:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:12px;font-weight:600;color:var(--navy)">Maintenance Cost Summary</div>
        ${currencySwitcherHtml('detail')}
      </div>
      <div id="maintCostContent" style="font-size:12px;color:var(--muted)">Loading…</div>
    </div>`;
  }

  // ISO Maintenance Checklist — auto-matched to this asset's type from its name
  html += `<div id="checklistSection" style="padding:16px 24px;border-top:1px solid var(--border)">
    <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px">Maintenance Checklist</div>
    <div id="checklistContent" style="font-size:12px;color:var(--muted)">Loading…</div>
  </div>`;

  // Compliance Documents — real files (Fire Safety Certificate, OSHA
  // Licence, etc.), not system-generated records.
  html += `<div id="documentsSection" style="padding:16px 24px;border-top:1px solid var(--border)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:12px;font-weight:600;color:var(--navy)">Compliance Documents</div>
      ${canManage ? `<button onclick="document.getElementById('docUploadInput_${a.recordId}').click()" style="padding:5px 12px;font-size:11px;font-weight:600;border:1px solid var(--navy);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer">⬆ Upload Document</button>` : ''}
      <input type="file" id="docUploadInput_${a.recordId}" style="display:none" onchange="submitDocumentUpload('${a.recordId}', this)">
    </div>
    ${a.documents && a.documents.length > 0 ? `
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
        ${a.documents.map(doc => `<a href="${doc.url}" target="_blank" style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#F7F8FA;border:1px solid var(--border);border-radius:6px;text-decoration:none;color:var(--text);font-size:12.5px">
          <span>📄 ${doc.filename}</span>
          <span style="color:var(--muted);font-size:11px">${doc.size ? Math.round(doc.size/1024) + ' KB' : ''}</span>
        </a>`).join('')}
      </div>
      ${a.documentsUploadedBy ? `<div style="font-size:10.5px;color:var(--muted)">Last uploaded by ${a.documentsUploadedBy}${a.documentsUploadedDate ? ' · ' + new Date(a.documentsUploadedDate).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : ''}</div>` : ''}
    ` : `<div style="font-size:12px;color:var(--muted)">No documents uploaded yet — e.g. Fire Safety Certificate, OSHA Compliance Licence, or any real compliance paperwork for this asset.</div>`}
    <div id="docUploadStatus_${a.recordId}" style="font-size:11px;margin-top:6px"></div>
  </div>`;

  // Per-asset download options
  html += `<div style="display:flex;gap:8px;padding:16px 24px;border-top:1px solid var(--border)">
    <span style="font-size:11px;color:var(--muted);align-self:center">Download this asset:</span>
    <button onclick="exportSingleAssetFormat('${a.id}','xlsx')" style="padding:5px 12px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer">XLSX</button>
    <button onclick="exportSingleAssetFormat('${a.id}','csv')" style="padding:5px 12px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer">CSV</button>
    <button onclick="exportSingleAssetFormat('${a.id}','pdf')" style="padding:5px 12px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer">PDF</button>
    <button onclick="downloadQrCode('${qrUrl}','${a.id}','${a.id}')" style="padding:5px 12px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer">↓ QR Code</button>
  </div>`;

  // Audit trail — edit history
  html += `<div id="editLogSection" style="padding:16px 24px;border-top:1px solid var(--border)">
    <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px">Edit History</div>
    <div id="editLogEntries" style="font-size:12px;color:var(--muted)">Loading…</div>
  </div>`;

  html += `</div>`; // close detail-panel
  document.getElementById('view-assets').innerHTML = html;

  if (canSeeCost) renderMaintCostSection(a);

  // Load edit log
  fetch('/api/get-assets?editlog=true&id=' + encodeURIComponent(a.id))
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('editLogEntries');
      if (!data.entries || data.entries.length === 0) {
        el.textContent = 'No edits recorded yet.';
        return;
      }
      el.innerHTML = data.entries.map(e => {
        const dt = new Date(e.timestamp);
        const dateStr = dt.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'}) + ', ' + dt.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
        return `<div style="padding:6px 0;border-bottom:1px solid var(--border)"><strong>${e.field}</strong> changed from "${e.oldValue}" to "${e.newValue}" — by <strong>${e.editedBy}</strong> at ${dateStr}</div>`;
      }).join('');
    })
    .catch(() => {
      const el = document.getElementById('editLogEntries');
      if (el) el.textContent = 'Could not load edit history.';
    });

  // Load ISO maintenance checklist — auto-matched from the asset's name/system,
  // with a generic discipline-level fallback (derived from System, same
  // routing logic used for work orders) whenever no precise class matches.
  const checklistClass = guessChecklistClass(a.name, a.system);
  fetch('/api/work-orders?checklist=' + encodeURIComponent(checklistClass || '') + '&system=' + encodeURIComponent(a.system || '') + '&assetName=' + encodeURIComponent(a.name || ''))
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('checklistContent');
      if (!data.items || data.items.length === 0) {
        el.innerHTML = `<div>No checklist items defined yet.</div>`;
        return;
      }
      window.currentAssetChecklist = { asset: a, checklistClass: data.class, data };
      el.innerHTML = `
        <div style="font-size:12px;color:var(--text);margin-bottom:4px"><strong>${data.class}</strong> — ${data.items.length} items${data.generic ? '' : ', sourced from:'}</div>
        ${data.generic
          ? `<div style="font-size:11px;color:var(--amber);font-weight:600;margin-bottom:12px">General checklist — no asset-specific standard mapped yet</div>`
          : `<div style="font-size:11px;color:var(--navy);font-weight:600;margin-bottom:12px">${data.sourceStandard || 'Not specified'}</div>`}
        <div style="display:flex;gap:8px">
          <button onclick="previewMaintenanceChecklist()" style="padding:7px 14px;font-size:12px;font-weight:600;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer">👁 Preview</button>

        </div>`;
    })
    .catch(() => {
      document.getElementById('checklistContent').innerHTML = `<div>Could not load checklist.</div>`;
    });
}

function onEditNatureChange(skipReset, preselectCategory) {
  const nature = document.getElementById('ea_nature').value;
  document.getElementById('ea_mobilityWrap').style.display = nature === 'Tangible' ? 'block' : 'none';
  onEditCategoryOptionsRefresh(preselectCategory);
}
function onEditCategoryOptionsRefresh(preselectCategory) {
  const nature = document.getElementById('ea_nature').value;
  const mobility = document.getElementById('ea_mobility') ? document.getElementById('ea_mobility').value : 'Movable';
  const categorySelect = document.getElementById('ea_category');
  let categories;
  if (nature === 'Intangible') categories = ASSET_HIERARCHY.Intangible;
  else if (nature === 'Tangible') categories = ASSET_HIERARCHY.Tangible[mobility];
  else categories = ['Furniture','Equipment','Computer Hardware','Plant & Machinery','Transport Assets','Biological Assets','Valuable Documents','Library Books','Land','Buildings','Infrastructure','Heritage','Minerals & Other Resources','Computer Software','Trademarks','Licenses','Patent Rights','Right to Use','Others'];
  const current = preselectCategory !== undefined ? preselectCategory : categorySelect.value;
  categorySelect.innerHTML = categories.map(c => `<option value="${c}"${c===current?' selected':''}>${c}</option>`).join('');
  if (current && !categories.includes(current)) {
    categorySelect.insertAdjacentHTML('afterbegin', `<option value="${current}" selected>${current} (current)</option>`);
  }
}

  const overlay = document.getElementById('editAssetOverlay');

async function submitAssetEdit(recordId) {
  const errorBox = document.getElementById('editAssetError');
  const btn = document.getElementById('ea_submit');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  errorBox.style.display = 'none';

  const changes = {
    "Name": document.getElementById('ea_name').value.trim(),
    "Asset Nature": document.getElementById('ea_nature').value,
    "Mobility": document.getElementById('ea_nature').value === 'Tangible' ? document.getElementById('ea_mobility').value : '',
    "Asset Category": document.getElementById('ea_category').value,
    "System": document.getElementById('ea_system').value,
    "Floor/Level": document.getElementById('ea_floor').value.trim(),
    "Room/Zone": document.getElementById('ea_room').value.trim(),
    "Manufacturer": document.getElementById('ea_manufacturer').value.trim(),
    "Model": document.getElementById('ea_model').value.trim(),
    "Install Date": document.getElementById('ea_installdate').value,
    "Warranty Expiry Date": document.getElementById('ea_warranty').value,
    "Status": document.getElementById('ea_status').value,
    "Criticality": document.getElementById('ea_criticality').value,
    "Note": document.getElementById('ea_note').value.trim(),
  };
  const costField = document.getElementById('ea_cost');
  if (costField) {
    changes["Acquisition Cost (TZS)"] = costField.value;
    changes["Expected Lifespan (Years)"] = document.getElementById('ea_lifespan').value;
  }

  try {
    const resp = await fetch('/api/manage-asset', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'edit', recordId, changes }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Failed to save changes');
    closeEditForm();
    await loadAssetsAndInit();
    alert(data.changesApplied ? `Saved ${data.changesApplied} change(s).` : 'No changes detected.');
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  }
}
