async function submitRelocation(recordId) {
  const floor = document.getElementById('rel_floor').value.trim();
  const room = document.getElementById('rel_room').value.trim();
  const reason = document.getElementById('rel_reason').value.trim();
  const errorBox = document.getElementById('relocateError');
  const btn = document.getElementById('rel_submit');

  if (!floor && !room) {
    errorBox.textContent = 'Enter at least a new floor or room/zone.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Relocating…';
  errorBox.style.display = 'none';

  try {
    const resp = await fetch('/api/manage-asset', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recordId, newFloor: floor, newRoom: room, reason }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Failed to relocate');
    document.getElementById('relocateOverlay').remove();
    loadAssetsAndInit();
    alert('Asset relocated successfully.');
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Relocate';
  }
}

async function renderSensorMonitor(isRefresh) {
  const container = document.getElementById('view-sensors');
  if (!isRefresh) {
    container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)">Loading sensor data…</div>';
  }

  try {
    const resp = await fetch('/api/sensors');
    if (resp.status === 401) { window.location.href = '/login'; return; }
    if (!resp.ok) throw new Error('Failed to load sensor data (' + resp.status + ')');
    const data = await resp.json();
    const sensors = data.sensors || [];

    // The test tool panel (dropdown, value input, result box) is built
    // ONLY on first load, never on a refresh - refreshing used to rebuild
    // this whole area, which wiped out the test result message and the
    // dropdown selection a split second after a test ran. Now a refresh
    // only ever touches #sensorListArea below.
    if (!isRefresh) {
      const toolHtml = `<div style="background:var(--navy-pale);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px">
        <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:4px">Sensor Test Tool</div>
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px">Pick a sensor and enter a test reading. If the value falls outside its target range, a real email + SMS fires and a real Work Order opens — the same as a genuine sensor breach. A value within range is just recorded, no alert.</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <select id="sensorTestSelect" onchange="updateSensorTestHint()" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;min-width:220px">
            ${sensors.map(s => `<option value="${s.sensorId}" data-target="${(s.targetRange || 'not set').replace(/"/g, '&quot;')}" data-unit="${s.latestUnit || ''}">${s.sensorType}: ${s.sensorId} (${s.assetName})</option>`).join('')}
          </select>
          <input id="sensorTestValue" type="number" step="0.1" placeholder="Value" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;width:100px">
          <button onclick="runSensorTest()" style="padding:8px 14px;font-size:12px;font-weight:600;border:none;border-radius:8px;background:var(--red);color:#fff;cursor:pointer">Run Test</button>
        </div>
        <div id="sensorTestHint" style="font-size:11px;color:var(--muted);margin-top:6px"></div>
        <div id="sensorTestResult" style="margin-top:10px;font-size:12px;display:none"></div>
      </div>
      <div id="sensorListArea"></div>`;
      container.innerHTML = toolHtml;
      updateSensorTestHint();
    }

    const inRange = sensors.filter(s => s.withinRange === true).length;
    const outRange = sensors.filter(s => s.withinRange === false).length;
    const noData = sensors.filter(s => s.withinRange === null || s.withinRange === undefined).length;

    let listHtml = `<div class="summary-grid">
      <div class="summary-card"><div class="summary-val" style="color:var(--navy)">${sensors.length}</div><div class="summary-label">Total Sensors</div></div>
      <div class="summary-card"><div class="summary-val" style="color:var(--green)">${inRange}</div><div class="summary-label">In Range</div></div>
      <div class="summary-card"><div class="summary-val" style="color:var(--red)">${outRange}</div><div class="summary-label">Out of Range</div></div>
      <div class="summary-card"><div class="summary-val" style="color:var(--muted)">${noData}</div><div class="summary-label">No Data Yet</div></div>
    </div>`;

    if (sensors.length === 0) {
      listHtml += `<div style="text-align:center;padding:40px 20px;color:var(--muted);font-style:italic">No sensors registered yet — once a sensor is added to the Sensors table and starts sending readings, it will appear here automatically.</div>`;
    } else {
      listHtml += `<div class="asset-list">`;
      sensors.forEach(s => {
        const badgeClass = s.withinRange === true ? 'badge-good' : s.withinRange === false ? 'badge-overdue' : 'badge-medium';
        const badgeLabel = s.withinRange === true ? 'In Range' : s.withinRange === false ? 'Out of Range' : 'No Data';
        const valueDisplay = (s.latestValue !== null && s.latestValue !== undefined) ? `${s.latestValue}${s.latestUnit || ''}` : '—';
        listHtml += `<button class="asset-row" onclick="showSensorDetail('${s.recordId}')" style="text-align:left">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="asset-name">${s.assetName}</span><span class="asset-id">${s.sensorId}</span></div>
            <div class="asset-meta">${s.location || '—'} · ${s.sensorType} · Target: ${s.targetRange || 'not set'}</div>
          </div>
          <div style="text-align:right;flex-shrink:0;min-width:100px">
            <div style="font-size:11px;color:var(--muted)">Latest Reading</div>
            <div style="font-size:16px;font-weight:700;color:var(--navy)">${valueDisplay}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
            <span class="badge ${badgeClass}">${badgeLabel}</span>
          </div>
        </button>`;
      });
      listHtml += `</div>`;
      window.lastSensors = sensors;
      listHtml += `<div style="font-size:11px;color:var(--muted);margin-top:12px;text-align:right">Last checked ${new Date().toLocaleTimeString()} · refreshes automatically every 5 minutes</div>`;
    }

    const listArea = document.getElementById('sensorListArea');
    if (listArea) listArea.innerHTML = listHtml;
  } catch (err) {
    if (!isRefresh) {
      container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--red)">Could not load sensor data: ' + err.message + '</div>';
    } else {
      console.error('Sensor refresh failed:', err);
    }
  }

  clearTimeout(window._sensorRefreshTimer);
  window._sensorRefreshTimer = setTimeout(() => {
    const activeTab = document.querySelector('.tab-btn.active');
    if (activeTab && activeTab.dataset.tab === 'sensors') renderSensorMonitor(true);
  }, 5 * 60 * 1000);
}

function showSensorDetail(recordId) {
  const s = (window.lastSensors || []).find(x => x.recordId === recordId);
  if (!s) return;
  const container = document.getElementById('view-sensors');
  const valueDisplay = (s.latestValue !== null && s.latestValue !== undefined) ? `${s.latestValue}${s.latestUnit || ''}` : '—';

  let log = [];

async function saveSensorEdit(recordId) {
  const notes = document.getElementById('sensorEditNotes').value;
  const status = document.getElementById('sensorEditStatus').value;
  try {
    const resp = await fetch('/api/sensors', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recordId, notes, status }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not save');
    await renderSensorMonitor(false);
    showSensorDetail(recordId);
  } catch (err) {
    alert('Could not save: ' + err.message);
  }
}

function updateSensorTestHint() {
  const select = document.getElementById('sensorTestSelect');
  const hint = document.getElementById('sensorTestHint');
  if (!select || !hint) return;
  const opt = select.options[select.selectedIndex];
  const target = opt ? opt.dataset.target : '';
  const unit = opt ? opt.dataset.unit : '';
  hint.textContent = `Target range: ${target}${unit ? ' ' + unit : ''}`;
}

async function runSensorTest() {
  const select = document.getElementById('sensorTestSelect');
  const valueInput = document.getElementById('sensorTestValue');
  const resultBox = document.getElementById('sensorTestResult');
  const sensorId = select.value;
  const value = valueInput.value;

  if (!sensorId) { alert('No sensors available to test.'); return; }
  if (value === '') { alert('Enter a test value first.'); return; }

  resultBox.style.display = 'block';
  resultBox.style.color = 'var(--muted)';
  resultBox.textContent = `Testing ${sensorId} with value ${value}…`;

  try {
    const resp = await fetch('/api/sensors', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sensorId, value }),
    });
    if (resp.status === 401) { window.location.href = '/login'; return; }
    const data = await resp.json();

    if (resp.ok && data.success && data.triggered) {
      resultBox.style.color = 'var(--red)';
      resultBox.innerHTML = `⚠ ALERT TRIGGERED — ${data.sensorType} reading ${data.value}${data.unit} for ${data.assetName} (target: ${data.targetRange}) · Email: ${data.email} · SMS: ${data.sms} · Alert Log: ${data.alertLogWritten === true ? 'written' : data.alertLogWritten} · Work Order: ${data.workOrder}`;
      renderSensorMonitor(true);
    } else if (resp.ok && data.success) {
      resultBox.style.color = 'var(--green)';
      resultBox.textContent = `✓ Reading recorded (${data.value}${data.unit}, target: ${data.targetRange}) — ${data.reason}`;
      renderSensorMonitor(true);
    } else {
      resultBox.style.color = 'var(--red)';
      resultBox.textContent = '✗ ' + (data.error || 'Test failed');
    }
  } catch (err) {
    resultBox.style.color = 'var(--red)';
    resultBox.textContent = '✗ Network error: ' + err.message;
  }
}

function renderMaintenance() {
  let html = `<div class="dash-grid">`;

  // Upcoming schedule timeline — live from real assets' Next Service Due
  html += `<div class="dash-panel"><div class="dash-panel-title">Upcoming Maintenance Schedule (Next 30 Days)</div><div class="timeline" style="position:static">`;
  const urgencyColor = (a) => {
    const d = daysUntil(a.nextService);
    if (d < 0) return 'var(--red)';
    if (d <= 3) return 'var(--amber)';
    return 'var(--green)';
  };
  const schedule = assets
    .filter(a => {
      const d = daysUntil(a.nextService);
      return a.nextService && d <= 30;
    })
    .sort((a, b) => new Date(a.nextService) - new Date(b.nextService))
    .slice(0, 10);

  if (schedule.length === 0) {
    html += `<div style="font-size:13px;color:var(--muted);padding:12px 0">Nothing scheduled in the next 30 days.</div>`;
  } else {
    schedule.forEach(a => {
      const d = daysUntil(a.nextService);
      const dateLabel = new Date(a.nextService).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
      const status = d < 0 ? `${Math.abs(d)}d overdue` : d === 0 ? 'Due today' : `in ${d}d`;
      const loc = displayRoom(a.room) || displayFloor(a.floor) || '—';
      html += `<div style="display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)"><div style="width:8px;height:8px;border-radius:50%;background:${urgencyColor(a)};margin-top:6px;flex-shrink:0"></div><div><div style="font-size:12.5px;font-weight:600">${a.name} <span style="font-weight:400;color:var(--muted)">— ${dateLabel} (${status})</span></div><div style="font-size:11.5px;color:var(--muted);margin-top:2px">${loc} · ${a.system || '—'} · ${a.id}</div></div></div>`;
    });
  }
  html += `</div></div>`;

  // Maintenance Frequency by System — the real average service interval
  // per system, computed from each asset's actual Maintenance Interval
  // (Days), not the old fabricated "Quarterly/Annual" labels.
  html += `<div class="dash-panel"><div class="dash-panel-title">Maintenance Frequency by System</div>`;
  const sysIntervals = {};
  assets.forEach(a => {
    if (!a.system) return;
    (sysIntervals[a.system] = sysIntervals[a.system] || []).push(a.maintenanceIntervalDays || 90);
  });
  const freqLabel = (days) => {
    if (days <= 10) return `~${Math.round(days)}d (Weekly)`;
    if (days <= 35) return `~${Math.round(days)}d (Monthly)`;
    if (days <= 100) return `~${Math.round(days)}d (Quarterly)`;
    if (days <= 200) return `~${Math.round(days)}d (Semi-Annual)`;
    return `~${Math.round(days)}d (Annual)`;
  };
  const sysColors2 = ['var(--red)','#F97316','var(--navy)','var(--amber)','var(--blue)','var(--teal)','var(--purple)','var(--pink)','#9CA3AF','var(--gold)'];
  const maxInterval = Math.max(1, ...Object.values(sysIntervals).map(arr => arr.reduce((a,b)=>a+b,0)/arr.length));
  Object.keys(sysIntervals).sort((a,b) => sysIntervals[a].length - sysIntervals[b].length).forEach((sysName, i) => {
    const arr = sysIntervals[sysName];
    const avgDays = arr.reduce((a,b)=>a+b,0) / arr.length;
    // Shorter interval = more frequent = visually more "urgent", so
    // the bar fills inversely to the interval length.
    const pct = 100 - ((avgDays / maxInterval) * 80);
    html += `<div class="freq-row"><div class="freq-label">${sysName}</div><div class="freq-track"><div class="freq-fill" style="width:${pct}%;background:${sysColors2[i % sysColors2.length]}">${freqLabel(avgDays)}</div></div></div>`;
  });
  html += `</div>`;

  html += `</div>`;

  // Work Order Flow — conceptual, not yet functional
  html += `<div class="dash-panel" style="margin-top:14px"><div class="dash-panel-title">Work Order Communication Flow — Live</div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.6">This is how an alert actually moves from detection to resolution — this is the real, live behavior of the system, not a proposal.</div>
    <div class="wo-flow">
      <div class="wo-flow-step"><div class="wo-flow-num">1</div><div class="wo-flow-body"><div class="wo-flow-title">Maintenance due within 7 days (or overdue)</div><div class="wo-flow-desc">System detects the due date, sends the first real alert, and opens a Work Order automatically.</div><span class="wo-flow-channel chan-sms">SMS</span><span class="wo-flow-channel chan-email">Email</span></div></div>
      <div class="wo-flow-step"><div class="wo-flow-num">2</div><div class="wo-flow-body"><div class="wo-flow-title">Reminder every 5 days while still open</div><div class="wo-flow-desc">If the Work Order hasn't been marked Completed, a reminder repeats every 5 days — referencing the same open Work Order, not creating a new one each time.</div><span class="wo-flow-channel chan-sms">SMS</span><span class="wo-flow-channel chan-email">Email</span></div></div>
      <div class="wo-flow-step"><div class="wo-flow-num">3</div><div class="wo-flow-body"><div class="wo-flow-title">Staff can also report an issue directly</div><div class="wo-flow-desc">Anyone can report a breakdown from the public homepage (no login) — this opens a Work Order the same way, tagged REPORTED, with the reporter's name attached.</div><span class="wo-flow-channel chan-system">No Login Needed</span></div></div>
      <div class="wo-flow-step"><div class="wo-flow-num">4</div><div class="wo-flow-body"><div class="wo-flow-title">Technician updates status in the dashboard</div><div class="wo-flow-desc">Open → In Progress → Completed, updated directly from the Work Orders tab.</div><span class="wo-flow-channel chan-system">System Update</span></div></div>
      <div class="wo-flow-step"><div class="wo-flow-num">5</div><div class="wo-flow-body"><div class="wo-flow-title">Marking Completed stops the reminders</div><div class="wo-flow-desc">Once Status is Completed, no further reminders fire for that issue, and a real Certificate of Maintenance becomes available to generate.</div><span class="wo-flow-channel chan-system">Automatic</span></div></div>
    </div>
  </div>`;

  document.getElementById('view-maintenance').innerHTML = html;
}

let unitChatPendingFile = null;

function onUnitChatFileSelected() {
  const fileInput = document.getElementById('unitDetailChatFile');
  const file = fileInput.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert("File is larger than 5MB."); fileInput.value = ''; return; }
  unitChatPendingFile = file;
  const preview = document.getElementById('unitChatAttachPreview');
  preview.textContent = `📎 ${file.name} — ready to send`;
  preview.style.display = 'block';
}

async function submitUnitDetailChat(unitId) {
  const input = document.getElementById('unitDetailChatInput');
  const message = input.value.trim();
  if (!message && !unitChatPendingFile) return;
  try {
    const body = { sendUnitChatMessage: true, unitId, message };
    if (unitChatPendingFile) {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(unitChatPendingFile);
      });
      body.attachmentBase64 = base64;
      body.attachmentFilename = unitChatPendingFile.name;
      body.attachmentContentType = unitChatPendingFile.type || 'application/octet-stream';
    }
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not send message');
    unitChatPendingFile = null;
    showUnitDetail(unitId);
  } catch (err) {
    alert('Could not send: ' + err.message);
  }
}

function copyUnitPortalLink(unitId) {
  const link = `${window.location.origin}/unit-portal?unit=${unitId}`;
  navigator.clipboard.writeText(link).then(() => {
    alert('Portal link copied — send this directly to the tenant. No login needed on their end.');
  }).catch(() => {
    prompt('Copy this link:', link);
  });
}

async function renderUnits() {
  const container = document.getElementById('view-units');
  if (!container) return;
  container.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--muted)">Loading units…</div>`;

  try {
    const resp = await fetch('/api/get-assets?units=true');
    const data = await resp.json();
    lastUnits = data.units || [];
    const units = filterByBuilding(lastUnits);

    let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-size:18px;font-weight:700;color:var(--navy)">Tenant Units</div>
        <div style="font-size:12px;color:var(--muted)">Click a unit to open its own page — chat, activity, contract, and assets all live there together.</div>
      </div>
      <button onclick="openAddUnitModal()" style="padding:8px 16px;font-size:12.5px;font-weight:600;border:none;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer">+ Add Unit</button>
    </div>`;

    // Rent Roll — portfolio-wide balance across every unit, confirmed
    // to live as a section here on Tenant Units rather than the
    // overall dashboard/reports. Sorted by who owes the most, so the
    // people actually behind surface first rather than needing to be
    // found by scanning every unit individually.
    const unitsOwing = lastUnits.filter(u => (u.balance || 0) > 0).sort((a, b) => b.balance - a.balance);
    const totalOwed = unitsOwing.reduce((sum, u) => sum + u.balance, 0);
    if (unitsOwing.length > 0) {
      html += `<div class="dash-panel" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
          <div class="dash-panel-title" style="margin-bottom:0">Rent Roll — ${unitsOwing.length} unit${unitsOwing.length === 1 ? '' : 's'} owing, ${formatCurrency(totalOwed)} total</div>
          ${currencySwitcherHtml('rentroll')}
        </div>
        <div style="margin-top:10px">` + unitsOwing.map(u => `
          <button onclick="showUnitDetail('${u.id}')" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;font:inherit">
            <span style="font-size:12.5px;color:var(--text)">${u.name}${u.tenantName ? ' — ' + escapeHtml(u.tenantName) : ''}</span>
            <strong style="font-size:12.5px;color:var(--red)">${formatCurrency(u.balance)}</strong>
          </button>`).join('') + `
        </div>
      </div>`;
    }

    if (units.length === 0) {
      html += `<div style="text-align:center;padding:40px 20px;color:var(--muted);font-style:italic">No units yet${currentBuildingFilter !== '__all__' || currentFacilityFilter !== '__all__' ? ' in this selection' : ''}.</div>`;
      container.innerHTML = html;
      return;
    }

    const leaseColors = { Occupied: ['#DCFCE7','#166534'], Vacant: ['#F3F4F6','#6B7280'], 'Notice Given': ['#FEF3C7','#92400E'] };

    html += `<div class="asset-list">` + units.map(u => {
      const unitAssetCount = assets.filter(a => a.unit === u.name).length;
      const lc = leaseColors[u.leaseStatus] || ['#F3F4F6','#6B7280'];
      return `<button class="asset-row" onclick="showUnitDetail('${u.id}')" style="text-align:left">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span class="asset-name">${u.name}</span>
            <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:#E0E7FF;color:#3730A3">${u.unitType || 'Unspecified'}</span>
            <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:${lc[0]};color:${lc[1]}">${u.leaseStatus || 'Unspecified'}</span>
            ${u.chatLog && u.chatLog.length ? `<span class="wo-row-unread-dot" title="Has chat activity">${u.chatLog.length > 9 ? '9+' : u.chatLog.length}</span>` : ''}
          </div>
          <div class="asset-meta">${u.building}${u.tenantName ? ' · ' + u.tenantName : ''} · ${unitAssetCount} asset${unitAssetCount !== 1 ? 's' : ''}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>`;
    }).join('') + `</div>`;

    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--red)">Could not load units: ${err.message}</div>`;
  }
}

      <div id="mua_list" style="max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-bottom:14px">

      </div>

async function submitManageUnitAssets(unitId, unitName) {
  const btn = document.getElementById('mua_submit');
  const errorBox = document.getElementById('mua_error');
  errorBox.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Saving…';

  // Only touch assets whose checked-state actually needs to change —
  // no need to re-write ones already correctly assigned or already
  // correctly unassigned.
  const checkboxes = [...document.querySelectorAll('.mua-check')];
  const toAssign = checkboxes.filter(c => c.checked).map(c => c.value);
  const toClear = checkboxes.filter(c => !c.checked).map(c => c.value)
    .filter(recordId => { const a = assets.find(x => x.recordId === recordId); return a && a.unit === unitName; });

  try {
    for (const recordId of toAssign) {
      const a = assets.find(x => x.recordId === recordId);
      if (a && a.unit === unitName) continue; // already correct, skip
      const assetLabel = a ? `${a.id} — ${a.name}` : recordId;
      const resp = await fetch('/api/work-orders', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ assignAssetToUnit: true, assetRecordId: recordId, unitName, unitId, assetLabel }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.success) throw new Error(data.error || 'Could not update an asset');
      if (a) a.unit = unitName;
    }
    for (const recordId of toClear) {
      const a0 = assets.find(x => x.recordId === recordId);
      const assetLabel = a0 ? `${a0.id} — ${a0.name}` : recordId;
      const resp = await fetch('/api/work-orders', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ assignAssetToUnit: true, assetRecordId: recordId, unitName: '', unitId, assetLabel }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.success) throw new Error(data.error || 'Could not update an asset');
      const a = assets.find(x => x.recordId === recordId);
      if (a) a.unit = '';
    }
    document.getElementById('manageUnitAssetsOverlay')?.remove();
    renderUnits();
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Save';
  }
}

let unitFinancialsLoaded = {};
async function toggleUnitFinancialsHistory(unitId) {
  const el = document.getElementById('unitFinancialsHistory-' + unitId);
  if (!el) return;
  const isOpen = el.style.display !== 'none';
  if (isOpen) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  if (unitFinancialsLoaded[unitId]) return; // already fetched once, no need to refetch on every toggle
  el.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:8px 0">Loading…</div>`;
  try {
    const resp = await fetch(`/api/get-assets?unitFinancials=true&unitId=${unitId}`);
    const data = await resp.json();
    renderUnitFinancialsHistory(unitId, data.invoices || [], data.payments || []);
    unitFinancialsLoaded[unitId] = true;
  } catch (err) {
    el.innerHTML = `<div style="font-size:12px;color:var(--red)">Could not load history: ${err.message}</div>`;
  }
}

function renderUnitFinancialsHistory(unitId, invoices, payments) {
  const el = document.getElementById('unitFinancialsHistory-' + unitId);
  if (!el) return;
  let html = `<div style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px">`;

  html += `<div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px">Invoices</div>`;
  if (invoices.length === 0) {
    html += `<div style="font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:12px">No invoices generated yet.</div>`;
  } else {
    html += `<div style="margin-bottom:12px">` + invoices.map(inv => {
      const statusColor = inv.status === 'Paid' ? 'var(--green)' : inv.isOverdue ? 'var(--red)' : 'var(--amber)';
      const label = inv.isOverdue && inv.status !== 'Paid' ? 'Overdue' : inv.status;
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:11.5px">
        <span>${inv.periodStart} → ${inv.periodEnd} <span style="color:var(--muted)">(due ${inv.dueDate})</span></span>
        <span style="display:flex;align-items:center;gap:8px"><strong>${formatCurrency(inv.amount)}</strong><span style="font-weight:700;color:${statusColor}">${label}</span></span>
      </div>`;
    }).join('') + `</div>`;
  }

  html += `<div style="font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px">Payments</div>`;
  if (payments.length === 0) {
    html += `<div style="font-size:11.5px;color:var(--muted);font-style:italic">No payments recorded yet.</div>`;
  } else {

async function submitAddUnit() {
  const unitName = document.getElementById('au_name').value.trim();
  const building = document.getElementById('au_building').value;
  const unitType = document.getElementById('au_type').value;
  const tenantName = document.getElementById('au_tenant').value.trim();
  const tenantEmail = document.getElementById('au_email').value.trim();
  const tenantPhone = document.getElementById('au_phone').value.trim();
  const leaseStatus = document.getElementById('au_lease').value;
  const file = document.getElementById('au_contract').files[0];
  const errorBox = document.getElementById('au_error');
  const btn = document.getElementById('au_submit');
  errorBox.style.display = 'none';
  if (!unitName) { errorBox.textContent = 'Unit name is required.'; errorBox.style.display = 'block'; return; }
  if (file && file.size > 5 * 1024 * 1024) { errorBox.textContent = "File is larger than 5MB."; errorBox.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ addUnit: true, unitName, building, unitType, tenantName, tenantEmail, tenantPhone, leaseStatus }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not add unit');

    if (file) {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      await fetch('/api/work-orders', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uploadUnitContract: true, unitId: data.unit.id, filename: file.name, contentType: file.type || 'application/pdf', fileBase64: base64 }),
      });
    }

    document.getElementById('addUnitOverlay')?.remove();
    renderUnits();
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Add Unit';
  }
}

async function submitAssignUnit(assetRecordId, unitName, unitId) {
  try {
    const asset = assets.find(a => a.recordId === assetRecordId);
    const assetLabel = asset ? `${asset.id} — ${asset.name}` : assetRecordId;
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ assignAssetToUnit: true, assetRecordId, unitName, unitId, assetLabel }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not assign unit');
    if (asset) asset.unit = unitName;
    document.getElementById('assignUnitOverlay')?.remove();
    const idx = assets.findIndex(a => a.recordId === assetRecordId);
    if (idx >= 0) showDetail(idx);
  } catch (err) {
    alert('Could not assign unit: ' + err.message);
  }
}

async function renderPlannedMaintenance() {
  const container = document.getElementById('view-plannedmaintenance');
  container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)">Loading…</div>';

  try {
    const resp = await fetch('/api/get-assets?plannedmaintenance=true');
    if (!resp.ok) throw new Error('Failed to load (' + resp.status + ')');
    const data = await resp.json();
    lastPlans = data.plans || [];

    let html = `<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button onclick="openCreatePlanForm()" style="padding:8px 16px;font-size:12.5px;font-weight:600;border:none;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer">+ New Plan</button></div>`;

    if (lastPlans.length === 0) {
      html += `<div style="text-align:center;padding:40px 20px;color:var(--muted);font-style:italic">No planned maintenance projects yet — these are created manually for larger, budgeted initiatives, separate from day-to-day work orders.</div>`;
    } else {
      html += `<div class="asset-list">`;
      lastPlans.forEach(p => {
        const statusColors = { Planning: ['#F3F4F6','#374151'], 'In Progress': ['#DBEAFE','#1E40AF'], Completed: ['#DCFCE7','#166534'], 'On Hold': ['#FEE2E2','#991B1B'] };
        const sc = statusColors[p.status] || statusColors.Planning;
        const totalBudget = p.budgetItems.reduce((s,i) => s + (Number(i.plannedCost)||0), 0);
        html += `<button class="asset-row" onclick="showPlanDetail('${p.recordId}')" style="text-align:left">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="asset-name">${p.title}</span><span class="asset-id">${p.planId}</span>
              <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:${sc[0]};color:${sc[1]}">${p.status}</span>
            </div>
            <div class="asset-meta">${p.targetStartDate || '—'} to ${p.targetEndDate || '—'} · Budget: ${formatCurrency(totalBudget)} · ${p.milestones.length} milestone${p.milestones.length!==1?'s':''}</div>

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>`;
      });
      html += `</div>`;
    }
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--red)">Could not load: ' + err.message + '</div>';
  }
}

async function submitCreatePlan() {
  const title = document.getElementById('cp_title').value.trim();
  const errorBox = document.getElementById('cpError');
  if (!title) { errorBox.textContent = 'Title is required.'; errorBox.style.display = 'block'; return; }

  try {
    const resp = await fetch('/api/manage-asset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        entityType: 'plannedMaintenance',
        title,
        description: document.getElementById('cp_description').value.trim(),
        targetStartDate: document.getElementById('cp_start').value,
        targetEndDate: document.getElementById('cp_end').value,
        budgetItems: [],
      }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not create plan');
    document.getElementById('createPlanOverlay').remove();
    renderPlannedMaintenance();
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
  }
}

// Per-asset maintenance cost summary — one work-orders fetch per call,
// reused by both the Asset Register list (for the ratio badge/sort)
// and each asset's own detail page (for the full by-type breakdown).
// Deliberately NOT cached across the session — costs get entered from
// several places (cost edits, procurement fulfillment, spare-part
// orders), and a stale snapshot showing outdated numbers is worse than
// one extra fetch each time this tab is opened. assetCostSummaryCache
// still exists as a variable so getMaintenanceCostRatio() (used
// per-row during sort/badge rendering) can read whatever was loaded
// most recently without needing to be async itself.
// Confirmed rules: every status counts as long as a cost is entered
// (not just Completed), but a Rejected procurement request is excluded
// since that money was never actually spent.
//
// Costs with no Asset ID split into two honest buckets rather than
// being silently dropped from every total: unattributedCostCache is
// money confirmed NOT tied to a registered asset (a chair, a fixture
// — deliberately confirmed, not just unknown); pendingIdCostCache is
// money still awaiting someone to actually attach the real asset.
// Keeping these separate is the whole point — "we don't know yet" and
// "we checked, there's nothing to track" must never look the same in
// a cost summary.
let assetCostSummaryCache = null;
let assetCostSummaryLoading = null;
let unattributedCostCache = 0;
let pendingIdCostCache = 0;
async function loadAssetCostSummaries() {
  if (assetCostSummaryLoading) return assetCostSummaryLoading;
  assetCostSummaryLoading = (async () => {
    try {
      const resp = await fetch('/api/work-orders');
      if (!resp.ok) return assetCostSummaryCache || {};
      const data = await resp.json();
      const orders = data.workOrders || [];
      const map = {};
      let unattributed = 0, pendingId = 0;
      const TYPES = ['Preventive', 'Corrective', 'Inspection', 'Procurement'];
      orders.forEach(o => {
        const cost = Number(o.cost) || 0;
        if (!cost || o.procurementStatus === 'Rejected') return;
        if (!o.assetId) {
          if (o.nonAssetConfirmed) unattributed += cost;
          else pendingId += cost;
          return;
        }
        if (!map[o.assetId]) map[o.assetId] = { Preventive: 0, Corrective: 0, Inspection: 0, Procurement: 0, Other: 0, total: 0 };
        const type = TYPES.includes(o.maintenanceType) ? o.maintenanceType : 'Other';
        map[o.assetId][type] += cost;
        map[o.assetId].total += cost;
      });
      assetCostSummaryCache = map;
      unattributedCostCache = unattributed;
      pendingIdCostCache = pendingId;
      return map;
    } catch (err) {
      console.error('loadAssetCostSummaries error:', err);
      return assetCostSummaryCache || {};
    } finally {
      assetCostSummaryLoading = null;
    }
  })();
  return assetCostSummaryLoading;
}

async function uploadPlanDocument(recordId, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert('File larger than 5MB.'); return; }
  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const resp = await fetch('/api/manage-asset', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'uploadPlanDocument', recordId, filename: file.name, contentType: file.type, fileBase64: base64 }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Upload failed');
    refreshPlanView(recordId);
  } catch (err) {
    alert('Could not upload: ' + err.message);
  }
}

let floorPlanCurrentFloor = null;
let floorPlanData = null; // { floor, imageUrl, positions }
let floorPlanPlacementMode = false;
let floorPlanSelectedAssetId = null;

function statusDotColor(status) {
  if (status === "Good") return "#16a34a";
  if (status === "Poor") return "#d97706";
  return "#dc2626"; // Critical
}

async function renderFloorPlan() {
  const container = document.getElementById('view-floorplan');
  const canManage = currentUserPermissions && currentUserPermissions.addOrDecommissionAssets;

  const uniqueFloors = [...new Set(assets.map(a => a.floor).filter(Boolean))]
    .sort((a, b) => displayFloor(a).localeCompare(displayFloor(b), undefined, { numeric: true }));

  if (!floorPlanCurrentFloor && uniqueFloors.length > 0) floorPlanCurrentFloor = uniqueFloors[0];

  let html = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <select class="filter-select" onchange="floorPlanCurrentFloor=this.value;floorPlanPlacementMode=false;floorPlanSelectedAssetId=null;renderFloorPlan()">
      ${uniqueFloors.map(f => `<option value="${f}"${f===floorPlanCurrentFloor?' selected':''}>${displayFloor(f)}</option>`).join('')}
    </select>
    <div style="display:flex;gap:12px;font-size:12px;color:var(--muted);margin-left:auto">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#16a34a;margin-right:4px"></span>Good</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#d97706;margin-right:4px"></span>Poor</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc2626;margin-right:4px"></span>Critical</span>
    </div>
    ${canManage ? `<button class="filter-btn${floorPlanPlacementMode?' active':''}" onclick="toggleFloorPlanPlacementMode()">${floorPlanPlacementMode ? '✕ Exit Placement Mode' : '📍 Place Markers'}</button>` : ''}
    ${canManage ? `<button class="filter-btn" onclick="toggleFloorPlanUploadPanel()">⬆ Upload Drawing</button>` : ''}
  </div>
  <div id="floorPlanUploadPanel" style="display:none;background:#F0F4FA;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px">
    <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:10px">Upload a floor plan drawing</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <select id="fp_uploadFloor" class="filter-select">
        ${uniqueFloors.map(f => `<option value="${f}"${f===floorPlanCurrentFloor?' selected':''}>${displayFloor(f)}</option>`).join('')}
      </select>
      <input type="file" id="fp_uploadFile" accept="image/*,.svg" style="font-size:12px">
      <button id="fp_uploadBtn" onclick="submitFloorPlanUpload()" style="padding:7px 16px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:600;font-size:12px;cursor:pointer">Upload</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">Max 5MB. This replaces the conceptual placeholder for the selected floor — your name and today's date are recorded automatically.</div>
    <div id="fp_uploadError" style="display:none;color:var(--red);font-size:12px;margin-top:8px"></div>
  </div>
  <div id="floorPlanImageWrap" style="position:relative;text-align:center;color:var(--muted);padding:40px">Loading floor plan…</div>
  <div style="padding:20px 24px;background:#fff;border:1px solid var(--border);border-radius:10px;margin-top:16px">
    <div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:10px">Activity</div>
    <div id="floorPlanActivityLog" style="font-size:12px;color:var(--muted)">Loading…</div>
  </div>`;

  container.innerHTML = html;

  if (!floorPlanCurrentFloor) {
    document.getElementById('floorPlanImageWrap').innerHTML = `<div style="padding:60px 20px">No floors found on any asset yet.</div>`;
    return;
  }

  try {
    const resp = await fetch('/api/get-assets?floorplan=' + encodeURIComponent(floorPlanCurrentFloor));
    const data = await resp.json();

    const activityEl = document.getElementById('floorPlanActivityLog');
    if (activityEl) {
      let log = [];
      try { log = JSON.parse(data.activityLog || '[]'); } catch { log = []; }
      if (log.length === 0) {
        activityEl.innerHTML = '<div style="font-size:12px;color:var(--muted)">No activity yet for this floor.</div>';
      } else {
        activityEl.innerHTML = log.slice().reverse().map(entry => `
          <div style="padding:10px 12px;background:#F7F8FA;border-radius:8px;margin-bottom:8px">
            <div style="font-size:13px;color:var(--text)">${entry.text}</div>
            <div style="font-size:10.5px;color:var(--muted);margin-top:4px">${entry.by} · ${new Date(entry.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        `).join('');
      }
    }

    // Fall back to the built-in conceptual defaults if Airtable has no image
    // or positions yet for this floor — Airtable always wins once populated.
    if (!data.imageUrl && DEFAULT_FLOOR_PLAN_IMAGES[floorPlanCurrentFloor]) {
      data.imageUrl = DEFAULT_FLOOR_PLAN_IMAGES[floorPlanCurrentFloor];
      data.isDefaultImage = true;
    }
    // IMPORTANT: only use the pre-computed random positions when we're ALSO
    // showing the default conceptual image. Those positions were scattered
    // for that specific placeholder drawing — once a real floor plan is
    // uploaded, they'd be meaningless on it (dots floating over random
    // spots with no relation to the real layout). So on a real uploaded
    // drawing with no saved positions yet, assets correctly show as
    // "unplaced" instead, prompting you to place them for real via
    // Place Markers mode.
    if (data.isDefaultImage && (!data.positions || data.positions.length === 0)) {
      const defaults = DEFAULT_ASSET_POSITIONS.filter(p => p.floor === floorPlanCurrentFloor);
      if (defaults.length > 0) {
        data.positions = defaults;
        data.isDefaultPositions = true;
      }
    }

    floorPlanData = data;
    renderFloorPlanImage(canManage);
  } catch (err) {
    document.getElementById('floorPlanImageWrap').innerHTML = `<div style="padding:60px 20px;color:var(--red)">Could not load floor plan: ${err.message}</div>`;
  }
}

function renderFloorPlanImage(canManage) {
  const wrap = document.getElementById('floorPlanImageWrap');
  if (!floorPlanData || !floorPlanData.imageUrl) {
    wrap.innerHTML = `<div style="padding:60px 20px;max-width:480px;margin:0 auto">
      <div style="font-size:14px;font-weight:600;color:var(--navy);margin-bottom:8px">No floor plan image uploaded for ${displayFloor(floorPlanCurrentFloor)} yet</div>
      <div style="font-size:13px;color:var(--muted)">Upload an image for this floor in Airtable's Floor Plans table (Floor = "${floorPlanCurrentFloor}"), then refresh this tab.</div>
    </div>`;
    return;
  }

  const floorAssets = assets.filter(a => a.floor === floorPlanCurrentFloor);
  const positionsByAsset = {};
  (floorPlanData.positions || []).forEach(p => { positionsByAsset[p.assetId] = p; });

  const unplaced = canManage ? floorAssets.filter(a => !positionsByAsset[a.id]) : [];

  let dotsHtml = '';
  floorAssets.forEach(a => {
    const pos = positionsByAsset[a.id];
    if (!pos) return;
    const idx = assets.indexOf(a);
    const clickHandler = floorPlanPlacementMode ? '' : `showDetail(${idx});switchTab('assets')`;
    dotsHtml += `<div class="floorplan-dot-group" onclick="${clickHandler}" title="${a.name} (${a.id}) — ${a.status}"
      style="position:absolute;left:${pos.x}%;top:${pos.y}%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:${floorPlanPlacementMode?'default':'pointer'};z-index:2">
      <div class="floorplan-dot" style="width:16px;height:16px;border-radius:50%;background:${statusDotColor(a.status)};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>
      <div style="font-size:9px;font-weight:700;color:#1A1A1A;background:rgba(255,255,255,0.85);padding:1px 4px;border-radius:3px;margin-top:2px;white-space:nowrap;line-height:1.3;box-shadow:0 1px 2px rgba(0,0,0,.15)">${a.id} ${a.name}</div>
    </div>`;
  });

  wrap.innerHTML = `
    ${floorPlanData.isDefaultImage ? `<div style="display:inline-block;background:#FEF3C7;color:#92400E;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;margin-bottom:10px">⚠ Conceptual layout — not a real scan. Upload a real drawing above when ready.</div><br>` : ''}
    ${!floorPlanData.isDefaultImage && floorPlanData.uploadedBy ? `<div style="display:inline-block;background:#DCFCE7;color:#166534;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;margin-bottom:10px">✓ Uploaded by ${floorPlanData.uploadedBy}${floorPlanData.uploadDate ? ' on ' + new Date(floorPlanData.uploadDate).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : ''}</div><br>` : ''}
    ${!floorPlanData.isDefaultImage && (!floorPlanData.positions || floorPlanData.positions.length === 0) ? `<div style="display:inline-block;background:#DBEAFE;color:#1E40AF;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;margin-bottom:10px">This real drawing has no assets placed on it yet — use "📍 Place Markers" above to position them.</div><br>` : ''}
    <div style="position:relative;display:inline-block;max-width:100%">
      <img src="${floorPlanData.imageUrl}" style="max-width:100%;display:block;border-radius:8px;border:1px solid var(--border)" id="floorPlanImg" onclick="handleFloorPlanClick(event)">
      ${dotsHtml}
    </div>
  `;

  if (canManage && floorPlanPlacementMode) {
    let sidebar = `<div style="margin-top:16px;text-align:left;max-width:480px;margin-left:auto;margin-right:auto">
      <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px">Unplaced assets on this floor — select one, then click the image where it belongs:</div>`;
    if (unplaced.length === 0) {
      sidebar += `<div style="font-size:12px;color:var(--muted)">All assets on this floor have a marker placed.</div>`;
    } else {
      unplaced.forEach(a => {
        const selected = floorPlanSelectedAssetId === a.id;
        sidebar += `<button onclick="floorPlanSelectedAssetId='${a.id}';renderFloorPlanImage(true)" style="display:block;width:100%;text-align:left;padding:8px 12px;margin-bottom:4px;border-radius:6px;border:1px solid ${selected?'var(--navy)':'var(--border)'};background:${selected?'#F0F4FA':'#fff'};font-size:12px;cursor:pointer">${a.name} <span style="color:var(--muted)">(${a.id})</span></button>`;
      });
    }
    sidebar += `</div>`;
    wrap.insertAdjacentHTML('beforeend', sidebar);
  }
}

async function markTechnicalReviewDone(recordId, idx) {
  if (!confirm('Confirm this asset\'s classification has been checked and is correct?')) return;
  try {
    const resp = await fetch('/api/manage-asset', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'clearTechnicalReview', recordId }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Could not clear review flag');
    await loadAssetsAndInit();
    const newIdx = assets.findIndex(a => a.recordId === recordId);
    if (newIdx >= 0) showDetail(newIdx);
  } catch (err) {
    alert('Could not mark reviewed: ' + err.message);
  }
}

async function scheduleInspection(assetId, assetName) {
  if (!confirm(`Schedule an inspection for ${assetName} (${assetId})? This creates a new Inspection work order, separate from regular maintenance.`)) return;
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ assetId }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Failed to schedule inspection');
    alert(`Inspection scheduled — ${data.woId}. Find it in Work Orders.`);
  } catch (err) {
    alert('Could not schedule inspection: ' + err.message);
  }
}

// Ordering a spare part directly from an asset — no breakdown, no
// reported issue needed. Creates a lightweight work order (tagged
// Maintenance Type "Procurement" so it's clearly not repair work),
// then opens the exact same procurement-request modal a real breakdown
// uses — same approve/fulfill pipeline, no separate workflow.
async function orderSparePart(assetId, assetName) {
  if (!confirm(`Order a spare part for ${assetName} (${assetId})? This creates a Procurement work order, separate from a breakdown or scheduled maintenance.`)) return;
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ assetId, orderSparePart: true }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Failed to create spare part order');
    openProcurementRequestModal(data.recordId, assetName);
  } catch (err) {
    alert('Could not order spare part: ' + err.message);
  }
}

      .standard-box { background:#F0F4FA; border-left: 3px solid #1A3566; padding:10px 14px; font-size:12.5px; margin-bottom: 24px; }
      .freq-section { margin-bottom: 20px; }

async function loadCostOverview() {
  const panel = document.getElementById('costOverviewContent');
  if (!panel) return;
  try {
    const resp = await fetch('/api/work-orders?report=true');
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Could not load cost overview');

    const byType = (data.summary && data.summary.costByMaintenanceType) || {};
    const total = (data.summary && data.summary.totalCostRecorded) || 0;
    const types = Object.keys(byType);

    if (types.length === 0) {
      panel.innerHTML = `<div>No costs recorded yet — costs get added when Engineer+ closes a work order, or via "Edit Cost" on a completed one. Once a few are in, this fills in automatically.</div>`;
      return;
    }

    const colors = { Preventive: '#1E40AF', Corrective: '#991B1B', Inspection: '#5B21B6', Unspecified: '#6B7280' };
    const maxVal = Math.max(...types.map(t => byType[t]));

    let html = `<div style="font-size:20px;font-weight:700;color:var(--navy);margin-bottom:12px">${formatCurrency(total)} <span style="font-size:12px;font-weight:400;color:var(--muted)">total recorded</span></div>`;
    types.sort((a,b) => byType[b]-byType[a]).forEach(type => {
      const pct = maxVal > 0 ? (byType[type]/maxVal)*100 : 0;
      html += `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="font-weight:600;color:${colors[type]||'#6B7280'}">${type}</span>
          <span style="color:var(--muted)">${formatCurrency(byType[type])}</span>
        </div>
        <div style="background:#F0F2F6;border-radius:6px;height:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${colors[type]||'#6B7280'};border-radius:6px"></div>
        </div>
      </div>`;
    });

    const preventive = byType['Preventive'] || 0;
    const corrective = byType['Corrective'] || 0;
    if (preventive > 0 && corrective > 0) {
      const ratio = (corrective / preventive).toFixed(1);
      html += `<div style="font-size:11px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">Reactive (Corrective) spend is ${ratio}× scheduled (Preventive) spend — the gap a preventive program is meant to close.</div>`;
    }

    // By Asset — which specific Asset IDs actually made up that total.
    // Reuses the exact same cost-summary function and rules already
    // built for the Asset Register (every status counts, rejected
    // procurement excluded), so this always agrees with what each
    // asset's own page shows — no separate logic to drift out of sync.
    const costSummaries = await loadAssetCostSummaries();
    const assetRows = Object.entries(costSummaries)
      .map(([assetId, s]) => {
        const asset = assets.find(a => a.id === assetId);
        return { assetId, name: asset ? asset.name : '(asset not found in register)', total: s.total };
      })
      .filter(r => r.total > 0)
      .sort((a, b) => b.total - a.total);

    if (assetRows.length > 0) {
      const shown = assetRows.slice(0, 10);
      html += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px">By Asset</div>
        ${shown.map(r => `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px">
          <span><span style="font-weight:600;color:var(--text)">${r.assetId}</span> <span style="color:var(--muted)">— ${r.name}</span></span>
          <span style="color:var(--navy);font-weight:600">${formatCurrency(r.total)}</span>
        </div>`).join('')}
        ${assetRows.length > 10 ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">+${assetRows.length - 10} more — see Asset Register, sorted by Maintenance Cost Ratio, for the full list.</div>` : ''}
      </div>`;
    }

    // Costs with no Asset ID never just vanish from this total — they
    // split into two honest, distinct lines instead of one vague one.
    // "Pending" still needs someone to actually attach the real asset;
    // "Confirmed non-asset" has already been deliberately resolved.
    if (pendingIdCostCache > 0 || unattributedCostCache > 0) {
      html += `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
        ${pendingIdCostCache > 0 ? `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px">
          <span style="color:#92400E;font-weight:600">⚠ Pending Asset Identification</span>
          <span style="color:#92400E;font-weight:600">${formatCurrency(pendingIdCostCache)}</span>
        </div>` : ''}
        ${unattributedCostCache > 0 ? `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px">
          <span style="color:var(--muted)">Unattributed / Non-Asset Costs</span>
          <span style="color:var(--muted);font-weight:600">${formatCurrency(unattributedCostCache)}</span>
        </div>` : ''}
      </div>`;
    }

    panel.innerHTML = html;
  } catch (err) {
    panel.innerHTML = `<div style="color:var(--red)">${err.message}</div>`;
  }
}

async function submitDocumentUpload(recordId, inputEl) {
  const file = inputEl.files[0];
  const statusEl = document.getElementById('docUploadStatus_' + recordId);
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    statusEl.style.color = 'var(--red)';
    statusEl.textContent = 'File is larger than 5MB — Airtable\'s direct upload limit. Try a smaller file.';
    return;
  }

  statusEl.style.color = 'var(--muted)';
  statusEl.textContent = 'Uploading…';

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const resp = await fetch('/api/manage-asset', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'uploadDocument',
        recordId,
        filename: file.name,
        contentType: file.type || 'application/octet-stream',
        fileBase64: base64,
      }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Upload failed');

    statusEl.style.color = 'var(--green)';
    statusEl.textContent = `✓ Uploaded ${file.name}`;
    inputEl.value = '';
    await loadAssetsAndInit();
    const idx = assets.findIndex(a => a.recordId === recordId);
    if (idx >= 0) showDetail(idx);
  } catch (err) {
    statusEl.style.color = 'var(--red)';
    statusEl.textContent = 'Could not upload: ' + err.message;
  }
}

function renderWOActivityThread(log) {
  const thread = document.getElementById('wo_activity_thread');
  if (!thread) return;
  if (log.length === 0) {
    thread.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:12px 0">No activity yet — the first update starts the record.</div>`;
    return;
  }
  thread.innerHTML = log.map(entry => `
    <div style="padding:10px 12px;background:#F7F8FA;border-radius:8px;margin-bottom:8px">
      <div style="font-size:13px;color:var(--text)">${entry.text}</div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:4px">${entry.by} · ${new Date(entry.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    </div>
  `).join('');
  thread.scrollTop = thread.scrollHeight;
}

async function submitWOActivity(recordId) {
  const input = document.getElementById('wo_activity_input');
  const text = input.value.trim();
  if (!text) return;
  input.disabled = true;

  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ addActivityEntry: true, recordId, text }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not save update');

    const wo = lastWorkOrders.find(o => o.id === recordId);
    if (wo) wo.activityLog = JSON.stringify(data.log);

    input.value = '';
    renderWOActivityThread(data.log);
  } catch (err) {
    alert('Could not send update: ' + err.message);
  } finally {
    input.disabled = false;
  }
}

// Re-fetches work order data and, if currently viewing a specific

  try {

}

  const CORE = ['electrical_engineer', 'mechanical_engineer', 'admin', 'property_manager', 'business_owner', 'system_admin'];

function openReassignModal(recordId) {
  const o = lastWorkOrders.find(w => w.id === recordId) || dashboardWorkOrders.find(w => w.id === recordId);
  if (!o) return;
  const roles = ['Mechanical', 'Electrical', 'Admin', 'Property Manager'];
  openPlanModal('Reassign This Work Order', `
    <label style="font-size:11px;font-weight:600;color:var(--navy);display:block;margin-bottom:4px">Route to *</label>
    <select id="ra_role" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:12px">
      ${roles.map(r => `<option value="${r}" ${o.assignedRole === r ? 'selected' : ''}>${r}</option>`).join('')}
    </select>
    <div style="font-size:11px;color:var(--muted)">Need an outside vendor instead? That's a procurement request from within the work order, not a reassignment — the four core roles can request it directly.</div>
  `, async () => {
    const assignedRole = document.getElementById('ra_role').value;
    try {
      const resp = await fetch('/api/work-orders', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reassignWorkOrder: true, recordId, assignedRole }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.success) throw new Error(data.error || 'Could not reassign');
      Object.assign(o, { assignedRole: data.assignedRole });
      const dashCopy = dashboardWorkOrders.find(w => w.id === recordId);
      if (dashCopy) Object.assign(dashCopy, { assignedRole: data.assignedRole });
      closePlanModal();
      showWorkOrderDetail(recordId);
    } catch (err) {
      alert('Could not reassign: ' + err.message);
    }
  });
}

// Admin only, confirmed by nature: this is a business policy
// decision, not routine entry. Fetches the real current targets
// first rather than assuming defaults, since they may already have
// been edited by someone else.
async function openSLASettingsModal() {
  const overlay = document.createElement('div');
  overlay.id = 'slaSettingsOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;padding:24px;width:460px;max-width:90vw;max-height:85vh;overflow-y:auto">
      <div style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px">SLA Targets</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:16px">Response = how quickly staff acts after a request comes in. Resolution = how quickly it's actually finished. Both measured automatically from real work order activity — nothing to log separately.</div>
      <div id="slaSettingsBody"><div style="font-size:12px;color:var(--muted)">Loading…</div></div>
      <div id="sla_error" style="display:none;color:var(--red);font-size:12px;margin:10px 0"></div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button onclick="document.getElementById('slaSettingsOverlay').remove()" style="flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--navy);font-weight:600;font-size:13px;cursor:pointer">Cancel</button>
        <button id="sla_submit" onclick="submitSLATargets()" style="flex:1;padding:9px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:600;font-size:13px;cursor:pointer">Save Targets</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  try {
    const resp = await fetch('/api/get-assets?slaTargets=true');
    const data = await resp.json();
    const targets = data.targets || [];
    const order = ['OVERDUE', 'URGENT', 'UPCOMING'];
    const sorted = order.map(u => targets.find(t => t.urgency === u)).filter(Boolean);
    document.getElementById('slaSettingsBody').innerHTML = sorted.map(t => `
      <div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)">
        <div style="font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:8px">${t.urgency}</div>
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Response (hours)</label>
            <input id="sla_${t.urgency}_response" type="number" min="0" step="any" value="${t.responseHours}" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px">
          </div>
          <div style="flex:1">
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">Resolution (hours)</label>
            <input id="sla_${t.urgency}_resolution" type="number" min="0" step="any" value="${t.resolutionHours}" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px">
          </div>
        </div>
      </div>`).join('');
  } catch (err) {
    document.getElementById('slaSettingsBody').innerHTML = `<div style="font-size:12px;color:var(--red)">Could not load current targets: ${err.message}</div>`;
  }
}

async function submitSLATargets() {
  const errorBox = document.getElementById('sla_error');
  const btn = document.getElementById('sla_submit');
  errorBox.style.display = 'none';

  const targets = [];
  for (const urgency of ['OVERDUE', 'URGENT', 'UPCOMING']) {
    const responseEl = document.getElementById(`sla_${urgency}_response`);
    const resolutionEl = document.getElementById(`sla_${urgency}_resolution`);
    if (!responseEl || !resolutionEl) continue; // not loaded successfully, skip rather than send incomplete data
    const responseHours = Number(responseEl.value);
    const resolutionHours = Number(resolutionEl.value);
    if (!responseEl.value || !resolutionEl.value || responseHours < 0 || resolutionHours < 0) {
      errorBox.textContent = `${urgency} needs a valid response and resolution time.`;
      errorBox.style.display = 'block';
      return;
    }
    targets.push({ urgency, responseHours, resolutionHours });
  }
  if (targets.length === 0) {
    errorBox.textContent = 'Targets did not load correctly — close this and try again.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ updateSLATargets: true, targets }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not save targets');
    document.getElementById('slaSettingsOverlay')?.remove();
    renderWorkOrders();
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Save Targets';
  }
}

async function loadVendorList() {
  const area = document.getElementById('vendorListArea');
  if (!area) return;
  try {
    const resp = await fetch('/api/work-orders?vendors=true');
    const data = await resp.json();
    vendorListCache = data.vendors || [];
    renderVendorList();
  } catch (err) {
    area.innerHTML = `<div style="font-size:12px;color:var(--red)">Could not load vendors: ${err.message}</div>`;
  }
}

// Fast, free, instant — runs on every keystroke, matching name and
// supplies text directly. This is the default; Smart Search below is
// the deliberate extra step for when this comes up empty.
function renderVendorList(highlightIds) {
  const area = document.getElementById('vendorListArea');
  if (!area) return;
  const q = (document.getElementById('vn_search')?.value || '').toLowerCase().trim();

  let vendors = vendorListCache;
  if (q) {
    vendors = vendorListCache.filter(v =>
      v.name.toLowerCase().includes(q) || (v.supplies || '').toLowerCase().includes(q)
    );
  }
  if (highlightIds && highlightIds.length) {
    const idSet = new Set(highlightIds);
    vendors = vendorListCache.filter(v => idSet.has(v.id))
      .sort((a, b) => highlightIds.indexOf(a.id) - highlightIds.indexOf(b.id));
  }

  if (vendorListCache.length === 0) {
    area.innerHTML = `<div style="font-size:12px;color:var(--muted);font-style:italic">No vendors added yet.</div>`;
    return;
  }
  if (vendors.length === 0) {
    area.innerHTML = `<div style="font-size:12px;color:var(--muted);font-style:italic">No matches — try Smart Search for a broader match.</div>`;
    return;
  }
  area.innerHTML = vendors.map(v => `
    <div style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;font-weight:600;color:var(--text)">${escapeHtml(v.name)}</div>
      <div style="font-size:11px;color:var(--muted)">${[v.email, v.phone].filter(Boolean).map(escapeHtml).join(' · ') || 'No contact on file'}</div>
      ${v.supplies ? `<div style="font-size:11.5px;color:var(--text);margin-top:3px">${escapeHtml(v.supplies)}</div>` : ''}
      ${v.categories && v.categories.length ? `<div style="margin-top:4px">${v.categories.map(c => `<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:#E0E7FF;color:#3730A3;margin-right:4px">${escapeHtml(c)}</span>`).join('')}</div>` : ''}
    </div>`).join('');
}

// Explicit, deliberate step — never runs automatically. Sends the
// query plus the whole active vendor list to Claude in one call, asks
// which vendors could plausibly match even with completely different
// wording ("aircon guy" finding "climate control servicing").
async function runAIVendorSearch() {
  const q = document.getElementById('vn_search')?.value.trim();
  const statusEl = document.getElementById('vn_aiStatus');
  if (!q) { alert('Type something to search for first.'); return; }
  statusEl.style.display = 'block';
  statusEl.textContent = 'Searching…';
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ searchVendorsAI: true, searchQuery: q }),
    });
    const data = await resp.json();
    const matchingIds = data.matchingIds || [];
    if (matchingIds.length === 0) {
      statusEl.textContent = 'No smart matches found either.';
      renderVendorList();
    } else {
      statusEl.textContent = `${matchingIds.length} smart match${matchingIds.length === 1 ? '' : 'es'} found.`;
      renderVendorList(matchingIds);
    }
  } catch (err) {
    statusEl.textContent = 'Smart search failed — try the regular search above instead.';
  }
}

async function submitAddVendor() {
  const name = document.getElementById('vn_name').value.trim();
  const email = document.getElementById('vn_email').value.trim();
  const phone = document.getElementById('vn_phone').value.trim();
  const supplies = document.getElementById('vn_supplies').value.trim();
  const resultEl = document.getElementById('vn_addResult');
  const btn = document.getElementById('vn_addBtn');
  if (!name) { alert('Vendor name is required.'); return; }

  resultEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ addVendor: true, name, email, phone, supplies }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not add vendor');
    document.getElementById('vn_name').value = '';
    document.getElementById('vn_email').value = '';
    document.getElementById('vn_phone').value = '';
    document.getElementById('vn_supplies').value = '';

    if (data.vendor && data.vendor.suggestedCategory) {
      resultEl.textContent = `Added — tagged "${data.vendor.suggestedCategory}" automatically based on what you described. You can remove this tag later if it's not right.`;
      resultEl.style.display = 'block';
    }

    await loadVendorList();
  } catch (err) {
    alert('Could not add vendor: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Add Vendor';
  }
}

function renderAssetLinkResults() {
  const q = (document.getElementById('al_search')?.value || '').toLowerCase().trim();
  const sys = document.getElementById('al_system')?.value || 'All';
  const container = document.getElementById('al_results');
  if (!container) return;

  // Token-based matching, not one exact phrase — a reporter's free-text
  // floor/room ("Ground Floor Reception") won't reliably appear as a
  // single contiguous substring of an asset's own fields, especially
  // once coded floor labels (GF, F3) get involved. Every word in the
  // search has to appear SOMEWHERE in the asset's combined text, in any
  // order — much more forgiving, and correctly matches regardless of
  // which order floor/room happen to appear in either string.
  const words = q.split(/\s+/).filter(Boolean);
  const matches = assets.filter(a => {
    if (sys !== 'All' && a.system !== sys) return false;
    if (words.length === 0) return true;
    const hay = (a.id+" "+a.name+" "+displayFloor(a.floor)+" "+displayRoom(a.room)+" "+a.manufacturer+" "+a.model).toLowerCase();
    return words.every(w => hay.includes(w));
  }).slice(0, 30);

  if (matches.length === 0) {
    container.innerHTML = `<div style="padding:16px;font-size:12.5px;color:var(--muted);text-align:center">No matching assets — try a different search, or confirm this isn't a registered asset below.</div>`;
    return;
  }

  container.innerHTML = matches.map(a => `
    <button onclick="submitAttachAssetId('${window._alRecordId}', '${a.id}')" style="display:block;width:100%;text-align:left;padding:10px 12px;border:none;border-bottom:1px solid var(--border);background:#fff;cursor:pointer">
      <div style="font-size:13px;font-weight:600;color:var(--text)">${a.name} <span style="color:var(--muted);font-weight:400">— ${a.id}</span></div>
      <div style="font-size:11px;color:var(--muted)">${displayFloor(a.floor) || '—'} · ${displayRoom(a.room) || '—'} · ${a.system || '—'}</div>
    </button>
  `).join('');
}

async function submitAttachAssetId(recordId, assetId) {
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ attachAssetId: true, recordId, assetId }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not attach asset');
    const o = lastWorkOrders.find(w => w.id === recordId);
    if (o) Object.assign(o, { assetId: data.assetId, assetName: data.assetName, system: data.system, nonAssetConfirmed: false });
    const dashCopy = dashboardWorkOrders.find(w => w.id === recordId);
    if (dashCopy) Object.assign(dashCopy, { assetId: data.assetId, assetName: data.assetName, system: data.system, nonAssetConfirmed: false });
    closeAssetLinkModal();
    renderWODetailAssetLink(o || { id: recordId, assetId: data.assetId, assetName: data.assetName });
  } catch (err) {
    alert('Could not attach asset: ' + err.message);
  }
}
