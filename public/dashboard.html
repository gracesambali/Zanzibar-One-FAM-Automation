async function submitAddBuilding(facilityId, facilityName) {
  const buildingName = document.getElementById('ab_name').value.trim();
  const errorBox = document.getElementById('ab_error');
  const btn = document.getElementById('ab_submit');
  errorBox.style.display = 'none';
  if (!buildingName) { errorBox.textContent = 'Enter a building name.'; errorBox.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ addBuilding: true, facilityId, buildingName }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not add building');

    await refreshFacilitiesData();
    document.getElementById('addBuildingOverlay')?.remove();

    // Refresh the Building dropdown for the currently-selected facility
    // and select the new one directly, same convenience as the
    // facility flow above.
    const facilitySel = document.getElementById('na_facility');
    if (facilitySel && facilitySel.value === facilityName) {
      onAddAssetFacilityChange();
      const buildingSel = document.getElementById('na_building');
      if (buildingSel) { buildingSel.value = buildingName; onCategoryChange(); }
    }
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Add Building';
  }
}

// --- Classification hierarchy — exact match to page 10 of the guideline, each branch ends with "Others" ---
const ASSET_HIERARCHY = {
  Tangible: {
    Movable: ["Furniture", "Equipment", "Computer Hardware", "Plant & Machinery", "Transport Assets", "Biological Assets", "Valuable Documents", "Library Books", "Others"],
    Immovable: ["Land", "Buildings", "Infrastructure", "Heritage", "Minerals & Other Resources", "Others"],
  },
  Intangible: ["Computer Software", "Trademarks", "Licenses", "Patent Rights", "Right to Use", "Others"],
};
const CATEGORY_PREFIXES = {
  "Furniture": "FURN", "Equipment": "EQP", "Computer Hardware": "PC", "Plant & Machinery": "PLT",
  "Transport Assets": "VEH", "Biological Assets": "BIO", "Valuable Documents": "DOC", "Library Books": "LIB",
  "Land": "LND", "Buildings": "BLD", "Infrastructure": "INF", "Heritage": "HER", "Minerals & Other Resources": "MIN",
  "Computer Software": "SW", "Trademarks": "TM", "Licenses": "LIC", "Patent Rights": "PAT", "Right to Use": "RTU",
};

// Applies a live suggestion as the Name is typed — pre-fills System and
// Criticality, shown as a visible hint so it's clear this is a
// suggestion to confirm, not a silent auto-decision. Never overwrites a
// value the person has already picked differently themselves.
let userTouchedSystem = false, userTouchedCriticality = false;
function applyAssetSuggestion(name) {
  const guess = guessAssetDefaults(name);
  const hint = document.getElementById('na_suggestion_hint');
  if (!guess) { hint.style.display = 'none'; return; }

  if (!userTouchedSystem) document.getElementById('na_system').value = guess.system;
  if (!userTouchedCriticality) document.getElementById('na_criticality').value = guess.criticality;
  const lifespanField = document.getElementById('na_lifespan');
  if (lifespanField && lifespanField.value === '15') lifespanField.value = guess.lifespan; // only if still at default

  hint.textContent = `Suggested: ${guess.system} · ${guess.criticality} criticality — check and adjust if needed`;
  hint.style.display = 'block';
}

function onNatureChange() {
  const nature = document.getElementById('na_nature').value;
  document.getElementById('na_mobilityWrap').style.display = nature === 'Tangible' ? 'block' : 'none';
  onMobilityChange();
}
function onMobilityChange() {
  const nature = document.getElementById('na_nature').value;
  const mobility = document.getElementById('na_mobility').value;
  const categorySelect = document.getElementById('na_category');
  const categories = nature === 'Intangible' ? ASSET_HIERARCHY.Intangible : ASSET_HIERARCHY.Tangible[mobility];
  categorySelect.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
  onCategoryChange();
}
function onCategoryChange() {
  const category = document.getElementById('na_category').value;
  const othersWrap = document.getElementById('na_othersWrap');
  othersWrap.style.display = category === 'Others' ? 'block' : 'none';
  const prefix = CATEGORY_PREFIXES[category] || 'AST';
  const facilityName = document.getElementById('na_facility')?.value;
  const buildingSel = document.getElementById('na_building');
  const facility = facilitiesData.find(f => f.name === facilityName);
  const facilityCode = facility && facility.code ? facility.code + '-' : '';
  const buildingCode = facility && buildingSel && buildingSel.value && facility.buildingCodes
    ? (facility.buildingCodes[buildingSel.value] ? facility.buildingCodes[buildingSel.value] + '-' : '')
    : '';
  document.getElementById('na_prefixHint').textContent = category === 'Others' ? '' : `ID will be auto-generated as ${facilityCode}${buildingCode}${prefix}-0XX`;
}

function closeAddAssetForm() {
  const overlay = document.getElementById('addAssetOverlay');
  if (overlay) overlay.remove();
}

async function submitNewAsset() {
  const name = document.getElementById('na_name').value.trim();
  const nature = document.getElementById('na_nature').value;
  const mobility = nature === 'Tangible' ? document.getElementById('na_mobility').value : '';
  let category = document.getElementById('na_category').value;
  const errorBox = document.getElementById('addAssetError');
  const btn = document.getElementById('na_submit');

  let customPrefix = null;
  if (category === 'Others') {
    const othersText = document.getElementById('na_othersText').value.trim();
    if (!othersText) {
      errorBox.textContent = 'Please specify the category for "Others".';
      errorBox.style.display = 'block';
      return;
    }
    category = othersText;
    customPrefix = othersText.substring(0,4).toUpperCase().replace(/[^A-Z]/g,'') || 'AST';
  }

  const buildingVal = document.getElementById('na_building').value;
  if (!name || !category || !buildingVal) {
    errorBox.textContent = 'Name, Category, and Building are required.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Adding…';
  errorBox.style.display = 'none';

  const costField = document.getElementById('na_cost');
  const lifespanField = document.getElementById('na_lifespan');

  try {
    const nameplateFile = document.getElementById('na_nameplate').files[0];
    let nameplateBase64 = null;
    if (nameplateFile) {
      nameplateBase64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(nameplateFile);
      });
    }

    const resp = await fetch('/api/manage-asset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name, nature, mobility, category, customPrefix,
        building: document.getElementById('na_building').value,
        facility: document.getElementById('na_facility').value,
        system: document.getElementById('na_system').value,
        floor: document.getElementById('na_floor').value,
        room: document.getElementById('na_room').value.trim(),
        manufacturer: document.getElementById('na_manufacturer').value.trim(),
        model: document.getElementById('na_model').value.trim(),
        status: document.getElementById('na_status').value,
        criticality: document.getElementById('na_criticality').value,
        acquisitionCost: costField ? costField.value : undefined,
        lifespan: lifespanField ? lifespanField.value : undefined,
        nameplatePhotoBase64: nameplateBase64,
        nameplatePhotoFilename: nameplateFile ? nameplateFile.name : undefined,
        nameplatePhotoContentType: nameplateFile ? nameplateFile.type : undefined,
      }),
    });
    const data = await resp.json();

    if (!resp.ok) throw new Error(data.error || 'Failed to add asset');

    closeAddAssetForm();
    loadAssetsAndInit(); // refresh live data so the new asset appears immediately
    alert(`Asset added — ID auto-generated as ${data.assetId}`);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Add Asset';
  }
}

async function decommissionAsset(recordId, assetName) {
  const reason = prompt(`Decommissioning "${assetName}". Optional reason (e.g. "replaced before end of lifecycle"):`);
  if (reason === null) return; // cancelled

  try {
    const resp = await fetch('/api/manage-asset', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recordId, reason }),
    });
    if (!resp.ok) throw new Error('Failed to decommission asset');
    alert('Asset decommissioned. Its history stays intact, but it no longer appears in the active register.');
    renderAssets();
    loadAssetsAndInit();
  } catch (err) {
    alert('Error: ' + err.message);
  }
}

async function loadAssetsAndInit() {
  const loadingEl = document.getElementById('loading-screen');
  try {
    const [assetsResp, woResp, facResp, ratesResp] = await Promise.all([
      fetch('/api/get-assets'),
      fetch('/api/work-orders'),
      fetch('/api/get-assets?facilities=true'),
      fetch('/api/get-assets?exchangeRates=true'),
    ]);
    if (assetsResp.status === 401) {
      window.location.href = '/login';
      return;
    }
    if (!assetsResp.ok) throw new Error('Failed to load asset data (' + assetsResp.status + ')');
    const data = await assetsResp.json();
    assets = data.assets || [];
    currentUserRole = data.role || "technician";
    currentUserPermissions = ROLE_PERMISSIONS[currentUserRole] || ROLE_PERMISSIONS.technician;
    currentUsername = data.username || "";
    populateLoggedInUserBadge(data.username, currentUserRole, data.photoUrl, data.displayName);

    // Full Facility -> Building structure for the switcher — fetched
    // once here, not derived from what's actually tagged on data, so
    // every facility shows up as selectable even before it has any
    // real assets or work orders in it yet.
    if (facResp.ok) {
      const facData = await facResp.json();
      facilitiesData = facData.facilities || [];
    }

    // Live exchange rates for the currency switcher — non-fatal if this
    // fails, since TZS (the actual stored currency) always still works
    // regardless of whether the conversion service is reachable.
    if (ratesResp.ok) {
      const ratesData = await ratesResp.json();
      exchangeRates = ratesData.rates || {};
    }

    // Work orders — non-fatal if this fails (dashboard still renders, just with empty WO data)
    if (woResp.ok) {
      const woData = await woResp.json();
      dashboardWorkOrders = woData.workOrders || [];
    } else {
      dashboardWorkOrders = [];
    }
    updateWOUnreadBadges();
    startWorkOrderChatPolling();

    if (loadingEl) loadingEl.style.display = 'none';
    document.querySelector('.content').style.display = 'block';
    applySimplifiedNavIfNeeded();
    if (currentUserPermissions && currentUserPermissions.simplifiedNav) {
      switchTab('workorders');
    } else {
      renderDashboard();
    }
  } catch (err) {
    if (loadingEl) {
      loadingEl.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--red,#E74C3C)">' +
        '<div style="font-size:15px;font-weight:600;margin-bottom:8px">Could not load live data</div>' +
        '<div style="font-size:13px;color:var(--muted,#6B7280)">' + err.message + '</div></div>';
    }
    console.error(err);
  }
}

// Near-live unread updates without websockets: just re-fetch the same
// work-orders endpoint the rest of the app already uses, on a timer.
// Guarded so loadAssetsAndInit() being called again later (e.g. after
// adding an asset) never stacks up a second interval.
//
// This is deliberately quiet: badges update silently every poll (cheap,
// invisible), but the visible list/detail is only touched at all when
// the data has genuinely changed (compared via lastWOSignature) — most
// polls find nothing new and don't touch the DOM whatsoever. When
// something HAS changed, it updates in place using the data already in
// hand (no re-fetch, no "Loading…" flash) and restores scroll position
// afterward, rather than the previous behavior of unconditionally
// rebuilding the whole view from scratch every 45 seconds.
let woChatPollingStarted = false;
function startWorkOrderChatPolling() {
  if (woChatPollingStarted) return;
  woChatPollingStarted = true;
  setInterval(async () => {
    try {
      const resp = await fetch('/api/work-orders');
      if (!resp.ok) return;
      const data = await resp.json();
      const orders = data.workOrders || [];
      const signature = JSON.stringify(orders);

      dashboardWorkOrders = orders;
      updateWOUnreadBadges(); // silent and cheap — fine to always run

      if (signature === lastWOSignature) return; // nothing changed — leave the screen exactly as it is
      lastWOSignature = signature;
      lastWorkOrders = orders;

      const activeTab = document.querySelector('.tab-btn.active');
      if (!activeTab || activeTab.dataset.tab !== 'workorders') return;

      const scrollY = window.scrollY;

      if (currentWODetailId) {
        // Someone's inside a specific work order — refresh it in place
        // (this also picks up new chat messages) rather than yanking
        // them back to the list.
        const chatDraft = document.getElementById('woDetailChatInput');
        const activityDraft = document.getElementById('woDetailActivityInput');
        const isTyping = (chatDraft && chatDraft.value.trim()) || (activityDraft && activityDraft.value.trim());
        if (!isTyping && lastWorkOrders.find(w => w.id === currentWODetailId)) {
          showWorkOrderDetail(currentWODetailId);
          window.scrollTo(0, scrollY);
        }
      } else {
        // Update the list directly from data already in hand — no
        // second fetch, no loading spinner replacing what's on screen.
        const container = document.getElementById('view-workorders');
        if (container) {
          container.innerHTML = await buildWorkOrdersHtml(orders);
          window.scrollTo(0, scrollY);
        }
      }
    } catch (err) {
      console.error('Work order chat poll error:', err);
    }
  }, 45000);
}

async function logout() {
  await fetch('/api/login', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'logout'}) });
  window.location.href = '/login';
}

// Sidebar collapse state persists across sessions (real app, not a
// claude.ai artifact — localStorage is the right tool here).
function showSidebarTooltip(btnEl, label) {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar.classList.contains('collapsed')) return; // labels already visible when expanded
  const tooltip = document.getElementById('sidebarTooltip');
  const rect = btnEl.getBoundingClientRect();
  tooltip.textContent = label;
  tooltip.style.left = (rect.right + 10) + 'px';
  tooltip.style.top = (rect.top + rect.height/2) + 'px';
  tooltip.style.transform = 'translateY(-50%)';
  tooltip.classList.add('visible');
}
function hideSidebarTooltip() {
  document.getElementById('sidebarTooltip').classList.remove('visible');
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const collapsed = sidebar.classList.toggle('collapsed');
  localStorage.setItem('fam_sidebar_collapsed', collapsed ? '1' : '0');
}
function restoreSidebarState() {
  const sidebar = document.getElementById('sidebar');
  const saved = localStorage.getItem('fam_sidebar_collapsed');

  if (saved !== null) {
    // A real, explicit choice was already made — respect it exactly,
    // regardless of screen size. Manual preference always wins.
    if (saved === '1') sidebar.classList.add('collapsed');
  } else {
    // No preference yet (first-ever visit) — default to collapsed on
    // narrow screens so a phone doesn't start with half its width eaten
    // by the sidebar. Nothing is hidden or removed, just starts compact;
    // one tap still reaches everything.
    if (window.innerWidth <= 700) sidebar.classList.add('collapsed');
  }
}
restoreSidebarState();

loadAssetsAndInit();

</script>
