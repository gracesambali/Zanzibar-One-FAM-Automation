// The stored Procurement Status value stays "Fulfilled" in Airtable —
// no schema change, no migration of existing records. Only what's
// actually shown to people changes, to "Payment Processed", which is
// what procurement staff are really doing at that step.
function procStatusLabel(status) {
  if (status === 'Requested') return 'Procurement in Progress';
  if (status === 'Fulfilled') return 'Procurement Complete';
  return status;
}

function renderWODetailProcurement(o) {
  const el = document.getElementById('woDetailProcurement');
  if (!el) return;
  const procStatus = o.procurementStatus || 'None';
  const canFulfill = currentUserPermissions && currentUserPermissions.fulfillProcurement;
  const isOverseer = currentUserRole === 'business_owner' || currentUserRole === 'system_admin';
  const routedLoginRole = ASSIGNED_ROLE_TO_LOGIN_ROLE[o.assignedRole];
  const canConfirmDelivery = isOverseer || (!!routedLoginRole && currentUserRole === routedLoginRole);

  let spec = null;
  try {
    const breakdown = JSON.parse(o.costBreakdown || '[]');
    spec = breakdown[0] || null;
  } catch { spec = null; }

  let html = `<div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:10px">Procurement</div>`;

  if (procStatus === 'None') {
    html += `<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Not requested for this work order.</div>
      ${o.status !== 'Completed' ? `<button onclick="openProcurementRequestModal('${o.id}', '${o.assetName.replace(/'/g,"\\'")}')" style="padding:8px 14px;font-size:12.5px;font-weight:600;border:1px solid #B45309;border-radius:8px;background:#fff;color:#B45309;cursor:pointer">🛒 Request Procurement</button>` : ''}`;
  } else if (procStatus === 'Rejected') {
    // Rejected is a real, reachable state again — Procurement can
    // reject a request either before any quotes exist (unclear,
    // duplicated) or after real quotes come back unreasonable, a
    // judgment only possible once pricing actually exists. The
    // requester needs a real way back from here, not a dead end.
    html += `<span style="font-size:11px;font-weight:700;padding:4px 12px;border-radius:14px;background:#FEE2E2;color:#991B1B">Rejected</span>
      <div style="margin-top:10px;background:#FEF2F2;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#991B1B">${escapeHtml(o.procurementRejectionReason || 'No reason given')}</div>
      ${o.status !== 'Completed' ? `<button onclick="openProcurementRequestModal('${o.id}', '${o.assetName.replace(/'/g,"\\'")}')" style="margin-top:10px;padding:8px 14px;font-size:12.5px;font-weight:600;border:1px solid #B45309;border-radius:8px;background:#fff;color:#B45309;cursor:pointer">🛒 Revise and Resubmit</button>` : ''}`;
  } else {
    // Approved kept in the color map purely for safe display of any
    // historical record from before this flow changed — that state
    // can never be reached again going forward. Rejected, unlike
    // Approved, IS reachable again (see the branch above) — a real,
    // working action, not just legacy display.
    const procColors = { Requested: ['#FEF3C7','#92400E'], Approved: ['#DBEAFE','#1E40AF'], Rejected: ['#FEE2E2','#991B1B'], Fulfilled: ['#DCFCE7','#166534'], Delivered: ['#DCFCE7','#166534'] };
    html += `<span style="font-size:11px;font-weight:700;padding:4px 12px;border-radius:14px;background:${procColors[procStatus][0]};color:${procColors[procStatus][1]}">${procStatusLabel(procStatus)}</span>`;

    if (spec) {
      html += `<div style="margin-top:10px;background:#F7F8FA;border-radius:8px;padding:10px 12px;font-size:12.5px">
        <div style="font-weight:600;color:var(--text)">${spec.description}</div>
        <div style="color:var(--muted);margin-top:2px">Quantity: ${spec.quantity}${spec.unit ? ' ' + spec.unit : ''}</div>
      </div>`;
    }

    if (o.cost) {
      html += `<div style="margin-top:8px;font-size:13px;font-weight:700;color:var(--navy)">${formatCurrency(o.cost)}</div>`;
    }

    if (procStatus === 'Requested' && canFulfill) {
      html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button onclick="openFulfillProcurementModal('${o.id}')" style="padding:8px 14px;font-size:12.5px;font-weight:600;border:none;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer">📦 Mark Procurement Complete</button>
        <button onclick="openDelayNoticeModal('${o.id}')" style="padding:8px 14px;font-size:12.5px;font-weight:600;border:1px solid #B45309;border-radius:8px;background:#fff;color:#B45309;cursor:pointer">⏳ Send Delay Notice</button>
        <button onclick="openRejectProcurementModal('${o.id}')" style="padding:8px 14px;font-size:12.5px;font-weight:600;border:1px solid var(--red);border-radius:8px;background:#fff;color:var(--red);cursor:pointer">🚫 Reject Request</button>
      </div>`;
    } else if (procStatus === 'Requested') {
      html += `<div style="margin-top:10px;font-size:12px;color:var(--muted);font-style:italic">Waiting on Procurement to source and fulfill</div>`;
    }

    if (procStatus === 'Fulfilled' && canConfirmDelivery) {
      html += `<button onclick="openConfirmDeliveryModal('${o.id}')" style="margin-top:10px;padding:8px 14px;font-size:12.5px;font-weight:600;border:1px solid var(--green);border-radius:8px;background:#fff;color:var(--green);cursor:pointer">📬 Confirm Delivery</button>`;
    } else if (procStatus === 'Fulfilled') {
      html += `<div style="margin-top:10px;font-size:12px;color:var(--muted);font-style:italic">Paid — waiting on the routed role to confirm delivery</div>`;
    }

    if (procStatus === 'Delivered') {
      html += `<div style="margin-top:10px;font-size:12px;color:var(--green)">📬 Delivery confirmed${o.procurementApprovedBy ? ' by ' + o.procurementApprovedBy : ''}</div>`;
      if (o.deliveryConfirmationNote) {
        html += `<div style="margin-top:6px;font-size:12px;color:var(--muted);background:#F7F8FA;border-radius:8px;padding:8px 10px">"${escapeHtml(o.deliveryConfirmationNote)}"</div>`;
      }
      if (o.deliveryNoteUrl) {
        html += `<div style="margin-top:6px">${previewDownloadButtonsHtml('delivery-note-' + o.id, o.deliveryNoteUrl, o.deliveryNoteFilename || 'delivery-note.pdf')}</div>`;
      }
    }
  }
  el.innerHTML = html;
}

// Vendor Quotes — the actual "compare and choose the lowest bidder"
// view. Shown whenever a procurement request exists at all (not just
// while still Requested), so the comparison stays visible as a record
// even after one's been chosen and fulfilled. Sorted cheapest first by
// the backend, matching the "same specs, lowest bidder" logic from the
// original workflow.
async function renderWODetailProcurementResponses(o) {
  const el = document.getElementById('woDetailProcurementResponses');
  if (!el) return;
  const procStatus = o.procurementStatus || 'None';
  if (procStatus === 'None') { el.innerHTML = ''; return; }

  const canManage = currentUserRole === 'procurement' || currentUserRole === 'business_owner' || currentUserRole === 'system_admin';
  const stillOpen = procStatus === 'Requested';

  let html = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div style="font-size:12px;font-weight:700;color:var(--navy)">Vendor Quotes</div>
    ${canManage && stillOpen ? `<button onclick="openAddProcurementResponseModal('${o.id}', '${o.woId}')" style="padding:6px 12px;font-size:11.5px;font-weight:600;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer">+ Add Vendor Quote</button>` : ''}
  </div>
  <div id="procurementResponsesList" style="font-size:12px;color:var(--muted)">Loading…</div>`;
  el.innerHTML = html;

  try {
    const resp = await fetch('/api/work-orders?procurementResponses=' + encodeURIComponent(o.woId));
    const data = await resp.json();
    const responses = data.responses || [];
    const listEl = document.getElementById('procurementResponsesList');
    if (!listEl) return;

    if (responses.length === 0) {
      listEl.innerHTML = `<div style="font-style:italic">No vendor quotes yet.</div>`;
      return;
    }

    // Lowest bidder gets a clear visual flag — procurement still has
    // to click Choose themselves (confirmed: no auto-selection), this
    // just saves them doing the comparison math by eye. Only shown
    // when there's more than one quote with an actual extracted cost
    // to compare against — flagging "the lowest" among a single quote
    // says nothing useful.
    const extractedCosts = responses.filter(r => r.totalCost != null).map(r => r.totalCost);
    const lowestCost = extractedCosts.length > 1 ? Math.min(...extractedCosts) : null;

    listEl.innerHTML = responses.map(r => {
      const isLowest = lowestCost !== null && r.totalCost === lowestCost && !r.chosen;
      return `
      <div style="border:1px solid ${r.chosen ? 'var(--green)' : isLowest ? 'var(--navy)' : 'var(--border)'};background:${r.chosen ? '#F0FDF4' : isLowest ? '#F0F5FC' : '#fff'};border-radius:8px;padding:10px 12px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-size:13px;font-weight:600;color:var(--text)">${r.vendorName}${r.chosen ? ' <span style="color:var(--green);font-weight:700">✓ Chosen</span>' : ''}${isLowest ? ' <span style="color:var(--navy);font-weight:700;font-size:11px">● Lowest bid</span>' : ''}</div>
            ${r.totalCost != null ? `<div style="font-size:15px;font-weight:700;color:var(--navy);margin-top:2px">${formatCurrency(r.totalCost)}</div>` : `<div style="font-size:11px;color:var(--muted);font-style:italic;margin-top:2px">Cost not yet extracted — AI analysis may still be processing</div>`}
            ${r.vatStatus ? `<div style="font-size:11px;color:var(--muted)">${r.vatStatus}</div>` : ''}
            ${r.summary ? `<div style="font-size:11.5px;color:var(--muted);margin-top:4px;max-width:420px">${r.summary}</div>` : ''}
            ${r.attachmentUrl ? `<a href="${r.attachmentUrl}" target="_blank" rel="noopener" style="font-size:11px;color:var(--navy);text-decoration:underline">View proforma${r.attachmentFilename ? ' — ' + r.attachmentFilename : ''}</a>` : `<div style="font-size:11px;color:var(--muted);font-style:italic">No file attached yet</div>`}
          </div>
          ${canManage && stillOpen && !r.chosen ? `<button onclick="chooseProcurementResponse('${o.id}', '${o.woId}', '${r.id}')" style="padding:6px 12px;font-size:11.5px;font-weight:600;border:none;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer;flex-shrink:0">Choose</button>` : ''}
        </div>
      </div>`;
    }).join('');
  } catch (err) {
    const listEl = document.getElementById('procurementResponsesList');
    if (listEl) listEl.innerHTML = `<div style="color:var(--red)">Could not load vendor quotes: ${err.message}</div>`;
  }
}

async function submitAddProcurementResponse(recordId, woId) {
  const vendorName = document.getElementById('aq_vendor').value.trim();
  const file = document.getElementById('aq_file').files[0];
  const errorBox = document.getElementById('aq_error');
  const btn = document.getElementById('aq_submit');
  errorBox.style.display = 'none';

  if (!vendorName) { errorBox.textContent = 'Vendor name is required.'; errorBox.style.display = 'block'; return; }
  if (file && file.size > 5 * 1024 * 1024) { errorBox.textContent = "File is larger than 5MB."; errorBox.style.display = 'block'; return; }

  btn.disabled = true;
  btn.textContent = 'Adding…';

  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ addProcurementResponse: true, woId, vendorName }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not add vendor quote');

    if (file) {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const uploadResp = await fetch('/api/work-orders', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          uploadProcurementResponseAttachment: true,
          responseId: data.responseId,
          filename: file.name,
          contentType: file.type || 'application/pdf',
          fileBase64: base64,
        }),
      });
      const uploadData = await uploadResp.json();
      if (!uploadResp.ok || !uploadData.success) throw new Error(uploadData.error || 'Quote added, but the file upload failed — try attaching it again.');
    }

    document.getElementById('addQuoteOverlay')?.remove();
    const o = lastWorkOrders.find(w => w.id === recordId);
    if (o) renderWODetailProcurementResponses(o);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Add Quote';
  }
}

async function chooseProcurementResponse(recordId, woId, responseId) {
  if (!confirm('Choose this vendor as the winning quote?')) return;
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chooseProcurementResponse: true, responseId, woId }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not choose this quote');
    const o = lastWorkOrders.find(w => w.id === recordId);
    if (o) renderWODetailProcurementResponses(o);
  } catch (err) {
    alert('Could not choose this quote: ' + err.message);
  }
}

async function renderWODetailChecklist(o) {
  const el = document.getElementById('woDetailChecklist');
  if (!el) return;
  const checklistClass = guessChecklistClass(o.assetName || '', o.system || '');

  let progress = {};
  try { progress = JSON.parse(o.checklistProgress || '{}'); } catch { progress = {}; }

  try {
    const resp = await fetch('/api/work-orders?checklist=' + encodeURIComponent(checklistClass || '') + '&assignedRole=' + encodeURIComponent(o.assignedRole || ''));
    const data = await resp.json();
    if (!data.items || data.items.length === 0) {
      el.innerHTML = `<div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px">Maintenance Checklist</div><div style="font-size:12px;color:var(--muted)">No checklist items defined yet.</div>`;
      return;
    }
    window.currentWODetailChecklist = { workOrderId: o.id, assetName: o.assetName, checklistClass: data.class, data, progress };

    // Time-bound grouping — same pattern as the printable version, so
    // this reads consistently whether viewed on screen or downloaded.
    const freqGroups = {};
    data.items.forEach((item, i) => {
      const freq = item.frequency || 'Unscheduled';
      (freqGroups[freq] = freqGroups[freq] || []).push({ ...item, _index: i });
    });
    const freqOrder = ['Every occurrence','Daily','Weekly','Monthly','Quarterly','Semi-annually','Annually','Unscheduled'];
    const orderedFreqs = Object.keys(freqGroups).sort((x,y) => freqOrder.indexOf(x) - freqOrder.indexOf(y));

    const completedCount = data.items.filter((_, i) => progress[i] && progress[i].checked).length;

    let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div style="font-size:12px;font-weight:700;color:var(--navy)">Maintenance Checklist — ${data.class}</div>
      <button onclick="downloadWODetailChecklist()" style="padding:6px 12px;font-size:11px;font-weight:600;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer">↓ Download PDF</button>
    </div>
    ${data.generic
      ? `<div style="font-size:11px;color:var(--amber);font-weight:600;margin-bottom:2px">General checklist — no asset-specific standard mapped yet</div>`
      : `<div style="font-size:11px;color:var(--navy);font-weight:600;margin-bottom:2px">${data.sourceStandard || ''}</div>`}
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">${completedCount} of ${data.items.length} completed — optional tracking, does not block closing this work order</div>`;

    orderedFreqs.forEach(freq => {
      html += `<div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--navy);background:#EEF1F5;padding:5px 10px;margin-top:10px">${freq}</div>`;
      freqGroups[freq].forEach(item => {
        const state = progress[item._index] || {};
        const noteText = state.checked
          ? `Checked by ${state.by}${state.at ? ' · ' + new Date(state.at).toLocaleDateString() : ''}`
          : (state.by ? `Unchecked by ${state.by}${state.at ? ' · ' + new Date(state.at).toLocaleDateString() : ''}` : '');
        html += `<label style="display:flex;align-items:flex-start;gap:8px;padding:7px 4px;border-bottom:1px solid var(--border);cursor:pointer">
          <input type="checkbox" ${state.checked ? 'checked' : ''} onchange="toggleWOChecklistItem('${o.id}', ${item._index}, this.checked, this, '${(item.task||'').replace(/'/g,"\\'")}')" style="margin-top:2px">
          <span><div style="font-size:13px">${item.task}</div>${noteText ? `<div style="font-size:10.5px;color:${state.checked?'var(--green)':'var(--muted)'};margin-top:2px">${state.checked?'✓':'○'} ${noteText}</div>` : ''}</span>
        </label>`;
      });
    });

    el.innerHTML = html;
  } catch (err) {
    el.innerHTML = `<div style="font-size:12px;color:var(--red)">Could not load checklist: ${err.message}</div>`;
  }
}

  const { workOrderId, assetName, checklistClass, data, progress } = window.currentWODetailChecklist;

  data.items.forEach((item, i) => {
    const freq = item.frequency || 'Unscheduled';
    (freqGroups[freq] = freqGroups[freq] || []).push({ ...item, _index: i });
  });
  const freqOrder = ['Every occurrence','Daily','Weekly','Monthly','Quarterly','Semi-annually','Annually','Unscheduled'];
  const orderedFreqs = Object.keys(freqGroups).sort((x,y) => freqOrder.indexOf(x) - freqOrder.indexOf(y));

  let sectionsHtml = '';

      <div class="doc">

        ${sectionsHtml}
        <div style="margin-top:30px;font-size:10.5px;color:#9CA3AF;text-align:center">Generated ${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})} · Gracing Ventures Facility Asset Management</div>

// Work Order Chat — a separate discussion thread from the Activity
// record above. Open to anyone logged in who can see the work order;
// what's personal is only whether you've read it (tracked below).
function chatParticipantLabel(username, staff) {
  const match = (staff || []).find(s => s.username === username);
  return (match && match.displayName) || username;
}

// Unread is personal, like a WhatsApp group — computed entirely from
// data already on the work order object, no extra fetch. Everyone can
// see every work order's chat now, so what's personal is purely
// whether YOU'VE read it — not membership. A person's own messages
// never count as unread for themselves.
function getWOUnreadCount(o) {
  let chatLog = [];
  try { chatLog = JSON.parse(o.chatLog || '[]'); } catch { chatLog = []; }
  if (chatLog.length === 0) return 0;

  let receipts = {};
  try { receipts = JSON.parse(o.chatReadReceipts || '{}'); } catch { receipts = {}; }
  const lastRead = receipts[currentUsername] ? new Date(receipts[currentUsername]).getTime() : 0;

  return chatLog.filter(m => m.by !== currentUsername && new Date(m.at).getTime() > lastRead).length;
}

// Sidebar-level indicator only — deliberately NOT on the account
// badge. A personal inbox-style counter on your own name implies
// things are waiting on you to respond, which isn't how oversight
// roles use this. This badge just says "some work order has new
// chat activity," scoped to Work Orders where it belongs.
function updateWOUnreadBadges() {
  const badge = document.getElementById('woChatUnreadBadge');
  if (!badge) return;
  const count = dashboardWorkOrders.filter(o => getWOUnreadCount(o) > 0).length;
  if (count > 0) {
    badge.textContent = count > 99 ? '99+' : String(count);
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

      <input id="woDetailChatInput" placeholder="Message about this work order…" style="flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px" onkeydown="if(event.key==='Enter')submitWODetailChatMessage('${o.id}')">

// Shared across all three chat surfaces (Work Order, staff Unit view,
// tenant portal) — one consistent way to render a sent attachment,
// image preview inline like WhatsApp, anything else as a download link.
function renderChatAttachmentHtml(m, bubbleIsDark) {
  if (!m.attachmentUrl) return '';
  const isImage = (m.attachmentType || '').startsWith('image/');
  const linkColor = bubbleIsDark ? '#fff' : 'var(--navy)';
  if (isImage) {
    return `<a href="${m.attachmentUrl}" target="_blank" rel="noopener"><img src="${m.attachmentUrl}" style="max-width:100%;border-radius:8px;margin-top:6px;display:block"></a>`;
  }
  return `<a href="${m.attachmentUrl}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px;margin-top:6px;padding:6px 10px;background:rgba(0,0,0,0.06);border-radius:8px;font-size:11.5px;color:${linkColor};text-decoration:none">📄 ${m.attachmentFilename || 'Download file'}</a>`;
}

function renderWODetailChatThread(chatLog, staff) {

        <div style="font-size:13px;margin-top:${isMine ? '0' : '2px'};line-height:1.4">${m.text || ''}</div>

      </div>

}

// Called every time the chat thread is actually displayed on screen —
// that's the real "read" moment, not a timer or a guess. Skips the
// network call entirely if there was nothing unread to begin with, so
// re-opening an already-read work order doesn't spend a write on it.
async function markWorkOrderChatRead(o) {
  if (getWOUnreadCount(o) === 0) return;

  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ markChatRead: true, recordId: o.id }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) return; // non-fatal — badge just stays until next successful mark

    const receiptsJson = JSON.stringify(data.chatReadReceipts);
    o.chatReadReceipts = receiptsJson;
    const dashCopy = dashboardWorkOrders.find(w => w.id === o.id);
    if (dashCopy) dashCopy.chatReadReceipts = receiptsJson;
    updateWOUnreadBadges();
  } catch (err) {
    console.error('markWorkOrderChatRead error:', err);
  }
}

async function submitWODetailChatMessage(recordId) {
  const input = document.getElementById('woDetailChatInput');
  const text = input.value.trim();
  if (!text && !woChatPendingFile) return;
  input.disabled = true;

  try {
    const body = { addChatMessage: true, recordId, text };
    if (woChatPendingFile) {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(woChatPendingFile);
      });
      body.attachmentBase64 = base64;
      body.attachmentFilename = woChatPendingFile.name;
      body.attachmentContentType = woChatPendingFile.type || 'application/octet-stream';
    }

    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not send message');

    const o = lastWorkOrders.find(w => w.id === recordId);
    if (o) { o.chatLog = JSON.stringify(data.chatLog); o.chatReadReceipts = JSON.stringify(data.chatReadReceipts || {}); }
    const dashCopy = dashboardWorkOrders.find(w => w.id === recordId);
    if (dashCopy) { dashCopy.chatLog = JSON.stringify(data.chatLog); dashCopy.chatReadReceipts = JSON.stringify(data.chatReadReceipts || {}); }
    updateWOUnreadBadges();

    input.value = '';
    woChatPendingFile = null;
    const previewEl = document.getElementById('woChatAttachPreview');
    if (previewEl) previewEl.style.display = 'none';
    const fileInputEl = document.getElementById('woDetailChatFile');
    if (fileInputEl) fileInputEl.value = '';

    const staff = await loadStaffList();
    renderWODetailChatThread(data.chatLog, staff);
  } catch (err) {
    alert('Could not send message: ' + err.message);
  } finally {
    input.disabled = false;
    input.focus();
  }
}

async function openWorkOrderChecklist(recordId, assetName, system) {
  const checklistClass = guessChecklistClass(assetName, system);
  if (!checklistClass) return;

  const wo = lastWorkOrders.find(o => o.id === recordId);
  let progress = {};
  try { progress = JSON.parse((wo && wo.checklistProgress) || "{}"); } catch { progress = {}; }

  const overlay = document.createElement('div');
  overlay.id = 'checklistWOOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px';
  overlay.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;padding:28px">
    <h3 style="font-size:16px;color:var(--navy);margin-bottom:4px">Checklist: ${assetName}</h3>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px">Optional tracking — checking items off does not block closing this work order.</div>
    <div id="wo_checklist_body" style="font-size:12.5px;color:var(--muted)">Loading…</div>
    <button onclick="document.getElementById('checklistWOOverlay').remove()" style="margin-top:16px;width:100%;padding:11px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-weight:600;cursor:pointer">Close</button>
  </div>`;
  document.body.appendChild(overlay);

  try {
    const resp = await fetch('/api/work-orders?checklist=' + encodeURIComponent(checklistClass));
    const data = await resp.json();
    const body = document.getElementById('wo_checklist_body');
    if (!data.items || data.items.length === 0) {
      body.innerHTML = `<div>No checklist items defined yet for ${checklistClass}.</div>`;
      return;
    }
    body.innerHTML = data.items.map((item, i) => {
      const state = progress[i] || {};
      const noteText = state.checked
        ? `Checked by ${state.by}${state.at ? ' · ' + new Date(state.at).toLocaleDateString() : ''}`
        : (state.by ? `Unchecked by ${state.by}${state.at ? ' · ' + new Date(state.at).toLocaleDateString() : ''}` : '');
      return `<label style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer">
        <input type="checkbox" ${state.checked ? 'checked' : ''} onchange="toggleWOChecklistItem('${recordId}', ${i}, this.checked, this, '${(item.task||'').replace(/'/g,"\\'")}')" style="margin-top:2px">
        <span><div>${item.task}</div>${noteText ? `<div style="font-size:10.5px;color:${state.checked?'var(--green)':'var(--muted)'};margin-top:2px">${state.checked?'✓':'○'} ${noteText}</div>` : ''}</span>
      </label>`;
    }).join('');
  } catch (err) {
    document.getElementById('wo_checklist_body').innerHTML = `<div style="color:var(--red)">Could not load checklist: ${err.message}</div>`;
  }
}

async function toggleWOChecklistItem(recordId, itemId, checked, inputEl, itemLabel) {
  inputEl.disabled = true;
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ checklistToggle: true, recordId, itemId, checked, itemLabel }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not save');

    // Update local cache so re-opening the modal reflects the change
    // immediately without needing a full work orders reload.
    const wo = lastWorkOrders.find(o => o.id === recordId);
    if (wo) wo.checklistProgress = JSON.stringify(data.progress);

    const label = inputEl.closest('label');
    const noteSpan = label.querySelector('span');
    const noteHtml = checked
      ? `<div style="font-size:10.5px;color:var(--green);margin-top:2px">✓ Checked by ${data.progress[itemId].by} · just now</div>`
      : `<div style="font-size:10.5px;color:var(--muted);margin-top:2px">○ Unchecked by ${data.progress[itemId].by} · just now</div>`;
    const noteDiv = noteSpan.querySelector('div:last-child');
    if (noteDiv && noteDiv !== noteSpan.firstElementChild) {
      noteDiv.outerHTML = noteHtml;
    } else {
      noteSpan.insertAdjacentHTML('beforeend', noteHtml);
    }

    // Every check/uncheck belongs in the Activity thread at the bottom
    // of the page too — not just the inline note next to the box.
    if (wo && data.activityEntry) {
      let log = [];
      try { log = JSON.parse(wo.activityLog || '[]'); } catch { log = []; }
      log.push(data.activityEntry);
      wo.activityLog = JSON.stringify(log);
      renderWODetailActivityThread(wo);
    }
  } catch (err) {
    inputEl.checked = !checked; // revert on failure
    alert('Could not save checklist item: ' + err.message);
  } finally {
    inputEl.disabled = false;
  }
}

async function submitFloorPlanUpload() {
  const floorSelect = document.getElementById('fp_uploadFloor');
  const fileInput = document.getElementById('fp_uploadFile');
  const errorBox = document.getElementById('fp_uploadError');
  const btn = document.getElementById('fp_uploadBtn');
  const floor = floorSelect.value;
  const file = fileInput.files[0];

  errorBox.style.display = 'none';
  if (!file) {
    errorBox.textContent = 'Choose an image file first.';
    errorBox.style.display = 'block';
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    errorBox.textContent = 'File is larger than 5MB — Airtable\'s direct upload limit. Try a smaller image.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Uploading…';

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]); // strip data: prefix
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const resp = await fetch('/api/manage-asset', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'uploadFloorPlan',
        floor,
        filename: file.name,
        contentType: file.type || 'image/svg+xml',
        fileBase64: base64,
      }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Upload failed');

    document.getElementById('floorPlanUploadPanel').style.display = 'none';
    fileInput.value = '';
    floorPlanCurrentFloor = floor; // jump to the floor that was just uploaded
    renderFloorPlan();
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Upload';
  }
}

async function buildWorkOrdersHtml(orders) {
  const open = orders.filter(o => o.status === 'Open').length;
  const inProgress = orders.filter(o => o.status === 'In Progress').length;
  const completed = orders.filter(o => o.status === 'Completed').length;

  const isSimplified = currentUserPermissions && currentUserPermissions.simplifiedNav;

  let html = '';

  if (!isSimplified) {

      <button onclick="runRealTest('URGENT')" style="padding:8px 14px;font-size:12px;font-weight:600;border:none;border-radius:8px;background:var(--amber);color:#fff;cursor:pointer">Test Urgent</button>
      <button onclick="runRealTest('UPCOMING')" style="padding:8px 14px;font-size:12px;font-weight:600;border:none;border-radius:8px;background:var(--blue);color:#fff;cursor:pointer">Test Upcoming</button>
    </div>
    <div id="testResult" style="margin-top:10px;font-size:12px;display:none"></div>
  </div>`;
  }

  if (currentUserRole === 'procurement' || currentUserRole === 'business_owner' || currentUserRole === 'system_admin') {
    html += `<div style="background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--navy)">Vendors</div>
        <div style="font-size:11.5px;color:var(--muted)">Vendors need to exist here before quotes can be attached to a procurement request.</div>
      </div>
      <button onclick="openManageVendorsModal()" style="padding:8px 16px;font-size:12.5px;font-weight:600;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer">Manage Vendors</button>
    </div>`;
  }

  if (currentUserRole === 'business_owner' || currentUserRole === 'system_admin') {
    html += `<div style="background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--navy)">SLA Targets</div>
        <div style="font-size:11.5px;color:var(--muted)">What you're actually promising, per urgency tier — shown as a badge on every work order once it's measurable.</div>
      </div>
      <button onclick="openSLASettingsModal()" style="padding:8px 16px;font-size:12.5px;font-weight:600;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy);cursor:pointer">Edit SLA Targets</button>
    </div>`;
  }

  if (isSimplified) {
    // Procurement-type work orders (spare parts ordered directly from
    // an asset, no breakdown involved) are deliberately excluded from
    // the technician's view entirely — confirmed with Grace: it's not
    // something a technician needs to go fix, so counting it toward
    // "Open" would make that number less honest. Visible to engineers,
    // procurement, and Business Owner instead.
    const techOrders = orders.filter(o => o.maintenanceType !== 'Procurement');

    // Need the staff directory to know which usernames are actually
    // technicians, so "has any technician touched this" can be checked
    // for the Open to Claim pool below — not just "have I."
    const staff = await loadStaffList();
    const technicianUsernames = new Set(staff.filter(s => s.role === 'technician').map(s => s.username || s.displayName));

    // A ticket is "mine" if it's explicitly assigned to me (confirmed
    // or still pending confirmation — I need to SEE a pending
    // assignment to act on it) OR I've personally acted on it (any
    // Activity Log entry with by === me). Two different paths into the
    // same list, since assignment and self-claiming both exist side by
    // side, confirmed.
    const myOrders = techOrders.filter(o => {
      if (o.assignedTechnician === currentUsername) return true;
      let log = [];
      try { log = JSON.parse(o.activityLog || '[]'); } catch { log = []; }
      return log.some(e => e.by === currentUsername);
    });
    const myOrderIds = new Set(myOrders.map(o => o.id));
    const myActive = myOrders.filter(o => o.status !== 'Completed');
    const myCompleted = myOrders.filter(o => o.status === 'Completed')
      .sort((a, b) => new Date(b.completedDate || b.created) - new Date(a.completedDate || a.created));

    // Recency windows — cumulative rolling windows ending now, not
    // calendar boundaries, so "this week" naturally includes today's
    // count. All four are computed up front; the selector below just
    // swaps which one is displayed, entirely client-side, no refetch.
    const now = Date.now();
    const DAY = 24 * 60 * 60 * 1000;
    const sinceCompleted = (o) => {
      const d = o.completedDate ? new Date(o.completedDate).getTime() : null;
      return d ? now - d : Infinity;
    };
    const completedToday = myCompleted.filter(o => sinceCompleted(o) <= 1 * DAY).length;
    const completedThisWeek = myCompleted.filter(o => sinceCompleted(o) <= 7 * DAY).length;
    const completedThisMonth = myCompleted.filter(o => sinceCompleted(o) <= 30 * DAY).length;
    const completedThisYear = myCompleted.filter(o => sinceCompleted(o) <= 365 * DAY).length;

    // Open to Claim (relabeled "Open Tickets") — genuinely untouched
    // work only — no Assigned Technician set, AND no technician (any
    // technician, not just me) has acted on it yet. The moment either
    // happens it drops out of this shared pool, so two technicians
    // never end up duplicating the same job.
    const available = techOrders.filter(o => {
      if (o.status === 'Completed' || myOrderIds.has(o.id)) return false;
      if (o.assignedTechnician) return false;
      let log = [];
      try { log = JSON.parse(o.activityLog || '[]'); } catch { log = []; }
      return !log.some(e => technicianUsernames.has(e.by));
    });

    // Turnaround time — average days from creation to completion,
    // across his own completed tickets. This is the actual performance
    // metric; the recency counts above are activity volume, not speed.
    const turnaroundDays = myCompleted
      .map(o => {
        const created = o.created ? new Date(o.created).getTime() : null;
        const done = o.completedDate ? new Date(o.completedDate).getTime() : null;
        return (created && done) ? (done - created) / DAY : null;
      })
      .filter(d => d !== null);
    const avgDays = turnaroundDays.length ? (turnaroundDays.reduce((a, b) => a + b, 0) / turnaroundDays.length).toFixed(1) : null;

    // Same simple text-match convention appendActivityLog already uses
    // elsewhere on this page for reading past entries back out.
    const procurementReqCount = myOrders.reduce((sum, o) => {
      let log = [];
      try { log = JSON.parse(o.activityLog || '[]'); } catch { log = []; }
      return sum + log.filter(e => e.by === currentUsername && e.type === 'procurement_request').length;
    }, 0);

    // Completion stat — one card, a selector chooses which window it
    // Open comes first — his own count of what's still active, shown
    // as its own full stat card, not buried as a subtitle under
    // something else.
    html += `<div style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px">Open</div>
      <div class="summary-grid">
        <div class="summary-card"><div class="summary-val" style="color:var(--red)">${myActive.length}</div><div class="summary-label">Open — not yet completed</div></div>
      </div>
    </div>`;

    // Completed — one card, a selector chooses which window it
    // reflects. All four numbers are already computed above; switching
    // is instant, no refetch.
    html += `<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div style="font-size:13px;font-weight:700;color:var(--navy)">Completed</div>
        <select onchange="document.getElementById('techCompletedStatVal').textContent = this.value" style="padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;color:var(--text)">
          <option value="${completedToday}">Today</option>
          <option value="${completedThisWeek}" selected>This Week</option>
          <option value="${completedThisMonth}">This Month</option>
          <option value="${completedThisYear}">This Year</option>
        </select>
      </div>
      <div class="summary-grid">
        <div class="summary-card"><div class="summary-val" id="techCompletedStatVal" style="color:var(--green)">${completedThisWeek}</div><div class="summary-label">Completed in selected period</div></div>
      </div>
    </div>`;

    // Staff Performance — same visual format as the manager-facing
    // version at the bottom of the main Dashboard, just his own row.
    // Avg. Days is turnaround time — the actual speed-of-resolution
    // metric, distinct from the recency counts above.
    html += `<div style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px">Staff Performance</div>
      <div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--white)">
        <div class="staff-perf-header">
          <div class="staff-perf-cell staff-perf-name">Person</div>
          <div class="staff-perf-cell"><span class="staff-perf-val">Pending</span></div>
          <div class="staff-perf-cell"><span class="staff-perf-val">Closed</span></div>
          <div class="staff-perf-cell"><span class="staff-perf-val">Avg. Days</span></div>
          <div class="staff-perf-cell"><span class="staff-perf-val">Procurement Reqs</span></div>
        </div>
        <div class="staff-perf-body"><div class="staff-perf-row">
          <div class="staff-perf-cell staff-perf-name">${chatParticipantLabel(currentUsername, staff)}</div>
          <div class="staff-perf-cell"><span class="staff-perf-label">Pending</span><span class="staff-perf-val" style="${myActive.length > 0 ? 'color:var(--red);font-weight:700' : ''}">${myActive.length}</span></div>
          <div class="staff-perf-cell"><span class="staff-perf-label">Closed</span><span class="staff-perf-val">${myCompleted.length}</span></div>
          <div class="staff-perf-cell"><span class="staff-perf-label">Avg. Days</span><span class="staff-perf-val">${avgDays != null ? avgDays + 'd' : '—'}</span></div>
          <div class="staff-perf-cell"><span class="staff-perf-label">Procurement Reqs</span><span class="staff-perf-val">${procurementReqCount}</span></div>
        </div></div>
      </div>
    </div>`;

    html += `<div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px">Open Tickets</div>`;
    if (available.length === 0) {
      html += `<div style="text-align:center;padding:24px 20px;color:var(--muted);font-style:italic;margin-bottom:20px">Nothing waiting to be picked up right now.</div>`;
    } else {
      html += `<div class="asset-list" style="margin-bottom:20px">${available.map(o => renderWORowHtml(o, staff)).join('')}</div>`;
    }

    // All Work Orders — the true full mixture: unclaimed, his own
    // active, and completed, all together. The stats and Staff
    // Performance above are there to help him find what he's looking
    // for — this list itself is everything, unfiltered by assignment.
    html += `<div style="font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px">All Work Orders</div>`;
    const allTechOrders = techOrders.slice().sort((a, b) => new Date(b.created) - new Date(a.created));
    if (allTechOrders.length === 0) {
      html += `<div style="text-align:center;padding:24px 20px;color:var(--muted);font-style:italic">Nothing here yet.</div>`;
    } else {
      html += `<div class="asset-list">${allTechOrders.map(o => renderWORowHtml(o, staff)).join('')}</div>`;
    }
  } else {
    html += `<div class="summary-grid">
    <div class="summary-card"><div class="summary-val" style="color:var(--navy)">${orders.length}</div><div class="summary-label">Total Work Orders</div></div>
    <div class="summary-card"><div class="summary-val" style="color:var(--red)">${open}</div><div class="summary-label">Open</div></div>
    <div class="summary-card"><div class="summary-val" style="color:var(--amber)">${inProgress}</div><div class="summary-label">In Progress</div></div>
    <div class="summary-card"><div class="summary-val" style="color:var(--green)">${completed}</div><div class="summary-label">Completed</div></div>
  </div>`;

    if (orders.length === 0) {
      html += `<div style="text-align:center;padding:40px 20px;color:var(--muted);font-style:italic">No work orders yet — these are created automatically the moment a real maintenance alert fires.</div>`;
    } else {
      const staff = await loadStaffList();
      html += `<div class="asset-list">${orders.map(o => renderWORowHtml(o, staff)).join('')}</div>`;
    }
  }

  return html;
}

// Tracks the last-seen work order data so the background poll (below)
// can tell whether anything actually changed — and do nothing at all,
// not even touch the DOM, when it hasn't. This is what makes the
// refresh quiet: most polls find no changes and are a complete no-op
// from the person's point of view.
let lastWOSignature = null;

async function renderWorkOrders() {
  currentWODetailId = null;
  const container = document.getElementById('view-workorders');
  container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--muted)">Loading work orders…</div>';

  try {
    const resp = await fetch('/api/work-orders');
    if (resp.status === 401) { window.location.href = '/login'; return; }
    if (!resp.ok) throw new Error('Failed to load work orders (' + resp.status + ')');
    const data = await resp.json();
    const orders = data.workOrders || [];
    lastWorkOrders = orders; // cache for generateCertificate() to reference — unfiltered, so detail lookups always work regardless of building selection
    dashboardWorkOrders = orders; // same fetch covers the sidebar unread badge — no reason to keep two stale copies
    updateWOUnreadBadges();
    lastWOSignature = JSON.stringify(orders);
    refreshBuildingSwitcherOptions();

    container.innerHTML = await buildWorkOrdersHtml(filterByBuilding(orders));
  } catch (err) {
    container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--red)">Could not load work orders: ' + err.message + '</div>';
  }
}

async function submitWorkOrderPhoto(recordId, photoType, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    alert("File is larger than 5MB. Try a smaller photo.");
    return;
  }

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const resp = await fetch('/api/work-orders', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'uploadWorkOrderPhoto',
        recordId, photoType,
        filename: file.name,
        contentType: file.type || 'image/jpeg',
        fileBase64: base64,
      }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Upload failed');
    refreshWorkOrdersView(recordId);
  } catch (err) {
    alert('Could not upload photo: ' + err.message);
  }
}

async function submitProcurementRequest(recordId) {
  const description = document.getElementById('proc_description').value.trim();
  const quantity = Number(document.getElementById('proc_quantity').value) || 0;
  const unit = document.getElementById('proc_unit').value.trim();
  const errorBox = document.getElementById('procRequestError');

  if (!description || !quantity) {
    errorBox.textContent = 'A description and quantity are required.';
    errorBox.style.display = 'block';
    return;
  }

  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requestProcurement: true, recordId, description, quantity, unit }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not submit request');
    document.getElementById('procurementOverlay').remove();
    refreshWorkOrdersView(recordId);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';

async function submitConfirmDelivery(recordId) {
  const fileInput = document.getElementById('cd_file');
  const file = fileInput.files[0];
  const deliveryNote = document.getElementById('cd_note').value.trim();
  const errorBox = document.getElementById('cd_error');
  const btn = document.getElementById('cd_submit');
  errorBox.style.display = 'none';

  if (file && file.size > 5 * 1024 * 1024) {
    errorBox.textContent = 'File is larger than 5MB.';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true; btn.textContent = 'Confirming…';
  try {
    const body = { confirmDelivery: true, recordId };
    if (deliveryNote) body.deliveryNote = deliveryNote;
    if (file) {
      body.filename = file.name;
      body.contentType = file.type || 'application/octet-stream';
      body.fileBase64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not confirm delivery');
    document.getElementById('confirmDeliveryOverlay')?.remove();
    refreshWorkOrdersView(recordId);
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Confirm Delivery';
  }
}

      headers: { 'Content-Type': 'application/json' },

    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not save cost');

async function updateWorkOrderStatus(recordId, status, cost) {
  try {
    const body = { recordId, status };
    if (cost !== undefined) body.cost = cost;
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) {
      const errorDetail = data.errors && data.errors.length ? data.errors[0] : (data.error || 'Unknown error');
      throw new Error(errorDetail);
    }
    refreshWorkOrdersView(recordId);
  } catch (err) {
    alert('Could not update work order:\n\n' + err.message);
  }
}

}

function updateBulkCloseButton() {
  const checked = document.querySelectorAll('.wo-checkbox:checked').length;
  const btn = document.getElementById('bulkCloseBtn');
  if (!btn) return;
  btn.textContent = `Close Selected (${checked})`;
  btn.disabled = checked === 0;
  btn.style.opacity = checked === 0 ? '0.5' : '1';
}

// Closes every checked work order in ONE request, then refreshes the
// tab exactly once — not once per item, which is what made closing
// several in a row slow and annoying before.
async function bulkCloseWorkOrders() {
  const ids = Array.from(document.querySelectorAll('.wo-checkbox:checked')).map(cb => cb.dataset.id);
  if (ids.length === 0) return;

  const btn = document.getElementById('bulkCloseBtn');
  btn.disabled = true;
  btn.textContent = `Closing ${ids.length}…`;

  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recordIds: ids, status: 'Completed' }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Bulk close failed');
    if (data.failed > 0) {
      const errorDetail = data.errors && data.errors.length ? '\n\nReal error from Airtable:\n' + data.errors[0] : '';
      alert(`${data.updated} closed successfully, ${data.failed} failed.${errorDetail}`);
    }
    renderWorkOrders(); // single refresh, after everything is done
  } catch (err) {
    alert('Could not close selected work orders: ' + err.message);
    renderWorkOrders();
  }
}

// Shared utility: builds a real .xlsx file (bold header row, correct
// unicode handling — no more broken "—" characters) from any array of
// asset objects. Used by both the full register download and the
// single-asset download button.
function exportAssetsXLSX(assetList, filenameSuffix) {
  const headers = ["Asset ID","Name","System","Class","Level","Location","Manufacturer","Model","Install Date","Status","Criticality","Last Service","Next Service Due"];
  const rows = assetList.map(a => [a.id, a.name, a.system, a.category, displayFloor(a.floor), displayRoom(a.room), a.manufacturer, a.model, a.installDate, a.status, a.criticality, a.lastService, a.nextService]);

  const worksheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);

  // Bold the header row
  const headerRange = XLSX.utils.decode_range(worksheet['!ref']);
  for (let col = headerRange.s.c; col <= headerRange.e.c; col++) {
    const cellRef = XLSX.utils.encode_cell({ r: 0, c: col });
    if (!worksheet[cellRef]) continue;
    worksheet[cellRef].s = { font: { bold: true } };
  }

  // Reasonable column widths so it's readable on open, not cramped
  worksheet['!cols'] = headers.map(h => ({ wch: Math.max(h.length + 2, 14) }));

  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Asset Register");

  const filename = `${CLIENT_CONFIG.clientName.replace(/\s+/g,'_')}_${filenameSuffix}_${new Date().toISOString().split('T')[0]}.xlsx`;
  XLSX.writeFile(workbook, filename, { cellStyles: true });
}

// Cross-origin <a download> links often just navigate instead of downloading
// (browsers require same-origin, or a blob, for that attribute to be honored
// reliably). Fetching the QR image ourselves and turning it into a blob URL
// fixes this — this is what actually makes "Download QR" save a real PNG file.
function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Could not load ' + src));
    img.src = src;
  });
}

// Composes a printable sticker: company logo + QR code + Asset/Unit ID,
// matching the confirmed physical label layout — this is what actually
// gets stuck on the asset or unit, not the bare QR code alone.
async function downloadQrCode(qrUrl, idText, filenameBase) {
  try {
    // Fetch the QR as a blob first, same proven pattern as before —
    // loading a blob URL into an <img> avoids any cross-origin canvas
    // tainting that loading the qrserver.com URL directly might risk.
    const qrResp = await fetch(qrUrl);
    if (!qrResp.ok) throw new Error('QR service returned ' + qrResp.status);
    const qrBlob = await qrResp.blob();
    const qrObjUrl = URL.createObjectURL(qrBlob);

    const [qrImg, logoImg] = await Promise.all([loadImageEl(qrObjUrl), loadImageEl('/logo.png')]);

    // Inter is already the app's own font — canvas won't use a webfont
    // until it's explicitly confirmed loaded, otherwise text silently
    // falls back to a generic system font and the whole thing looks cheap.
    await Promise.all([
      document.fonts.load('700 44px Inter'),
      document.fonts.load('600 26px Inter'),
    ]);

    // Rendered at 3x the visual size — this gets printed and stuck on
    // a physical asset, so a soft, pixelated QR code isn't acceptable;
    // it needs to stay cleanly scannable at sticker size.
    const scale = 3;
    const W = 260 * scale, H = 340 * scale;
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    function roundRectPath(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    const navy = '#0A3866';
    const outerR = 18 * scale;

    // Base card with a soft shadow, rounded corners — a real printed
    // card, not a plain rectangle with a hard border.
    ctx.save();
    ctx.shadowColor = 'rgba(10, 56, 102, 0.18)';
    ctx.shadowBlur = 14 * scale;
    ctx.shadowOffsetY = 4 * scale;
    ctx.fillStyle = '#fff';
    roundRectPath(6 * scale, 6 * scale, W - 12 * scale, H - 12 * scale, outerR);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = navy;
    ctx.lineWidth = 2 * scale;
    roundRectPath(6 * scale, 6 * scale, W - 12 * scale, H - 12 * scale, outerR);
    ctx.stroke();

    // QR — top, centered, on its own soft card for breathing room
    const qrCardSize = 214 * scale;
    const qrCardX = (W - qrCardSize) / 2;
    const qrCardY = 32 * scale;
    ctx.fillStyle = '#FAFBFC';
    roundRectPath(qrCardX, qrCardY, qrCardSize, qrCardSize, 10 * scale);
    ctx.fill();
    ctx.strokeStyle = '#E2E6ED';
    ctx.lineWidth = 1 * scale;
    roundRectPath(qrCardX, qrCardY, qrCardSize, qrCardSize, 10 * scale);
    ctx.stroke();

    const qrSize = 194 * scale;
    ctx.imageSmoothingEnabled = false; // keep QR modules crisp, not blurred
    ctx.drawImage(qrImg, (W - qrSize) / 2, qrCardY + (qrCardSize - qrSize) / 2, qrSize, qrSize);
    ctx.imageSmoothingEnabled = true;

    // Asset ID / Unit name — centered beneath the QR card
    ctx.fillStyle = navy;
    ctx.font = `700 ${26 * scale}px Inter, Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(idText, W / 2, 288 * scale);

    // Logo — plain, centered near the bottom, no band or container
    // around it. Bounded to fit inside the card's own bottom edge
    // (H - 6*scale) with real padding — previously sized/positioned to
    // reach the canvas edge itself, cutting it off.
    const logoTop = 300 * scale;
    const logoBox = { w: W - 60 * scale, h: (H - 6 * scale) - logoTop - 10 * scale };
    const logoScale = Math.min(logoBox.w / logoImg.width, logoBox.h / logoImg.height);
    const logoW = logoImg.width * logoScale, logoH = logoImg.height * logoScale;
    ctx.drawImage(logoImg, (W - logoW) / 2, logoTop, logoW, logoH);

    URL.revokeObjectURL(qrObjUrl);

    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${filenameBase}-label.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }, 'image/png');
  } catch (err) {
    alert('Could not create label: ' + err.message);
  }
}

function exportSingleAssetFormat(assetId, format) {
  const asset = assets.find(a => a.id === assetId);
  if (!asset) { alert("Asset not found."); return; }

  if (format === 'xlsx') {
    exportAssetsXLSX([asset], `Asset_${assetId}`);
    return;
  }

  if (format === 'csv') {
    const headers = ['Asset ID','Name','System','Category','Floor','Room','Manufacturer','Model','Install Date','Status','Criticality','Last Service','Next Service Due'];
    const row = [asset.id, asset.name, asset.system, asset.category, asset.floor, asset.room, asset.manufacturer, asset.model, asset.installDate, asset.status, asset.criticality, asset.lastService, asset.nextService];
    const csv = headers.join(',') + '\n' + row.map(v => `"${v||''}"`).join(',');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${assetId}.csv`;
    a.click();
    return;
  }

  if (format === 'pdf') {
    const win = window.open('', '_blank');
    win.document.write(`
      <html><head><title>${asset.id} — ${asset.name}</title>
      <style>body{font-family:Arial,sans-serif;padding:30px;color:#1A1A2E}h1{color:#1A3566;font-size:20px}

  win.document.write(`

// Shared builder for both Weekly and Monthly reports — genuinely one
// page, not an unbounded event list. Caps the printed/PDF view to the
// most recent events; CSV/XLSX exports (built separately) still carry
// everything, since a spreadsheet has no "page" to overflow.
function buildPeriodReportHtml(data, title, periodLabel) {
  const ws = data.workOrderStatus || {};
  const maintItemsByType = data.maintenanceItemsByType || {};
  const alertsByUrgency = (() => {
    const grouped = {};
    for (const a of (data.alerts || [])) {
      const key = a.urgency || "Other";
      (grouped[key] = grouped[key] || []).push(a);
    }
    return grouped;
  })();

  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Not Closed';
  const fmtOpenDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';

  const itemTable = (items) => `
    <table class="report-table">
      <colgroup><col style="width:55%"><col style="width:22.5%"><col style="width:22.5%"></colgroup>
      <thead><tr><th>Item</th><th>Date Opened</th><th>Date Closed</th></tr></thead>
      <tbody>${items.map(i => `<tr><td>${i.name || i.assetName}</td><td>${fmtOpenDate(i.dateOpened)}</td><td>${fmtDate(i.dateClosed)}</td></tr>`).join('')}</tbody>
    </table>`;

  return `
    <html><head><title>${title} — ${CLIENT_CONFIG.clientName}</title>
    <style>
      @page { size: A4; margin: 16mm; }
      body { font-family: Arial, sans-serif; padding: 0; color:#1A1A2E; font-size: 14px; max-width: 720px; margin: 0 auto; }
      .report-header { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
      .report-header img { width:46px; height:46px; object-fit:contain; }
      h1 { color:#1A3566; font-size:22px; margin-bottom:2px; }
      .sub { color:#6B7280; font-size:13px; margin-bottom:16px; }
      .kpi-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
      .kpi { flex:1; min-width:90px; background:#F8FAFC; border:1px solid #E2E6ED; border-radius:8px; padding:10px 12px; }
      .kpi-val { font-size:19px; font-weight:700; color:#1A3566; }
      .kpi-label { font-size:11px; color:#6B7280; }
      h2 { color:#1A3566; font-size:15px; margin:20px 0 8px; }
      h3 { color:#1A3566; font-size:13px; margin:14px 0 6px; }
      .report-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:13px; margin-bottom:10px; }
      .report-table th { background:#1A3566; color:#fff; text-align:left; padding:7px 10px; }
      .report-table td { padding:6px 10px; border-bottom:1px solid #E2E6ED; }
      .report-table tr:nth-child(even) { background:#F8FAFC; }
      .cost-highlight { background:#F8FAFC; border:1px solid #E2E6ED; border-radius:8px; padding:12px 16px; margin-bottom:16px; }
      .cost-val { font-size:23px; font-weight:700; color:#1A3566; }
      .cost-label { font-size:11px; color:#6B7280; }
      .empty { color:#6B7280; font-style:italic; padding:8px 0; font-size:13px; }
      .download-btn { background:#1A3566; color:#fff; border:none; border-radius:8px; padding:10px 20px; font-size:13px; font-weight:600; cursor:pointer; margin-bottom:16px; }
      @media print { .download-btn { display:none; } }
    </style></head>
    <body>
      <button class="download-btn" onclick="window.print()">↓ Download as PDF</button>
      <div class="report-header">
        <img src="/logo.png" alt="${CLIENT_CONFIG.clientName}" onerror="this.style.display='none'">
        <div>
          <h1>${title}</h1>
          <div class="sub" style="margin-bottom:0">Prepared for ${CLIENT_CONFIG.clientName} · ${periodLabel}</div>
        </div>
      </div>

      <h2>Work Orders</h2>
      <div class="kpi-row">
        <div class="kpi"><div class="kpi-val">${ws.completed || 0}</div><div class="kpi-label">Completed</div></div>
        <div class="kpi"><div class="kpi-val">${ws.open || 0}</div><div class="kpi-label">Open</div></div>
        <div class="kpi"><div class="kpi-val">${ws.inProgress || 0}</div><div class="kpi-label">In Progress</div></div>
        <div class="kpi"><div class="kpi-val">${ws.readyForReview || 0}</div><div class="kpi-label">Ready for Review</div></div>
        <div class="kpi"><div class="kpi-val">${ws.overdue || 0}</div><div class="kpi-label">Overdue</div></div>
        <div class="kpi"><div class="kpi-val">${ws.urgent || 0}</div><div class="kpi-label">Urgent</div></div>
        <div class="kpi"><div class="kpi-val">${ws.upcoming || 0}</div><div class="kpi-label">Upcoming</div></div>
      </div>

      <div class="cost-highlight">
        <div class="cost-val">${formatCurrency(data.totalCost || 0)}</div>
        <div class="cost-label">Total maintenance cost this period</div>
      </div>

      ${Object.keys(maintItemsByType).length > 0 ? `
      <h2>Maintenance Worked, By Type</h2>
      ${Object.entries(maintItemsByType).map(([type, items]) => `
        <h3>${type} (${items.length})</h3>
        ${itemTable(items)}
      `).join('')}
      ` : '<div class="empty">No maintenance work recorded this period yet.</div>'}

      <h2>Alerts — ${data.totalAlerts} Total</h2>
      ${data.totalAlerts === 0 ? '<div class="empty">No alerts in this period.</div>' :
        Object.entries(alertsByUrgency).map(([urgency, items]) => `
          <h3>${urgency} (${items.length})</h3>
          ${itemTable(items)}
        `).join('')}
    </body></html>
  `;
}

async function generateMonthlyReport() {
  try {

    const periodLabel = `${new Date(data.periodStart).toLocaleDateString()} to ${new Date(data.periodEnd).toLocaleDateString()}`;

function buildReportExportRows(data) {
  const ws = data.workOrderStatus || {};
  const fmt = (iso) => iso ? new Date(iso).toLocaleDateString() : '';
  const rows = [];

  rows.push(['Work Orders Summary']);
  rows.push(['Completed', ws.completed || 0]);
  rows.push(['Open', ws.open || 0]);
  rows.push(['In Progress', ws.inProgress || 0]);
  rows.push(['Ready for Review', ws.readyForReview || 0]);
  rows.push(['Overdue', ws.overdue || 0]);
  rows.push(['Urgent', ws.urgent || 0]);
  rows.push(['Upcoming', ws.upcoming || 0]);
  rows.push([]);
  rows.push(['Total Maintenance Cost This Period (TZS)', data.totalCost || 0]);
  rows.push([]);

  rows.push(['Section', 'Type/Urgency', 'Item', 'Date Opened', 'Date Closed']);
  for (const [type, items] of Object.entries(data.maintenanceItemsByType || {})) {
    items.forEach(i => rows.push(['Maintenance', type, i.name, fmt(i.dateOpened), i.dateClosed ? fmt(i.dateClosed) : 'Not Closed']));
  }
  (data.alerts || []).forEach(a => rows.push(['Alert', a.urgency, a.assetName, fmt(a.dateOpened), a.dateClosed ? fmt(a.dateClosed) : 'Not Closed']));
  return rows;
}

// First column bolded throughout — labels in the summary block, and
// the Section column in the item table below it.
function applyFirstColumnBold(ws, rowCount) {
  for (let r = 0; r < rowCount; r++) {
    const addr = XLSX.utils.encode_cell({ r, c: 0 });
    if (ws[addr]) {
      ws[addr].s = Object.assign({}, ws[addr].s, { font: { bold: true } });
    }
  }
}

function hasReportData(data) {
  return Object.keys(data.maintenanceItemsByType || {}).length > 0 || (data.alerts || []).length > 0;
}

async function exportMonthlyReportCSV() {
  try {
    const resp = await fetch('/api/get-assets?monthlyreport=true');
    if (!resp.ok) throw new Error('Failed');
    const data = await resp.json();
    if (!hasReportData(data)) { alert('No report data yet.'); return; }
    const rows = buildReportExportRows(data);
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `monthly-report-${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
  } catch (err) { alert('Could not export: ' + err.message); }
}

function onAddAssetFacilityChange() {
  const facilityName = document.getElementById('na_facility')?.value;
  const buildingSel = document.getElementById('na_building');
  if (!buildingSel) return;
  const facility = facilitiesData.find(f => f.name === facilityName);
  const buildings = facility ? facility.buildings : [];
  buildingSel.innerHTML = buildings.map(b => `<option value="${b}">${b}</option>`).join('');
  onCategoryChange();
}

  overlay.id = 'addFacilityOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1100;padding:20px';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;padding:24px;width:380px;max-width:90vw">
      <div style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px">Add Facility</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px">A new campus or site. Its short code is generated automatically — you don't choose it.</div>
      <label style="font-size:11px;font-weight:600;color:var(--navy);display:block;margin-bottom:4px">Facility Name *</label>
      <input id="af_name" type="text" placeholder="e.g. Game City" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:14px">
      <div id="af_error" style="display:none;color:var(--red);font-size:12px;margin-bottom:10px"></div>
      <div style="display:flex;gap:8px">
        <button onclick="document.getElementById('addFacilityOverlay').remove()" style="flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--navy);font-weight:600;font-size:13px;cursor:pointer">Cancel</button>
        <button id="af_submit" onclick="submitAddFacility()" style="flex:1;padding:9px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:600;font-size:13px;cursor:pointer">Add Facility</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('af_name').focus();
}

async function submitAddFacility() {
  const name = document.getElementById('af_name').value.trim();
  const errorBox = document.getElementById('af_error');
  const btn = document.getElementById('af_submit');
  errorBox.style.display = 'none';
  if (!name) { errorBox.textContent = 'Enter a facility name.'; errorBox.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    const resp = await fetch('/api/work-orders', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ addFacility: true, name }),
    });
    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || 'Could not add facility');

    await refreshFacilitiesData();
    document.getElementById('addFacilityOverlay')?.remove();

    // Reflect the new facility straight into the Add Asset form it was
    // opened from, selected and ready, rather than leaving the person
    // to find it in the list themselves.
    const facilitySel = document.getElementById('na_facility');
    if (facilitySel) {
      facilitySel.innerHTML = facilitiesData.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
      facilitySel.value = data.facility.name;
      onAddAssetFacilityChange();
    }
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Add Facility';
  }
}

function openAddBuildingModal() {

  if (!facility) { alert('Choose a facility first.'); return; }

  const overlay = document.createElement('div');
  overlay.id = 'addBuildingOverlay';

  overlay.innerHTML = `
    <div style="background:#fff;border-radius:12px;padding:24px;width:380px;max-width:90vw">
      <div style="font-size:14px;font-weight:700;color:var(--navy);margin-bottom:6px">Add Building</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px">Adding to <strong>${escapeHtml(facilityName)}</strong>.</div>
      <label style="font-size:11px;font-weight:600;color:var(--navy);display:block;margin-bottom:4px">Building Name *</label>
      <input id="ab_name" type="text" placeholder="e.g. Mall 2" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:14px">
      <div id="ab_error" style="display:none;color:var(--red);font-size:12px;margin-bottom:10px"></div>
      <div style="display:flex;gap:8px">

      </div>
    </div>`;
